tion:{reference:"Allen Test Series 0999DMD363104260001 (Q1)",text:`For two vectors to be parallel, their corresponding components must be proportional:
2/n = 6/12 = m/4
6/12 = 1/2 \u21D2 2/n = 1/2 \u21D2 n = 4
m/4 = 1/2 \u21D2 m = 2
Therefore, product m \xD7 n = 2 \xD7 4 = 8.`,steps:["Condition for parallel vectors: a_x / b_x = a_y / b_y = a_z / b_z","2/n = 6/12 = m/4","n = 4 and m = 2","Product m \xD7 n = 2 \xD7 4 = 8"]}},{id:2,subject:"Physics",topic:"Kinematics & Vector Subtraction",questionText:"A truck travelling due north at 20 m/s turns west and travels at the same speed. The change in its velocity be :-",options:["40 m/s N-W","20\u221A2 m/s N-W","40 m/s S-W","20\u221A2 m/s S-W"],correctAnswer:4,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q2)",text:`Initial velocity v\u20D7_i = 20 j\u0302 (North)
Final velocity v\u20D7_f = -20 i\u0302 (West)
Change in velocity \u0394v\u20D7 = v\u20D7_f - v\u20D7_i = -20 i\u0302 - 20 j\u0302
Magnitude |\u0394v\u20D7| = \u221A((-20)\xB2 + (-20)\xB2) = 20\u221A2 m/s
Direction: -i\u0302 is West, -j\u0302 is South, so direction is South-West (S-W).`,steps:["Initial velocity v\u20D7_i = 20 j\u0302 m/s","Final velocity v\u20D7_f = -20 i\u0302 m/s","Change in velocity \u0394v\u20D7 = v\u20D7_f - v\u20D7_i = -20 i\u0302 - 20 j\u0302 m/s","|\u0394v\u20D7| = \u221A(20\xB2 + 20\xB2) = 20\u221A2 m/s towards South-West (S-W)"]}},{id:3,subject:"Physics",topic:"Calculus in Physics (Integration)",questionText:"\u222B 2 sin(2x + 3) dx = ................. ?",options:["4 cos(2x + 3) + C","cos(2x + 3)/2 + C","\u2013 cos(2x + 3) + C","\u2013 cos(2x + 3)/4 + C"],correctAnswer:3,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q3)",text:`Using standard integral formula: \u222B sin(ax + b) dx = - (1/a) cos(ax + b) + C
Here, \u222B 2 sin(2x + 3) dx = 2 \xD7 [ - (1/2) cos(2x + 3) ] + C = - cos(2x + 3) + C.`,steps:["\u222B sin(ax + b) dx = - (1/a) cos(ax + b) + C","\u222B 2 sin(2x + 3) dx = 2 \xD7 [-1/2 cos(2x + 3)] + C","= - cos(2x + 3) + C"]}},{id:4,subject:"Physics",topic:"Mathematical Tools (Trigonometry)",questionText:"cos(\u03B1 + \u03B2) \u2013 cos(\u03B1 \u2013 \u03B2) is equal to\u2013",options:["2 cos\u03B1 cos\u03B2","\u20132 cos\u03B1 cos\u03B2","2 sin\u03B1 sin\u03B2","\u20132 sin\u03B1 sin\u03B2"],correctAnswer:4,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q4)",text:`cos(\u03B1 + \u03B2) = cos\u03B1 cos\u03B2 - sin\u03B1 sin\u03B2
cos(\u03B1 - \u03B2) = cos\u03B1 cos\u03B2 + sin\u03B1 sin\u03B2
cos(\u03B1 + \u03B2) - cos(\u03B1 - \u03B2) = (cos\u03B1 cos\u03B2 - sin\u03B1 sin\u03B2) - (cos\u03B1 cos\u03B2 + sin\u03B1 sin\u03B2) = - 2 sin\u03B1 sin\u03B2.`,steps:["cos(\u03B1 + \u03B2) = cos\u03B1 cos\u03B2 - sin\u03B1 sin\u03B2","cos(\u03B1 - \u03B2) = cos\u03B1 cos\u03B2 + sin\u03B1 sin\u03B2","Subtracting gives: - 2 sin\u03B1 sin\u03B2"]}},{id:5,subject:"Physics",topic:"Vectors Addition & Resultant",questionText:"Vector A\u20D7 is 2cm long and is 60\xB0 above the x\u2013axis in the first quadrant. Vector B\u20D7 is 2cm long and is 60\xB0 below the x\u2013axis in the fourth quadrant. The sum A\u20D7 + B\u20D7 is a vector of magnitude",options:["2 cm along + y\u2013axis","2cm along +x\u2013axis","2 cm along \u2013y\u2013 axis","2 cm along \u2013 x\u2013 axis"],correctAnswer:2,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q5)",text:`A\u20D7 = 2 cos 60\xB0 i\u0302 + 2 sin 60\xB0 j\u0302 = 1 i\u0302 + \u221A3 j\u0302
B\u20D7 = 2 cos 60\xB0 i\u0302 - 2 sin 60\xB0 j\u0302 = 1 i\u0302 - \u221A3 j\u0302
A\u20D7 + B\u20D7 = (1 + 1) i\u0302 + (\u221A3 - \u221A3) j\u0302 = 2 i\u0302 cm.
Thus, resultant has magnitude 2 cm along the +x-axis.`,steps:["A\u20D7 = 2 cos 60\xB0 i\u0302 + 2 sin 60\xB0 j\u0302 = i\u0302 + \u221A3 j\u0302","B\u20D7 = 2 cos 60\xB0 i\u0302 - 2 sin 60\xB0 j\u0302 = i\u0302 - \u221A3 j\u0302","A\u20D7 + B\u20D7 = 2 i\u0302 cm (magnitude 2 cm along +x axis)"]}},{id:6,subject:"Physics",topic:"Kinematics (Differentiation)",questionText:"If velocity of particle varies with time as v = (t + 2)(t + 3), then its acceleration at t = 1s is :-",options:["5 m/s\xB2","7 m/s\xB2","2 m/s\xB2","3 m/s\xB2"],correctAnswer:2,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q6)",text:`v = (t + 2)(t + 3) = t\xB2 + 5t + 6
Acceleration a = dv/dt = d/dt(t\xB2 + 5t + 6) = 2t + 5
At t = 1 s: a = 2(1) + 5 = 7 m/s\xB2.`,steps:["v = t\xB2 + 5t + 6","a = dv/dt = 2t + 5","At t = 1 s, a = 2(1) + 5 = 7 m/s\xB2"]}},{id:7,subject:"Physics",topic:"Mathematical Tools (Quadratic Equations)",questionText:"The roots of 10x\xB2 \u2013 27x + 5 = 0 are :-",options:["2/5, 1/5","2/5, 5","5/2, 1/5","2, 5/2"],correctAnswer:3,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q7)",text:`10x\xB2 - 27x + 5 = 0
10x\xB2 - 25x - 2x + 5 = 0
5x(2x - 5) - 1(2x - 5) = 0
(5x - 1)(2x - 5) = 0
Roots: x = 1/5 and x = 5/2.`,steps:["Discriminant D = (-27)\xB2 - 4(10)(5) = 729 - 200 = 529 = 23\xB2","x = (27 \xB1 23) / 20","x\u2081 = 50/20 = 5/2, x\u2082 = 4/20 = 1/5"]}},{id:8,subject:"Physics",topic:"Vectors (Triangle Inequality of Forces)",questionText:"Which of the following group of forces can't produce zero resultant :",options:["10, 10, 10","10, 10, 20","10, 20, 20","10, 20, 40"],correctAnswer:4,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q8)",text:`For three forces to produce a zero resultant, the sum of any two forces must be greater than or equal to the third force (Triangle inequality: |A - B| \u2264 C \u2264 A + B).
For (10, 20, 40): 10 + 20 = 30 < 40, so they cannot form a closed triangle or produce zero resultant.`,steps:["Condition for zero resultant of 3 forces: sum of smaller two \u2265 largest","For 10, 20, 40: 10 + 20 = 30 < 40","Hence 10, 20, 40 cannot produce zero resultant"]}},{id:9,subject:"Physics",topic:"Maxima and Minima",questionText:"If y = 2x\xB2 \u2013 2x then find out minimum value of y:",options:["1/2","\u20131/2","3/2","\u20133/2"],correctAnswer:2,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q9)",text:`y = 2x\xB2 - 2x
dy/dx = 4x - 2 = 0 \u21D2 x = 1/2
d\xB2y/dx\xB2 = 4 > 0 (Minima)
Minimum value y_min = 2(1/2)\xB2 - 2(1/2) = 2(1/4) - 1 = 1/2 - 1 = -1/2.`,steps:["dy/dx = 4x - 2 = 0 \u21D2 x = 1/2","d\xB2y/dx\xB2 = 4 > 0 (confirms minimum)","y_min = 2(1/2)\xB2 - 2(1/2) = 1/2 - 1 = -1/2"]}},{id:10,subject:"Physics",topic:"Vectors (Cross Product vs Dot Product)",questionText:`Assertion : If angle between two vectors A\u20D7 and B\u20D7 is 45\xB0 then A\u20D7 \xD7 B\u20D7 = A\u20D7 \xB7 B\u20D7.
Reason : At \u03B8 = 45\xB0, sin \u03B8 = cos \u03B8
Choose correct alternative : -`,options:["Both are correct and reason is correct explanation for assertion.","Both are correct and reason is not correct explanation for assertion.","Assertion is wrong, reason is correct.","Assertion is correct, reason is wrong."],correctAnswer:3,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q10)",text:"A\u20D7 \xD7 B\u20D7 is a vector quantity (|A||B| sin \u03B8 n\u0302), whereas A\u20D7 \xB7 B\u20D7 is a scalar quantity (|A||B| cos \u03B8). A vector cannot be equated to a scalar without magnitude notation (|A\u20D7 \xD7 B\u20D7| = A\u20D7 \xB7 B\u20D7). Thus Assertion is wrong, while Reason (sin 45\xB0 = cos 45\xB0) is mathematically correct.",steps:["A\u20D7 \xD7 B\u20D7 is a vector, A\u20D7 \xB7 B\u20D7 is a scalar","Vector \u2260 Scalar, so Assertion is false","At \u03B8 = 45\xB0, sin 45\xB0 = cos 45\xB0 = 1/\u221A2, so Reason is true"]}},{id:11,subject:"Physics",topic:"Resolution of Vectors (Rotated Axes)",questionText:"A vector of magnitude 5m is placed in a coordinate system as shown in the figure. An auxiliary set of axes (x' and y') is formed by rotating the original axes clockwise by 16\xB0. Find the components of the vector along the new x' and y' axes.",diagramKey:"physics_q11",options:["(4,3)","(3,4)","(3/5, 4/5)","(4,5)"],correctAnswer:2,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q11)",text:`The vector is at an angle of 37\xB0 above the positive x-axis. The new x'-axis is formed by rotating the x-axis clockwise by 16\xB0 (i.e. 16\xB0 below the x-axis).
Total angle of the vector with the new x'-axis \u03B8' = 37\xB0 + 16\xB0 = 53\xB0.
Components along x' and y':
x' component = 5 cos 53\xB0 = 5 \xD7 (3/5) = 3 m
y' component = 5 sin 53\xB0 = 5 \xD7 (4/5) = 4 m
So components are (3, 4).`,steps:["Angle with original x-axis = 37\xB0","Rotation of new x' axis clockwise = 16\xB0","Total angle with x' axis \u03B8' = 37\xB0 + 16\xB0 = 53\xB0","x' = 5 cos 53\xB0 = 3 m, y' = 5 sin 53\xB0 = 4 m \u21D2 (3, 4)"]}},{id:12,subject:"Physics",topic:"Vector Projection",questionText:"Find the projection of i\u0302 + 2j\u0302 on 2i\u0302 + 3j\u0302 in vector form",options:["(8/\u221A5)(i\u0302 + 2j\u0302)","(8/13)(2i\u0302 + 3j\u0302)","(6/\u221A13)(2i\u0302 + 3j\u0302)","(6/\u221A5)(i\u0302 + 2j\u0302)"],correctAnswer:2,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q12)",text:`Let A\u20D7 = i\u0302 + 2j\u0302 and B\u20D7 = 2i\u0302 + 3j\u0302.
Vector projection of A\u20D7 on B\u20D7 = [(A\u20D7 \xB7 B\u20D7) / |B\u20D7|\xB2] B\u20D7
A\u20D7 \xB7 B\u20D7 = (1)(2) + (2)(3) = 2 + 6 = 8
|B\u20D7|\xB2 = 2\xB2 + 3\xB2 = 4 + 9 = 13
Vector projection = (8/13)(2i\u0302 + 3j\u0302).`,steps:["Projection vector = [(A\u20D7 \xB7 B\u20D7) / |B\u20D7|\xB2] B\u20D7","A\u20D7 \xB7 B\u20D7 = 1(2) + 2(3) = 8","|B\u20D7|\xB2 = 2\xB2 + 3\xB2 = 13","Projection = (8/13)(2i\u0302 + 3j\u0302)"]}},{id:13,subject:"Physics",topic:"Properties of Vectors",questionText:`Let A\u20D7, B\u20D7, C\u20D7 be three non-zero vectors. Consider the following statements:
(a) The sum of two vectors does not depend on their order.
(b) The subtraction of two vectors can be written by reversing the order with a negative sign.
(c) If the dot product of two vectors is zero, that one of the vectors must be a zero vector.
(d) The cross product of two vectors changes sign when the order of vectors is reversed.
Choose the correct option:`,options:["only a, b, d are correct","only a, c, d are correct","only a, b are correct","all are correct"],correctAnswer:1,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q13)",text:`(a) A\u20D7 + B\u20D7 = B\u20D7 + A\u20D7 (Commutative) \u2192 True
(b) A\u20D7 - B\u20D7 = -(B\u20D7 - A\u20D7) \u2192 True
(c) A\u20D7 \xB7 B\u20D7 = 0 means vectors can be perpendicular to each other; neither needs to be zero \u2192 False
(d) A\u20D7 \xD7 B\u20D7 = -(B\u20D7 \xD7 A\u20D7) (Anti-commutative) \u2192 True
Thus, statements a, b, d are correct.`,steps:["Vector addition is commutative: a is true","Vector subtraction anti-symmetry: b is true","Dot product zero only implies orthogonal non-zero vectors: c is false","Cross product is anti-commutative: d is true"]}},{id:14,subject:"Physics",topic:"Vernier Callipers & Zero Error",questionText:"The main scale of a vernier callipers reads 10 mm in 10 divisions. 10 divisions of Vernier scale coincide with 9 divisions of the main scale. When the two jaws of the callipers touch each other, the fifth division of the vernier coincides with 9 main scale divisions and the zero of the vernier is to the right of zero of main scale. When a cylinder is tightly placed between the two jaws, the zero of vernier scale lies slightly behind 3.2 cm and the fourth vernier division coincides with a main scale division. The diameter of the cylinder is.",options:["3.10 cm","3.8 cm","3.09 cm","\u20133.09 cm"],correctAnswer:3,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q14)",text:`1 MSD = 10 mm / 10 = 1 mm = 0.1 cm.
10 VSD = 9 MSD \u21D2 1 VSD = 0.9 mm.
Least Count (LC) = 1 MSD - 1 VSD = 0.1 mm = 0.01 cm.
Zero of Vernier is to the right of zero of main scale \u21D2 Positive Zero Error (+ZE) = +5 \xD7 LC = +0.5 mm = +0.05 cm.
When cylinder is measured: Zero of vernier lies slightly behind 3.2 cm \u21D2 Main Scale Reading (MSR) = 3.1 cm.
Vernier Scale Reading (VSR) = 4 \xD7 LC = 4 \xD7 0.01 cm = 0.04 cm.
Observed Reading = 3.1 + 0.04 = 3.14 cm.
Correct Reading = Observed Reading - ZE = 3.14 cm - 0.05 cm = 3.09 cm.`,steps:["LC = 1 MSD - 1 VSD = 1 mm - 0.9 mm = 0.1 mm = 0.01 cm","Positive Zero Error (+ZE) = +5 \xD7 0.01 cm = +0.05 cm","MSR = 3.1 cm, VSR = 4 \xD7 0.01 cm = 0.04 cm","True Reading = (3.1 + 0.04) - 0.05 = 3.09 cm"]}},{id:15,subject:"Physics",topic:"Units & Dimensions (Dimensional Analysis)",questionText:"If the time of oscillation (T) of a gas bubble from an explosion under water depends on static pressure (P), density of water (d) and total energy of explosion (E), find the relation between them : -",options:["T \u221D P^(\u20135/6) d^(1/2) E^(1/3)","T \u221D P^(1/2) d^(1/3) E^(1/2)","T \u221D P^(\u20135/6) d^(1/3) E^(1/2)","T \u221D P^(\u20132/3) d^(1/2) E^(1/3)"],correctAnswer:1,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q15)",text:`T \u221D P^a d^b E^c
[T] = [M L\u207B\xB9 T\u207B\xB2]^a [M L\u207B\xB3]^b [M L\xB2 T\u207B\xB2]^c
Equating powers of M, L, T:
M: a + b + c = 0
L: -a - 3b + 2c = 0
T: -2a - 2c = 1 \u21D2 a + c = -1/2
From M: b = -(a + c) = 1/2
From L: -a - 3(1/2) + 2c = 0 \u21D2 -a + 2c = 3/2
Solving: 3c = 1 \u21D2 c = 1/3
a = -1/2 - 1/3 = -5/6
Hence, T \u221D P^(\u20135/6) d^(1/2) E^(1/3).`,steps:["[T] = [M L\u207B\xB9 T\u207B\xB2]^a [M L\u207B\xB3]^b [M L\xB2 T\u207B\xB2]^c","a + b + c = 0, -a - 3b + 2c = 0, -2a - 2c = 1","b = 1/2, c = 1/3, a = -5/6","T \u221D P^(\u20135/6) d^(1/2) E^(1/3)"]}},{id:16,subject:"Physics",topic:"Screw Gauge & Negative Zero Error",questionText:`In an experiment to find out the diameter of wire using screw gauge, the following observations were noted :
(a) Screw moves 0.5 mm on main scale in one complete rotation
(b) Total divisions on circular scale = 50
(c) Main scale reading is 2.5 mm
(d) 45th division of circular scale is in the pitch line
(e) Instrument has 0.03 mm negative error
Then the diameter of wire is :`,diagramKey:"physics_q16",options:["2.92 mm","2.54 mm","2.98 mm","3.45 mm"],correctAnswer:3,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q16)",text:`Pitch = 0.5 mm
Least Count (LC) = Pitch / Total CSD = 0.5 mm / 50 = 0.01 mm
Observed Reading = MSR + (CSR \xD7 LC) = 2.5 mm + (45 \xD7 0.01 mm) = 2.5 + 0.45 = 2.95 mm
Correct Reading = Observed Reading - (Zero Error)
= 2.95 mm - (-0.03 mm) = 2.95 + 0.03 = 2.98 mm.`,steps:["LC = 0.5 mm / 50 = 0.01 mm","Observed = 2.5 mm + (45 \xD7 0.01 mm) = 2.95 mm","True Reading = 2.95 - (-0.03) = 2.98 mm"]}},{id:17,subject:"Physics",topic:"Dimensional Correctness (Stokes Law / Terminal Velocity)",questionText:"Which of the following relation is dimensionally correct for the terminal velocity (V) of a rain drop? (where r is radius, g is acceleration due to gravity, \u03C1 is density of drop, \u03C3 is density of air and \u03B7 is viscosity) : -",options:["V = (2/9) [r\xB2 g (\u03C1 - \u03C3) / \u03B7]","V = (2/9) [r g (\u03C1 - \u03C3) / \u03B7]","V = (2/9) [r\xB2 \u03B7 (\u03C1 - \u03C3) / g]","V = (2/9) [\u03B7 g / (r\xB2 (\u03C1 - \u03C3))]"],correctAnswer:1,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q17)",text:`Terminal velocity formula from Stokes law is V = (2/9) [r\xB2 g (\u03C1 - \u03C3) / \u03B7].
Dimensionally: [r\xB2 g (\u03C1 - \u03C3) / \u03B7] = [L\xB2][L T\u207B\xB2][M L\u207B\xB3] / [M L\u207B\xB9 T\u207B\xB9] = [M L\u2070 T\u207B\xB2] / [M L\u207B\xB9 T\u207B\xB9] = [L T\u207B\xB9], which matches the dimension of velocity.`,steps:["LHS: [V] = [L T\u207B\xB9]","RHS: [r\xB2 g (\u03C1 - \u03C3) / \u03B7] = [L\xB2][L T\u207B\xB2][M L\u207B\xB3] / [M L\u207B\xB9 T\u207B\xB9] = [L T\u207B\xB9]","Option (1) is dimensionally correct"]}},{id:18,subject:"Physics",topic:"Units & Measurements (Light Year & Parsec)",questionText:`Assertion : Light year and parallactic second used to measure time.
Reason : Both light year and parallactic second have the dimensions of length (L).
Choose the correct option:`,options:["Both A & R are true, R is correct explaination of A.","Both A & R are true, R is not correct explaination of A.","A is true but R is false.","A is false but R is true."],correctAnswer:4,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q18)",text:"Light year (distance travelled by light in vacuum in 1 year = 9.46 \xD7 10\xB9\u2075 m) and Parallactic second (parsec = 3.08 \xD7 10\xB9\u2076 m) are both units of astronomical distance/length, not time. Thus, Assertion is false and Reason is true.",steps:["Light year and parsec measure astronomical distance (length)","Assertion: says they measure time \u2192 False","Reason: both have dimension of length [L] \u2192 True"]}},{id:19,subject:"Physics",topic:"Errors & Propagation",questionText:"The mass and volume of a body are found to be (5.00 \xB1 0.05) kg and (1.00 \xB1 0.05) m\xB3 respectively. Then the maximum possible percentage error in density :-",options:["3%","10%","6%","5%"],correctAnswer:3,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q19)",text:`Density \u03C1 = m / V
(\u0394\u03C1 / \u03C1) \xD7 100% = [(\u0394m / m) + (\u0394V / V)] \xD7 100%
= (0.05 / 5.00) \xD7 100% + (0.05 / 1.00) \xD7 100%
= 1% + 5% = 6%.`,steps:["\u0394\u03C1/\u03C1 = \u0394m/m + \u0394V/V","\u0394m/m \xD7 100% = 0.05 / 5.00 \xD7 100 = 1%","\u0394V/V \xD7 100% = 0.05 / 1.00 \xD7 100 = 5%","Total % error = 1% + 5% = 6%"]}},{id:20,subject:"Physics",topic:"Principle of Homogeneity & Dimensions",questionText:`In each of the following expression A, B and C represent lengths :-
I. A + B
II. AB
III. AB / C
IV. A / (B + C)
Which of the following statements is incorrect ?`,options:["One of them has dimensions of volume","One of them has dimensions of area","Two of them have dimensions of length","One of them is dimensionless"],correctAnswer:1,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q20)",text:`I. [A + B] = [L] (Length)
II. [AB] = [L][L] = [L\xB2] (Area)
III. [AB / C] = [L\xB2] / [L] = [L] (Length)
IV. [A / (B + C)] = [L] / [L] = [M\u2070 L\u2070 T\u2070] (Dimensionless)
None of the expressions has dimensions of volume [L\xB3]. Hence statement (1) is incorrect.`,steps:["I: [A+B] = L","II: [AB] = L\xB2 (Area)","III: [AB/C] = L (Length)","IV: [A/(B+C)] = L/L = 1 (Dimensionless)","Statement (1) claiming one has volume dimension is incorrect"]}},{id:21,subject:"Physics",topic:"Dimensional Analysis (Frequency of Spring)",questionText:"The frequency of vibration \u0192 of a mass m suspended from a spring of spring constant k is given by a relation of this type \u0192 = c m^x k^y; where c is dimensionless quantity. The values of x and y are :-",options:["x = 1/2, y = 1/2","x = -1/2, y = -1/2","x = 1/2, y = -1/2","x = -1/2, y = 1/2"],correctAnswer:4,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q21)",text:`[f] = [T\u207B\xB9] = [M\u2070 L\u2070 T\u207B\xB9]
[m] = [M]
[k] = [Force/displacement] = [M T\u207B\xB2]
[T\u207B\xB9] = [M]^x [M T\u207B\xB2]^y = [M^(x+y) T^(-2y)]
Equating powers:
x + y = 0 \u21D2 x = -y
-2y = -1 \u21D2 y = 1/2
Thus, x = -1/2 and y = 1/2.`,steps:["[f] = [M\u2070 L\u2070 T\u207B\xB9], [m] = [M], [k] = [M T\u207B\xB2]","M^(x+y) T^(-2y) = M\u2070 T\u207B\xB9","-2y = -1 \u21D2 y = 1/2","x + y = 0 \u21D2 x = -1/2"]}},{id:22,subject:"Physics",topic:"Conversion of Units (Dimensions of Power)",questionText:"In a certain system of units, 1 unit of time is 5 sec, 1 unit of mass is 20 kg and unit of length is 10m. In this system, one unit of power will correspond to",options:["16 watts","1/16 watts","25 watts","none of these"],correctAnswer:1,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q22)",text:`Dimension of Power [P] = [M L\xB2 T\u207B\xB3]
1 Unit of Power = (1 unit of mass) \xD7 (1 unit of length)\xB2 \xD7 (1 unit of time)\u207B\xB3
= (20 kg) \xD7 (10 m)\xB2 \xD7 (5 s)\u207B\xB3
= 20 \xD7 100 / 125 = 2000 / 125 = 16 W (watts).`,steps:["[P] = [M L\xB2 T\u207B\xB3]","n\u2082 / n\u2081 = [M\u2081/M\u2082]\xB9 [L\u2081/L\u2082]\xB2 [T\u2081/T\u2082]\u207B\xB3","1 new unit = 20 \xD7 (10)\xB2 / (5)\xB3 = 2000 / 125 = 16 Watts"]}},{id:23,subject:"Physics",topic:"Dimensional Formula Match",questionText:`Match the physical quantities given in column I with dimensions in column II :-
Column I:
a. Torque
b. Angular momentum
c. Latent heat
d. Surface tension
e. Light year
Column II:
P. [M L\xB2 T\u207B\xB9]
q. [M\u2070 L\xB2 T\u207B\xB2]
r. [M\u2070 L\u2070 T\xB9]
s. [M\u2070 L\xB9 T\u2070]
t. [M L\xB2 T\u207B\xB2]
u. [M L\u2070 T\u207B\xB2]`,options:["a \u2013 t, b \u2013 p, c \u2013 q, d \u2013 u, e \u2013 s","a \u2013 q, b \u2013 r, c \u2013 p, d \u2013 t, e \u2013 s","a \u2013 q, b \u2013 p, c \u2013 t, d \u2013 r, e \u2013 s","a \u2013 t, b \u2013 s, c \u2013 q, d \u2013 p, e \u2013 r"],correctAnswer:1,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q23)",text:`a. Torque = [M L\xB2 T\u207B\xB2] (t)
b. Angular momentum = [M L\xB2 T\u207B\xB9] (p)
c. Latent heat = Q/m = [L\xB2 T\u207B\xB2] = [M\u2070 L\xB2 T\u207B\xB2] (q)
d. Surface tension = F/L = [M T\u207B\xB2] = [M L\u2070 T\u207B\xB2] (u)
e. Light year = Distance = [L] = [M\u2070 L\xB9 T\u2070] (s)
Matching: a-t, b-p, c-q, d-u, e-s.`,steps:["Torque = [M L\xB2 T\u207B\xB2] \u2192 t","Angular momentum = [M L\xB2 T\u207B\xB9] \u2192 p","Latent heat = [M\u2070 L\xB2 T\u207B\xB2] \u2192 q","Surface tension = [M L\u2070 T\u207B\xB2] \u2192 u","Light year = [M\u2070 L\xB9 T\u2070] \u2192 s"]}},{id:24,subject:"Physics",topic:"Error Propagation in Formulas",questionText:"For Z = a\xB2 x\xB3 y^(1/2), where \u2018a\u2019 is a constant. If percentage error in measurement of \u2018x\u2019 and \u2018y\u2019 are 4% and 12%, respectively, then the percentage error for \u2018z\u2019 will be %.",options:["14%","18%","20%","22%"],correctAnswer:2,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q24)",text:`Z = a\xB2 x\xB3 y^(1/2), where a is constant (\u0394a = 0).
(\u0394Z / Z) \xD7 100 = 3 (\u0394x / x \xD7 100) + (1/2) (\u0394y / y \xD7 100)
= 3(4%) + (1/2)(12%) = 12% + 6% = 18%.`,steps:["\u0394Z/Z = 3(\u0394x/x) + (1/2)(\u0394y/y)","= 3(4%) + (1/2)(12%)","= 12% + 6% = 18%"]}},{id:25,subject:"Physics",topic:"Significant Figures",questionText:`Assertion (A) : - The number of significant figures in 0.005 is one, while in 0.500 it is three.
Reason (R) : - Zeros to the left of the first non-zero digit are not significant, but trailing zeros in a number with a decimal points are significant.
Choose correct option:`,options:["A & R are correct & R is correct explanation of A.","A & R are correct but R is not correct explanation of A.","A is correct but R is not correct.","A is not correct but R is correct."],correctAnswer:1,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q25)",text:`In 0.005, leading zeros are not significant, so it has 1 significant figure.
In 0.500, trailing zeros after decimal point are significant, so it has 3 significant figures.
Reason correctly states both rules. Therefore, both A & R are correct and R is the correct explanation of A.`,steps:["0.005: leading zeros are placeholders \u2192 1 SF","0.500: trailing zeros after decimal indicate precision \u2192 3 SF","Reason states the exact rule that explains Assertion"]}},{id:26,subject:"Physics",topic:"Electrostatics (Equilibrium of Charges)",questionText:"Two charge particles are shown in the diagram. Where should a third charge particle q\u2080 be placed so q\u2080 will be in equilibrium :-",diagramKey:"physics_q26",options:["x = 10 a","x = 8 a","x = 11 a","x = 12 a"],correctAnswer:1,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q26)",text:`Charges are +16q at x\u2081 = 2a and +25q at x\u2082 = 20a.
Separation distance d = 20a - 2a = 18a.
For equilibrium of third charge q\u2080 placed at distance r from +16q:
k(16q)q\u2080 / r\xB2 = k(25q)q\u2080 / (18a - r)\xB2
Taking square root on both sides:
4 / r = 5 / (18a - r)
72a - 4r = 5r \u21D2 9r = 72a \u21D2 r = 8a.
Position of q\u2080 on x-axis: x = 2a + r = 2a + 8a = 10a.`,steps:["Separation d = 20a - 2a = 18a","k(16q)/r\xB2 = k(25q)/(18a - r)\xB2","4/r = 5/(18a - r) \u21D2 9r = 72a \u21D2 r = 8a from +16q","x = 2a + 8a = 10a"]}},{id:27,subject:"Physics",topic:"Electrostatics (Suspended Pith Balls)",questionText:"Two pith balls each with mass m are suspended from insulating threads. When the pith balls are given equal positive charge Q, they hang in equilibrium as shown. We now increase the charge on the left pith ball from Q to 2Q while leaving its mass essentially unchanged. Which of the following diagrams best represents the new equilibrium configuration?",diagramKey:"physics_q27",options:["Left angle remains \u03B8, right angle increases","Left angle > right angle","Right angle > left angle","Both threads deflect by equal angle \u03B8' > \u03B8"],correctAnswer:4,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q27)",text:`According to Newton\u2019s third law, the electrostatic repulsive force on both pith balls is identical in magnitude (F_e = k(2Q)(Q)/r\xB2).
Since both balls have the same mass m, tan \u03B8 = F_e / (mg) is the same for both threads.
As the charge is increased, F_e increases, so both threads make an equal, increased angle \u03B8' > \u03B8 with the vertical.`,steps:["Electrostatic force on both balls is equal in magnitude (Action-Reaction)","Both balls have equal mass m, so tan \u03B8\u2081 = F_e / mg = tan \u03B8\u2082","Both angles remain equal to each other (\u03B8\u2081 = \u03B8\u2082 = \u03B8' > \u03B8)"]}},{id:28,subject:"Physics",topic:"Coulomb's Law in Vector Form",questionText:"A charge particle q\u2081 is at position (2, \u20131, 3). The electrostatic force on another charged particle q\u2082 at (0, 0, 0) is :",options:["[q\u2081q\u2082 / (56\u03C0\u03B5\u2080)] (2i\u0302 \u2013 j\u0302 + 3k\u0302)","[q\u2081q\u2082 / (56\u221A14\u03C0\u03B5\u2080)] (2i\u0302 \u2013 j\u0302 + 3k\u0302)","[q\u2081q\u2082 / (56\u03C0\u03B5\u2080)] (j\u0302 \u2013 2i\u0302 \u2013 3k\u0302)","[q\u2081q\u2082 / (56\u221A14\u03C0\u03B5\u2080)] (\u20132i\u0302 + j\u0302 \u2013 3k\u0302)"],correctAnswer:4,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q28)",text:`Position vector of q\u2081: r\u20D7\u2081 = 2i\u0302 - j\u0302 + 3k\u0302
Position vector of q\u2082: r\u20D7\u2082 = 0i\u0302 + 0j\u0302 + 0k\u0302
Vector from q\u2081 to q\u2082: r\u20D7 = r\u20D7\u2082 - r\u20D7\u2081 = -2i\u0302 + j\u0302 - 3k\u0302
Distance r = \u221A((-2)\xB2 + 1\xB2 + (-3)\xB2) = \u221A(4 + 1 + 9) = \u221A14
Force F\u20D7\u2082\u2081 = [1 / (4\u03C0\u03B5\u2080)] [q\u2081q\u2082 / r\xB3] r\u20D7
= [1 / (4\u03C0\u03B5\u2080)] [q\u2081q\u2082 / (14\u221A14)] (-2i\u0302 + j\u0302 - 3k\u0302)
= [q\u2081q\u2082 / (56\u221A14\u03C0\u03B5\u2080)] (-2i\u0302 + j\u0302 - 3k\u0302).`,steps:["Displacement vector r\u20D7 = r\u20D7\u2082 - r\u20D7\u2081 = -2i\u0302 + j\u0302 - 3k\u0302","Magnitude r = \u221A14, r\xB3 = 14\u221A14","F\u20D7\u2082\u2081 = [1 / (4\u03C0\u03B5\u2080)] [q\u2081q\u2082 / r\xB3] r\u20D7","= [q\u2081q\u2082 / (56\u221A14\u03C0\u03B5\u2080)] (-2i\u0302 + j\u0302 - 3k\u0302)"]}},{id:29,subject:"Physics",topic:"Electrostatic Potential Energy of System",questionText:"Two negative charge, each of magnitude q are situated at 2r distance apart. A positive charge q is lying at the centre between them. The potential energy of the system is U\u2081. If the two nearest charges are mutually interchanged and the potential energy becomes U\u2082, then U\u2081/U\u2082 will be :-",options:["3","5","2","1"],correctAnswer:1,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q29)",text:`Initial configuration: -q at x=0, +q at x=r, -q at x=2r.
U\u2081 = U(-q, +q) + U(+q, -q) + U(-q, -q)
= -kq\xB2/r - kq\xB2/r + k(-q)(-q)/(2r) = -2kq\xB2/r + kq\xB2/(2r) = -3kq\xB2/(2r).
After swapping the left negative charge and middle positive charge (+q at x=0, -q at x=r, -q at x=2r):
U\u2082 = U(+q, -q) + U(-q, -q) + U(+q, -q)
= -kq\xB2/r + kq\xB2/r - kq\xB2/(2r) = -kq\xB2/(2r).
Ratio U\u2081 / U\u2082 = (-3kq\xB2/(2r)) / (-kq\xB2/(2r)) = 3.`,steps:["U\u2081 = -kq\xB2/r - kq\xB2/r + kq\xB2/(2r) = -3kq\xB2/(2r)","U\u2082 = -kq\xB2/r + kq\xB2/r - kq\xB2/(2r) = -kq\xB2/(2r)","U\u2081 / U\u2082 = (-3/2) / (-1/2) = 3"]}},{id:30,subject:"Physics",topic:"Electric Field of Continuous Charge Distributions",questionText:"In the figure shown, find the ratio of the linear charge densities \u03BB\u2081 (on semi-infinite straight wire) and \u03BB\u2082 (on semi-circular part) that is \u03BB\u2081/\u03BB\u2082 so that the field at O is along y direction.",diagramKey:"physics_q30",options:["2","1.5","3","2.5"],correctAnswer:1,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q30)",text:`For the semi-infinite straight wire extending along the +x axis at distance R below O:
Electric field components at O: E_x = k\u03BB\u2081/R (towards -x) and E_y = k\u03BB\u2081/R (towards +y).
For the semi-circular arc of radius R:
Electric field is purely along the x-axis: E_x' = 2k\u03BB\u2082/R (towards +x).
For net electric field at O to be purely along y-direction, x-components must cancel:
k\u03BB\u2081/R = 2k\u03BB\u2082/R \u21D2 \u03BB\u2081 = 2\u03BB\u2082 \u21D2 \u03BB\u2081/\u03BB\u2082 = 2.`,steps:["E_x (wire) = k\u03BB\u2081 / R (leftward)","E_x (semi-circle) = 2k\u03BB\u2082 / R (rightward)","For net field along y-axis: k\u03BB\u2081 / R = 2k\u03BB\u2082 / R \u21D2 \u03BB\u2081/\u03BB\u2082 = 2"]}},{id:31,subject:"Physics",topic:"Electric Field Lines",questionText:"Three positive charges of equal value q are placed at vertices of an equilateral triangle. The resulting lines of force should be sketched as in :-",diagramKey:"physics_q31",options:["Symmetrical outward curves bending away from the centre with a central neutral point","Lines connecting the charges directly","Circular concentric closed loops around the triangle","Triangular closed loops"],correctAnswer:1,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q31)",text:"Field lines from identical positive charges originate radially outward and repel each other. They bend away from the central region forming a neutral point at the centroid where electric field is zero. They never form closed loops or connect positive charges to positive charges.",steps:["Field lines emerge from positive charges and never form closed loops","Mutual repulsion causes lines to bend away from the centroid","Sketch (1) correctly shows 3-fold symmetry with a central neutral point"]}},{id:32,subject:"Physics",topic:"Quantization of Charge & Conduction",questionText:"Two identical spheres carrying charges \u20139\xB5C and 5\xB5C respectively are kept in contact and then separated from each other. Point out true statement from the following. On each sphere (after contact) :-",options:["1.25 \xD7 10\xB9\xB3 electrons are in deficit","1.25 \xD7 10\xB9\xB3 electrons are in excess","2.15 \xD7 10\xB9\xB3 electrons are in excess","2.15 \xD7 10\xB9\xB3 electrons are in deficit"],correctAnswer:2,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q32)",text:`Total charge Q_total = -9 \xB5C + 5 \xB5C = -4 \xB5C.
Since spheres are identical, charge on each sphere after contact q = Q_total / 2 = -2 \xB5C.
Since the charge is negative, there is an excess of electrons.
Number of excess electrons n = q / e = (2 \xD7 10\u207B\u2076 C) / (1.6 \xD7 10\u207B\xB9\u2079 C) = 1.25 \xD7 10\xB9\xB3 electrons in excess.`,steps:["q = (-9 + 5) / 2 = -2 \xB5C on each sphere","Negative charge means excess of electrons","n = 2 \xD7 10\u207B\u2076 / (1.6 \xD7 10\u207B\xB9\u2079) = 1.25 \xD7 10\xB9\xB3 electrons in excess"]}},{id:33,subject:"Physics",topic:"Potential of Uniformly Charged Solid Sphere",questionText:"A point charge (+q) of mass m is released from a distance R/2 from the centre of a solid sphere of radius R and charge Q (uniformly charged in volume). The speed of the point charge when it reaches a distance R from the surface of the sphere (there is no interaction between sphere and point charge other than electrostatic). k = 1/(4\u03C0\u03B5\u2080)",diagramKey:"physics_q33",options:["\u221A(7kQq / (16mR))","\u221A(7kQq / (4mR))","\u221A(5kQq / (16mR))","\u221A(3kQq / (4mR))"],correctAnswer:2,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q33)",text:`Potential inside solid sphere at r = R/2:
V_i = [kQ / (2R\xB3)] [3R\xB2 - (R/2)\xB2] = [kQ / (2R\xB3)] [11R\xB2/4] = 11kQ / (8R).
Potential outside sphere at distance 2R from centre (distance R from surface):
V_f = kQ / (2R) = 4kQ / (8R).
Potential difference \u0394V = V_i - V_f = (11 - 4)kQ / (8R) = 7kQ / (8R).
Conservation of energy: (1/2)mv\xB2 = q \u0394V = 7kQq / (8R) \u21D2 v = \u221A(7kQq / (4mR)).`,steps:["V_inside(r = R/2) = kQ/(2R\xB3) [3R\xB2 - (R/2)\xB2] = 11kQ / (8R)","V_outside(r = 2R) = kQ / (2R)","Work done = q(V_i - V_f) = 7kQq / (8R)","(1/2)mv\xB2 = 7kQq / (8R) \u21D2 v = \u221A(7kQq / (4mR))"]}},{id:34,subject:"Physics",topic:"Electric Field as Negative Gradient of Potential",questionText:"Electric potential at a point is: V = x\xB2y + yz. The electric field at the point (1, 3, 1) is",options:["7 units","70 units","49 units","490 units"],correctAnswer:1,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q34)",text:`E\u20D7 = - [ (\u2202V/\u2202x) i\u0302 + (\u2202V/\u2202y) j\u0302 + (\u2202V/\u2202z) k\u0302 ]
\u2202V/\u2202x = 2xy \u21D2 at (1,3,1) = 2(1)(3) = 6 \u21D2 E_x = -6
\u2202V/\u2202y = x\xB2 + z \u21D2 at (1,3,1) = 1\xB2 + 1 = 2 \u21D2 E_y = -2
\u2202V/\u2202z = y \u21D2 at (1,3,1) = 3 \u21D2 E_z = -3
Magnitude |E\u20D7| = \u221A((-6)\xB2 + (-2)\xB2 + (-3)\xB2) = \u221A(36 + 4 + 9) = \u221A49 = 7 units.`,steps:["E_x = -\u2202V/\u2202x = -2xy = -6","E_y = -\u2202V/\u2202y = -(x\xB2 + z) = -2","E_z = -\u2202V/\u2202z = -y = -3","|E\u20D7| = \u221A(36 + 4 + 9) = \u221A49 = 7 units"]}},{id:35,subject:"Physics",topic:"Work Done in Rotating Dipole",questionText:"An electric dipole of moment P\u20D7 is kept in a uniform electric field E\u20D7. Angle between P\u20D7 and E\u20D7 is 30\xB0. Calculate work done by field when angle is increased to 60\xB0.",options:["(pE/2)(\u221A3 \u2013 1)","(pE/2)(1 \u2013 \u221A3)","(pE)(\u221A3 \u2013 \u221A2)","zero"],correctAnswer:2,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q35)",text:`Work done by electric field W_field = -\u0394U = U_initial - U_final
= -pE cos \u03B8\u2081 - (-pE cos \u03B8\u2082) = pE(cos \u03B8\u2082 - cos \u03B8\u2081)
= pE(cos 60\xB0 - cos 30\xB0) = pE(1/2 - \u221A3/2) = (pE/2)(1 - \u221A3).`,steps:["W_field = -\u0394U = pE(cos \u03B8\u2082 - cos \u03B8\u2081)","\u03B8\u2081 = 30\xB0, \u03B8\u2082 = 60\xB0","W = pE(1/2 - \u221A3/2) = (pE/2)(1 - \u221A3)"]}},{id:36,subject:"Physics",topic:"Electrostatic Shielding in Conductors",questionText:"The figure shows a charge q placed inside a cavity in an uncharged conductor. Now if an external electric field is switched on then :",diagramKey:"physics_q36",options:["only induced charge on outer surface will redistribute","only induced charge on inner surface will redistribute","Both induced charge on outer and inner surface will redistribute","force on charge q placed inside the cavity will change"],correctAnswer:1,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q36)",text:"Due to electrostatic shielding, the cavity and the charge q inside it are completely shielded from external electric fields. The charge distribution on the inner surface of the cavity depends solely on the charge inside the cavity and does not change. When an external electric field is switched on, only the free charges on the outer surface of the conductor redistribute to cancel the external field inside the bulk.",steps:["Inner cavity charge distribution is fixed by charge q","Electrostatic shielding prevents external field from entering cavity","Only charges on the outer surface redistribute"]}},{id:37,subject:"Physics",topic:"Gauss Law (Flux Through Symmetrical Geometry)",questionText:"A charge q is placed at a vertex of the given geometry of angle 60\xB0. Then, the flux coming out from this geometry will be",diagramKey:"physics_q37",options:["q / (6\u03B5\u2080)","q / (16\u03B5\u2080)","q / (8\u03B5\u2080)","q / (12\u03B5\u2080)"],correctAnswer:4,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q37)",text:"A full solid angle around a vertex is 4\u03C0 steradians. In a horizontal plane, 360\xB0/60\xB0 = 6 such wedge geometries meet. Since the charge is placed at the top vertex, it also spans the upper and lower half-spaces (factor of 2). Total 6 \xD7 2 = 12 identical prisms are required to completely enclose the charge q. Hence flux through one geometry is \u03A6 = q / (12\u03B5\u2080).",steps:["Number of 60\xB0 wedges to complete 360\xB0 = 6","Vertex divides upper and lower space: 6 \xD7 2 = 12 identical blocks enclose q","Flux through given geometry = q / (12\u03B5\u2080)"]}},{id:38,subject:"Physics",topic:"Charged Sheet & Suspended Ball Equilibrium",questionText:"A charged ball B hangs from a silk thread S, which makes an angle \u03B8 with a large charged conducting sheet P, as shown in the figure. The surface charge density \u03C3 of the sheet is proportional to :-",diagramKey:"physics_q38",options:["sin \u03B8","cos \u03B8","tan \u03B8","cot \u03B8"],correctAnswer:3,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q38)",text:`Electric field due to a large conducting sheet E = \u03C3 / \u03B5\u2080.
Forces on the ball in equilibrium:
T cos \u03B8 = mg
T sin \u03B8 = q E = q (\u03C3 / \u03B5\u2080)
Dividing the two equations: tan \u03B8 = q \u03C3 / (\u03B5\u2080 mg) \u21D2 \u03C3 \u221D tan \u03B8.`,steps:["T cos \u03B8 = mg","T sin \u03B8 = q(\u03C3 / \u03B5\u2080)","tan \u03B8 = q \u03C3 / (\u03B5\u2080 mg) \u21D2 \u03C3 \u221D tan \u03B8"]}},{id:39,subject:"Physics",topic:"Motion of Charged Particle in Uniform Electric Field",questionText:"An electron enter the region between the plates of a parallel plate as shown in figure. The plate length is \u2113 & separation is d. Electric field between plates is uniform. The electron misses the upper plate & follows the path shown. Neglect gravity. Then correct relation is :-",diagramKey:"physics_q39",options:["tan \u03B8 = 2d / \u2113","tan \u03B8 = 4d / \u2113","tan \u03B8 = 8d / \u2113","The data given is insufficient to find a relation among d, \u2113, \u03B8"],correctAnswer:2,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q39)",text:`This is analogous to projectile motion under uniform downward acceleration a = eE/m.
Maximum vertical height reached is d: d = u_y\xB2 / (2a)
Horizontal range is \u2113: \u2113 = 2 u_x u_y / a
Dividing height by range:
d / \u2113 = [u_y\xB2 / (2a)] / [2 u_x u_y / a] = u_y / (4 u_x) = (1/4) tan \u03B8
Therefore: tan \u03B8 = 4d / \u2113.`,steps:["Vertical maximum height d = u_y\xB2 / (2a)","Horizontal range \u2113 = 2 u_x u_y / a","d / \u2113 = (1/4) (u_y / u_x) = (1/4) tan \u03B8","tan \u03B8 = 4d / \u2113"]}},{id:40,subject:"Physics",topic:"Equipotential Surfaces & Particle Motion",questionText:"In the figure equipotential surfaces are shown. A particle of charge q and mass m is released from rest from origin at t = 0. Position vector of particle at t = 1 sec is :-",diagramKey:"physics_q40",options:["(100q/m)(i\u0302 \u2013 j\u0302) m","(50q/m)(i\u0302 \u2013 j\u0302) m","(50q/m)(\u2013i\u0302 + j\u0302) m","(100q/m)(\u2013i\u0302 + j\u0302) m"],correctAnswer:2,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q40)",text:`Equipotential lines are inclined at 45\xB0 to the x-axis with potential decreasing towards +x. Perpendicular distance between 50V and 40V lines is \u0394r = 0.1 cos 45\xB0 = 0.1 / \u221A2 m.
Magnitude of Electric field E = -\u0394V / \u0394r = 10 / (0.1 / \u221A2) = 100\u221A2 V/m.
Direction of E\u20D7 is perpendicular to equipotential lines pointing in direction of decreasing potential (i.e. at -45\xB0 to +x axis):
E\u20D7 = (100\u221A2 cos 45\xB0) i\u0302 - (100\u221A2 sin 45\xB0) j\u0302 = 100 i\u0302 - 100 j\u0302 V/m.
Acceleration a\u20D7 = (q/m) E\u20D7 = (100q/m)(i\u0302 - j\u0302).
Position vector at t = 1 s: r\u20D7 = (1/2) a\u20D7 t\xB2 = (50q/m)(i\u0302 - j\u0302) m.`,steps:["E is perpendicular to equipotential lines towards decreasing potential","E = 10 / (0.1 cos 45\xB0) = 100\u221A2 V/m at -45\xB0 to x-axis","E\u20D7 = 100 i\u0302 - 100 j\u0302","r\u20D7(t=1) = 1/2 (qE\u20D7/m)(1)\xB2 = (50q/m)(i\u0302 - j\u0302) m"]}},{id:41,subject:"Physics",topic:"Electric Field of a Short Dipole",questionText:"Electric field at a distance r (r >> a) is E\u2081, when angle \u03B8 is 30\xB0. If only \u03B8 changes to 45\xB0 then electric field is :-",diagramKey:"physics_q41",options:["\u221A(10/7) E\u2081","\u221A(7/10) E\u2081","\u221A(10/13) E\u2081","E\u2081"],correctAnswer:3,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q41)",text:`Electric field at distance r and angle \u03B8 for a short dipole: E = (kp / r\xB3) \u221A(3 cos\xB2\u03B8 + 1)
For \u03B8 = 30\xB0: E\u2081 = (kp / r\xB3) \u221A(3 cos\xB2 30\xB0 + 1) = (kp / r\xB3) \u221A(3(3/4) + 1) = (kp / r\xB3) \u221A(13/4) = (kp / 2r\xB3) \u221A13
For \u03B8 = 45\xB0: E\u2082 = (kp / r\xB3) \u221A(3 cos\xB2 45\xB0 + 1) = (kp / r\xB3) \u221A(3(1/2) + 1) = (kp / r\xB3) \u221A(5/2) = (kp / 2r\xB3) \u221A10
Ratio: E\u2082 / E\u2081 = \u221A10 / \u221A13 = \u221A(10/13) \u21D2 E\u2082 = \u221A(10/13) E\u2081.`,steps:["E(\u03B8) \u221D \u221A(3 cos\xB2\u03B8 + 1)","For \u03B8 = 30\xB0: \u221A(3(3/4) + 1) = \u221A13 / 2","For \u03B8 = 45\xB0: \u221A(3(1/2) + 1) = \u221A10 / 2","E\u2082 = \u221A(10/13) E\u2081"]}},{id:42,subject:"Physics",topic:"Gauss Law (Flux in Composite Surfaces)",questionText:"A charge q is surrounded by a closed surface consisting of an inverted cone of height h and base radius R, and a hemisphere of radius R as shown in the figure. The electric flux through the conical surface is nq / (6\u03B5\u2080) (in SI units). The value of n is ________.",diagramKey:"physics_q42",options:["3","6","1","2"],correctAnswer:1,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q42)",text:`By Gauss\u2019s Law, the total flux through the closed surface is \u03A6_total = q / \u03B5\u2080.
The charge q is placed exactly at the centre of the circular interface separating the upper hemisphere and lower cone.
By symmetry, exactly half of the total flux passes through the hemisphere and half through the conical surface:
\u03A6_cone = (1/2) (q / \u03B5\u2080) = 3q / (6\u03B5\u2080).
Comparing with nq / (6\u03B5\u2080), we get n = 3.`,steps:["Total flux through closed surface = q / \u03B5\u2080","Charge at interface divides field symmetrically: \u03A6_cone = \u03A6_hemisphere = q / (2\u03B5\u2080)","q / (2\u03B5\u2080) = 3q / (6\u03B5\u2080) \u21D2 n = 3"]}},{id:43,subject:"Physics",topic:"Force on Dipole in Non-Uniform Electric Field",questionText:"A dipole p\u20D7 = pi\u0302 + pj\u0302 is placed in an electric field E\u20D7 = (ax)i\u0302 + (by)j\u0302. The net force on the dipole is:",options:["p(a + b) (i\u0302 + j\u0302)","pai\u0302 + pbj\u0302","(pa + pb) k\u0302","Zero"],correctAnswer:2,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q43)",text:`Potential energy of dipole U = - p\u20D7 \xB7 E\u20D7 = - (p i\u0302 + p j\u0302) \xB7 (ax i\u0302 + by j\u0302) = - (p a x + p b y)
Force F\u20D7 = - \u2207U = - [ (\u2202U/\u2202x) i\u0302 + (\u2202U/\u2202y) j\u0302 ]
\u2202U/\u2202x = - p a \u21D2 F_x = - (- p a) = p a
\u2202U/\u2202y = - p b \u21D2 F_y = - (- p b) = p b
Hence net force F\u20D7 = p a i\u0302 + p b j\u0302.`,steps:["U = - p\u20D7 \xB7 E\u20D7 = - (p a x + p b y)","F\u20D7 = - \u2207U = - [ (-pa)i\u0302 + (-pb)j\u0302 ]","F\u20D7 = pa i\u0302 + pb j\u0302"]}},{id:44,subject:"Physics",topic:"Electrostatic Potential & Work Done",questionText:"A point charge of 10\u207B\u2078 C is placed at origin. The work done in moving a point charge 2 \u03BCC from point A(4, 4, 2) m to B(2, 2, 1) m is __________J. (1/(4\u03C0\u03B5\u2080) = 9 \xD7 10\u2079 in SI units)",options:["45 \xD7 10\u207B\u2076","0","30 \xD7 10\u207B\u2076","15 \xD7 10\u207B\u2076"],correctAnswer:3,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q44)",text:`Distance of A from origin: r_A = \u221A(4\xB2 + 4\xB2 + 2\xB2) = \u221A(16 + 16 + 4) = \u221A36 = 6 m.
Distance of B from origin: r_B = \u221A(2\xB2 + 2\xB2 + 1\xB2) = \u221A(4 + 4 + 1) = \u221A9 = 3 m.
Work done by external agent W_ext = q_test [V_B - V_A]
= q_test \xD7 (k Q) [1/r_B - 1/r_A]
= (2 \xD7 10\u207B\u2076) \xD7 (9 \xD7 10\u2079 \xD7 10\u207B\u2078) [1/3 - 1/6]
= (2 \xD7 10\u207B\u2076) \xD7 90 \xD7 (1/6) = 30 \xD7 10\u207B\u2076 J.`,steps:["r_A = \u221A(16 + 16 + 4) = 6 m","r_B = \u221A(4 + 4 + 1) = 3 m","W_ext = q\u2080 k Q [1/r_B - 1/r_A]","= 2\xD710\u207B\u2076 \xD7 90 \xD7 (1/6) = 30 \xD7 10\u207B\u2076 J"]}},{id:45,subject:"Physics",topic:"Conductors & Electric Field Lines",questionText:"A point charge q is placed at a point inside a hollow conducting sphere. Which of the following electric force pattern is correct ?",diagramKey:"physics_q45",options:["Field lines originate from charge ending normally on inner surface, E=0 inside shell, emerging radially outward normally from outer surface","Field lines passing straight through conductor without bending","Field lines existing inside the metallic shell wall","No field lines outside the spherical shell"],correctAnswer:1,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q45)",text:`1. Electric field lines from the internal point charge terminate perpendicularly on the inner surface inducing -q charge.
2. Electric field inside the conducting material is zero (no lines inside conductor body).
3. An equal +q charge is induced uniformly on the outer surface, and electric field lines emerge normally from the outer surface into external space pointing radially as if originating from the sphere centre.
Hence Pattern (1) is correct.`,steps:["Field lines must be normal to conductor surfaces","E = 0 inside the conductor body","Pattern (1) satisfies all electrostatic boundary conditions"]}}];var om=[{id:46,subject:"Chemistry",topic:"Atomic Structure (Emission Spectrum Lines)",questionText:"In the hydrogen atoms, the electrons are excited to the 5th energy level. The number of the lines that may appear in the emission spectrum will be :",options:["4","8","10","12"],correctAnswer:3,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q46)",text:`Total number of spectral lines emitted during de-excitation from nth level to ground state:
N = n(n - 1) / 2 = 5(5 - 1) / 2 = (5 \xD7 4) / 2 = 10 lines.`,steps:["Formula: N = n(n - 1) / 2","For n = 5: N = 5(4) / 2 = 10 lines"]}},{id:47,subject:"Chemistry",topic:"Bohr's Atomic Model (Orbit Radii)",questionText:"If radius of second stationary orbit (in Bohr's atom) is R. Then radius of third orbit will be:-",options:["R/3","9R","R/9","2.25 R"],correctAnswer:4,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q47)",text:`Radius of nth Bohr orbit r_n \u221D n\xB2
r\u2082 = R \u221D 2\xB2 = 4
r\u2083 \u221D 3\xB2 = 9
r\u2083 / r\u2082 = 9 / 4 = 2.25 \u21D2 r\u2083 = 2.25 R.`,steps:["r_n \u221D n\xB2","r\u2083 / r\u2082 = 3\xB2 / 2\xB2 = 9 / 4 = 2.25","r\u2083 = 2.25 R"]}},{id:48,subject:"Chemistry",topic:"Atomic Structure (Excitation Energy)",questionText:"How much energy must be provided to an electron present in ground state of hydrogen atom, so that electron excites to 2nd excited state.",options:["10.2 eV","13.6 eV","1.89 eV","12.09 eV"],correctAnswer:4,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q48)",text:`Ground state: n\u2081 = 1, E\u2081 = -13.6 eV
2nd excited state corresponds to n\u2082 = 3: E\u2083 = -13.6 / 3\xB2 = -1.51 eV
Excitation energy \u0394E = E\u2083 - E\u2081 = -1.51 - (-13.6) = +12.09 eV.`,steps:["Ground state n = 1 (E\u2081 = -13.6 eV)","2nd excited state n = 3 (E\u2083 = -1.51 eV)","\u0394E = E\u2083 - E\u2081 = 12.09 eV"]}},{id:49,subject:"Chemistry",topic:"Nuclear Chemistry (Isodiaphers)",questionText:"\u2085\xB9\xB9B and \u2086\xB9\xB3C are related to each other as :-",options:["Isotope","Isodiapher","Isosters","Isoelectronic"],correctAnswer:2,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q49)",text:`For \u2085\xB9\xB9B: p = 5, n = 11 - 5 = 6 \u21D2 (n - p) = 6 - 5 = 1
For \u2086\xB9\xB3C: p = 6, n = 13 - 6 = 7 \u21D2 (n - p) = 7 - 6 = 1
Nuclides having the same isotopic excess (n - p) are called isodiaphers.`,steps:["\u2085\xB9\xB9B: n - p = 6 - 5 = 1","\u2086\xB9\xB3C: n - p = 7 - 6 = 1","Same (n - p) value indicates Isodiaphers"]}},{id:50,subject:"Chemistry",topic:"Electronic Configuration (Isoelectronic Species)",questionText:"Which species are isoelectronic (NO\u2083\u207B, CO\u2083\xB2\u207B, ClO\u2083\u207B, SO\u2083)",options:["NO\u2083\u207B, CO\u2083\xB2\u207B","SO\u2083, NO\u2083\u207B","ClO\u2083\u207B, CO\u2083\xB2\u207B","CO\u2083\xB2\u207B, SO\u2083"],correctAnswer:1,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q50)",text:`Total electrons in NO\u2083\u207B = 7 + 3(8) + 1 = 32 electrons
Total electrons in CO\u2083\xB2\u207B = 6 + 3(8) + 2 = 32 electrons
Total electrons in ClO\u2083\u207B = 17 + 3(8) + 1 = 42 electrons
Total electrons in SO\u2083 = 16 + 3(8) = 40 electrons
Thus, NO\u2083\u207B and CO\u2083\xB2\u207B both have 32 electrons and are isoelectronic.`,steps:["NO\u2083\u207B: 7 + 24 + 1 = 32 e\u207B","CO\u2083\xB2\u207B: 6 + 24 + 2 = 32 e\u207B","Both have 32 e\u207B, hence isoelectronic"]}},{id:51,subject:"Chemistry",topic:"Atomic Number & Nuclear Composition",questionText:"X\u207A\xB2 has 10 protons then find number of protons in X\u207B\xB2 :",options:["10","12","14","16"],correctAnswer:1,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q51)",text:"The number of protons represents the atomic number (Z) of an element, which is a fundamental nuclear characteristic and does not change during ionization or loss/gain of electrons. Therefore, X\u207B\xB2 will also have 10 protons.",steps:["Proton count = Atomic Number (Z)","Nuclear charge / protons do not change upon adding/removing electrons","Number of protons remains 10"]}},{id:52,subject:"Chemistry",topic:"Nuclear Composition",questionText:"In \u2089\u2082U\xB2\xB3\u2075 nucleus, the number of electrons is :-",options:["92","235","143","Zero"],correctAnswer:4,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q52)",text:"The question specifically asks for the number of electrons inside the nucleus. An atomic nucleus contains only nucleons (protons and neutrons) and zero electrons. (Electrons revolve in orbits outside the nucleus).",steps:["Nucleus consists of protons and neutrons only","Number of electrons inside any nucleus is 0"]}},{id:53,subject:"Chemistry",topic:"Fundamental Particles (Neutron vs Proton Mass)",questionText:"Ratio of mass of neutron and proton is :-",options:["Less than one","More than one","Exactly equal to one","Can't be predicted"],correctAnswer:2,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q53)",text:`Mass of neutron m_n = 1.00866 amu (1.6749 \xD7 10\u207B\xB2\u2077 kg)
Mass of proton m_p = 1.00727 amu (1.6726 \xD7 10\u207B\xB2\u2077 kg)
Ratio m_n / m_p = 1.00866 / 1.00727 = 1.00138 > 1 (More than one).`,steps:["m_n = 1.00866 amu, m_p = 1.00727 amu","m_n > m_p","Ratio m_n / m_p > 1"]}},{id:54,subject:"Chemistry",topic:"Rutherford's Scattering Experiment",questionText:"Rutherford's experiment on scattering of alpha particles showed for the first time that atom has:",options:["Electrons","Protons","Nucleus","Neutrons"],correctAnswer:3,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q54)",text:"Rutherford's alpha particle scattering experiment on gold foil showed that most alpha particles passed undeflected, but a few were deflected through large angles (and 1 in 20,000 rebounded by 180\xB0), proving the existence of a tiny, dense, positively charged core called the nucleus.",steps:["Alpha scattering proved concentrated central positive charge","Led to discovery of atomic nucleus"]}},{id:55,subject:"Chemistry",topic:"Rutherford's Model Conclusions",questionText:"Which of the following conclusions regarding the structure of atom is true based on Rutherford's \u03B1-particle scattering experiment ?",options:["The positive charge is concentrated in a very small volume of the atom","The positive charge is scattered with the electrons throughout the atom","The volume occupied by the nucleus is half of the volume of atom","Most of the space in the atom is occupied by the neutrons."],correctAnswer:1,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q55)",text:"Rutherford concluded that the entire positive charge and almost all the mass of the atom is concentrated in an extremely small central region called the nucleus (radius ~ 10\u207B\xB9\u2075 m compared to atomic radius ~ 10\u207B\xB9\u2070 m).",steps:["Nucleus occupies less than 10\u207B\xB9\u2075 of the total atomic volume","Positive charge is concentrated in this tiny volume"]}},{id:56,subject:"Chemistry",topic:"Bohr's Postulates (Orbital Angular Momentum)",questionText:"Angular momentum for P\u2013shell electron is :\u2013",options:["3h/\u03C0","Zero","\u221A2h/(2\u03C0)","None"],correctAnswer:1,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q56)",text:`Shell notation: K(n=1), L(n=2), M(n=3), N(n=4), O(n=5), P(n=6).
For P-shell: principal quantum number n = 6.
Angular momentum L = n h / (2\u03C0) = 6 h / (2\u03C0) = 3h/\u03C0.`,steps:["P-shell corresponds to n = 6","L = nh / (2\u03C0) = 6h / (2\u03C0) = 3h / \u03C0"]}},{id:57,subject:"Chemistry",topic:"Atomic Composition (Protons, Neutrons, Electrons)",questionText:"The mass no. of an element is 39. The number of neutrons in its nucleus is one more than the number of protons. The number of protons, neutrons and electrons respectively in its atom would be",options:["19, 20, 19","19, 19, 20","20, 19, 19","20, 19, 20"],correctAnswer:1,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q57)",text:`Mass number A = p + n = 39
Given: n = p + 1
Substituting: p + (p + 1) = 39 \u21D2 2p = 38 \u21D2 p = 19.
Number of neutrons n = 19 + 1 = 20.
For a neutral atom, electrons = protons = 19.
Respective numbers: 19, 20, 19 (Potassium-39).`,steps:["p + n = 39 and n = p + 1","2p + 1 = 39 \u21D2 p = 19","n = 20, e = 19"]}},{id:58,subject:"Chemistry",topic:"Bohr Energy Levels in Hydrogen",questionText:"Energy of e\u207B in 2nd orbit of H-atom is-",options:["13.6 eV","\u20133.4 eV","\u20131.51 eV","\u20130.54 eV"],correctAnswer:2,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q58)",text:`Energy of electron in nth Bohr orbit of hydrogen: E_n = -13.6 / n\xB2 eV.
For 2nd orbit (n = 2): E\u2082 = -13.6 / 2\xB2 = -13.6 / 4 = -3.4 eV.`,steps:["E_n = -13.6 / n\xB2 eV","E\u2082 = -13.6 / 4 = -3.4 eV"]}},{id:59,subject:"Chemistry",topic:"Kinetic Energy of Orbiting Electrons",questionText:"If the K.E. of e\u207B in first and second orbit of Li\u207A\xB2 ion is x and y respectively then :",options:["x < y","x > y","x = y","None of these"],correctAnswer:2,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q59)",text:`Kinetic Energy in Bohr model K.E. = +13.6 \xD7 (Z\xB2 / n\xB2) eV.
As principal quantum number n increases, radius r increases and K.E. decreases (K.E. \u221D 1/n\xB2).
For n=1, K.E. = x = 13.6(3\xB2)/1\xB2 = 122.4 eV.
For n=2, K.E. = y = 13.6(3\xB2)/2\xB2 = 30.6 eV.
Therefore, x > y.`,steps:["K.E. = 13.6 Z\xB2 / n\xB2 eV","K.E. \u221D 1/n\xB2","x (n=1) > y (n=2)"]}},{id:60,subject:"Chemistry",topic:"Hydrogen Spectrum Series (Maximum Frequency Ratio)",questionText:"Find out ratio of following (\u03BD_max)_Lyman : (\u03BD_max)_Brackett",options:["1 : 16","16 : 1","4 : 1","1 : 4"],correctAnswer:2,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q60)",text:`Maximum frequency corresponds to series limit (transition from n = \u221E):
(\u03BD_max)_Lyman = R c [1/1\xB2 - 1/\u221E\xB2] = R c (1)
(\u03BD_max)_Brackett = R c [1/4\xB2 - 1/\u221E\xB2] = R c (1/16)
Ratio = (R c) / (R c / 16) = 16 : 1.`,steps:["\u03BD_max occurs for transition from n\u2082 = \u221E","Lyman: n\u2081 = 1 \u21D2 \u03BD_max \u221D 1/1\xB2 = 1","Brackett: n\u2081 = 4 \u21D2 \u03BD_max \u221D 1/4\xB2 = 1/16","Ratio = 1 / (1/16) = 16 : 1"]}},{id:61,subject:"Chemistry",topic:"Mole Concept (Avogadro Number)",questionText:"Moles of O\u2083 in its 12.044 \xD7 10\xB2\xB2 molecules of O\u2083 will be :",options:["2 mol","0.4 mol","1 mol","0.2 mol"],correctAnswer:4,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q61)",text:`Moles = (Number of molecules) / N_A
= (12.044 \xD7 10\xB2\xB2) / (6.022 \xD7 10\xB2\xB3)
= (12.044 / 6.022) \xD7 10\u207B\xB9 = 2 \xD7 0.1 = 0.2 mol.`,steps:["Moles = N / N_A","= (12.044 \xD7 10\xB2\xB2) / (6.022 \xD7 10\xB2\xB3)","= 0.2 mol"]}},{id:62,subject:"Chemistry",topic:"Solutions & Concentration Terms (Mole Fraction)",questionText:"If 5 moles of A is mixed 15 moles of B then what is the mole fraction of A in the mixture ?",options:["0.75","0.35","0.25","0.5"],correctAnswer:3,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q62)",text:`Total moles n_total = n_A + n_B = 5 + 15 = 20 moles.
Mole fraction of A: x_A = n_A / n_total = 5 / 20 = 1 / 4 = 0.25.`,steps:["n_total = 5 + 15 = 20","x_A = n_A / n_total = 5 / 20 = 0.25"]}},{id:63,subject:"Chemistry",topic:"Stoichiometry (Gay-Lussac Law of Combining Volumes)",questionText:"Volume of H\u2082(g) required to react completely with 3L of N\u2082(g) to form ammonia at same T & P condition will be :",options:["7 L","6 L","9 L","4 L"],correctAnswer:3,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q63)",text:`Balanced chemical equation: N\u2082(g) + 3H\u2082(g) \u2192 2NH\u2083(g)
By Avogadro\u2019s Law at same T & P, volume ratio = mole ratio.
1 Volume of N\u2082 reacts with 3 Volumes of H\u2082.
Hence, 3 L of N\u2082 requires 3 \xD7 3 L = 9 L of H\u2082.`,steps:["N\u2082 + 3H\u2082 \u2192 2NH\u2083","1 L N\u2082 reacts with 3 L H\u2082","3 L N\u2082 requires 3 \xD7 3 = 9 L H\u2082"]}},{id:64,subject:"Chemistry",topic:"Limiting & Excess Reagent",questionText:"When 5 moles of A will react with 3 moles of B according to given balanced reaction 2A + 6B \u2192 C. Then which of the following reactant will be in excess amount",options:["A","B","can\u2019t be determined","Both will act as limiting reagent"],correctAnswer:1,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q64)",text:`Mole-to-coefficient ratios:
For A: 5 / 2 = 2.5
For B: 3 / 6 = 0.5
Since the ratio for B is smaller, B is the limiting reagent.
For 3 moles of B, moles of A consumed = 3 \xD7 (2 / 6) = 1 mol.
Remaining moles of A = 5 - 1 = 4 moles (A is in excess).`,steps:["Ratio for A = 5/2 = 2.5","Ratio for B = 3/6 = 0.5 (Limiting Reagent)","A is present in excess"]}},{id:65,subject:"Chemistry",topic:"Percentage Composition",questionText:"% of H in methane will be :",options:["25%","30%","17%","32%"],correctAnswer:1,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q65)",text:`Molar mass of methane (CH\u2084) = 12 + 4(1) = 16 g/mol.
Mass of Hydrogen in 1 mole CH\u2084 = 4 g.
% of H = (4 / 16) \xD7 100% = 25%.`,steps:["Molar mass of CH\u2084 = 16 g/mol","Mass of H = 4 g","% of H = (4 / 16) \xD7 100 = 25%"]}},{id:66,subject:"Chemistry",topic:"Empirical Formula",questionText:"The no. of atoms of A and B in their molecule are 9 \xD7 10\xB2\u2070 and 3 \xD7 10\xB2\u2070 respectively then their empirical formula will be :",options:["AB\u2083","A\u2083B","AB","A\u2089B"],correctAnswer:2,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q66)",text:`Simplest atomic ratio A : B = (9 \xD7 10\xB2\u2070) / (3 \xD7 10\xB2\u2070) = 3 : 1.
Empirical formula is A\u2083B.`,steps:["Ratio A : B = 9 \xD7 10\xB2\u2070 : 3 \xD7 10\xB2\u2070 = 3 : 1","Empirical formula = A\u2083B"]}},{id:67,subject:"Chemistry",topic:"Molality Calculation",questionText:"2 moles of urea is dissolved in 20 kg of solvent then molality of the solution formed is :",options:["0.1 m","0.2 m","1 m","1.5 m"],correctAnswer:1,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q67)",text:`Molality (m) = (Moles of solute) / (Mass of solvent in kg)
= 2 moles / 20 kg = 0.1 mol/kg = 0.1 m.`,steps:["Molality m = n_solute / W_solvent(kg)","m = 2 / 20 = 0.1 m"]}},{id:68,subject:"Chemistry",topic:"Planck\u2019s Quantum Theory (Photon Energy & Wavelength)",questionText:"The ratio of the energy of a photon of wavelength 3000 \xC5 to that of a photon of wavelength 6000 \xC5 is :",options:["1/2","2","3","1/3"],correctAnswer:2,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q68)",text:`Energy of a photon E = hc / \u03BB \u21D2 E \u221D 1/\u03BB
E\u2081 / E\u2082 = \u03BB\u2082 / \u03BB\u2081 = 6000 \xC5 / 3000 \xC5 = 2.`,steps:["E \u221D 1/\u03BB","E\u2081 / E\u2082 = 6000 / 3000 = 2"]}},{id:69,subject:"Chemistry",topic:"Bohr's Orbit Angular Momentum",questionText:"According to Bohr's theory, the angular momentum to an electron in 5th orbit is :",options:["25 (h/\u03C0)","1.0 (h/\u03C0)","10 (h/\u03C0)","2.5 (h/\u03C0)"],correctAnswer:4,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q69)",text:`L = n h / (2\u03C0)
For n = 5: L = 5h / (2\u03C0) = 2.5 (h/\u03C0).`,steps:["L = nh / 2\u03C0","For n = 5: L = 5/2 (h/\u03C0) = 2.5 (h/\u03C0)"]}},{id:70,subject:"Chemistry",topic:"Spectral Lines & Shortest Wavelength",questionText:"When electrons are de-exciting from nth orbit of hydrogen atoms to ground state, 15 spectral lines are formed. The shortest wavelength among these will be :",options:["11 / (900 R)","36 / (35 R)","35 / (36 R)","35 / (36 R)"],correctAnswer:2,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q70)",text:`Total lines = n(n - 1) / 2 = 15 \u21D2 n(n - 1) = 30 \u21D2 n = 6.
Shortest wavelength corresponds to maximum energy transition (from highest level n = 6 to ground state n = 1):
1 / \u03BB_min = R_H [1/1\xB2 - 1/6\xB2] = R [1 - 1/36] = 35 R / 36
\u03BB_min = 36 / (35 R).`,steps:["n(n - 1) / 2 = 15 \u21D2 n = 6","1 / \u03BB = R (1/1\xB2 - 1/6\xB2) = 35R / 36","\u03BB = 36 / (35 R)"]}},{id:71,subject:"Chemistry",topic:"Gas Mixtures & Molecule Ratio",questionText:"A gaseous mixture contains CO\u2082(g) and N\u2082O(g) in 2:5 ratio by mass. The ratio of the number of molecules of CO\u2082(g) and N\u2082O (g) is:",options:["5 : 2","2 : 5","1 : 2","5 : 4"],correctAnswer:2,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q71)",text:`Molar mass of CO\u2082 = 12 + 2(16) = 44 g/mol
Molar mass of N\u2082O = 2(14) + 16 = 44 g/mol
Since both gases have identical molar mass (44 g/mol):
Mole ratio = (w_CO\u2082 / 44) / (w_N\u2082O / 44) = w_CO\u2082 / w_N\u2082O = 2 / 5.
Number of molecules ratio = Mole ratio = 2 : 5.`,steps:["Molar mass of CO\u2082 = 44 g/mol","Molar mass of N\u2082O = 44 g/mol","Molecule ratio = Mass ratio = 2 : 5"]}},{id:72,subject:"Chemistry",topic:"Molecular Formula Determination",questionText:"The empirical formula of a compound of molecular mass 120 is CH\u2082O. The molecular formula of the compound is:",options:["C\u2082H\u2084O\u2082","C\u2084H\u2088O\u2084","C\u2083H\u2086O\u2083","All of these"],correctAnswer:2,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q72)",text:`Empirical formula mass of CH\u2082O = 12 + 2(1) + 16 = 30 g/mol.
n = Molecular mass / Empirical formula mass = 120 / 30 = 4.
Molecular formula = (CH\u2082O)\u2084 = C\u2084H\u2088O\u2084.`,steps:["Empirical mass = 12 + 2 + 16 = 30","n = 120 / 30 = 4","Molecular formula = C\u2084H\u2088O\u2084"]}},{id:73,subject:"Chemistry",topic:"Bohr Velocity in Hydrogen-like Species",questionText:"If the velocity of an electron in 1st orbit of H-atom is u, what will be the velocity of electron in 3rd orbit Li\u207A\xB2 ?",options:["u","u/3","3u","9u"],correctAnswer:1,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q73)",text:`Velocity of electron in Bohr orbit v \u221D Z / n
For H (Z = 1, n = 1): v\u2081 = u \u221D 1/1 = 1
For Li\xB2\u207A (Z = 3, n = 3): v\u2083 \u221D 3/3 = 1
Hence v\u2083 = u.`,steps:["v \u221D Z / n","For H (n=1): v = u \u221D 1/1","For Li\xB2\u207A (Z=3, n=3): v = u \xD7 (3/3) = u"]}},{id:74,subject:"Chemistry",topic:"Vapour Density Definition",questionText:"Vapour density of any gas is :-",options:["Unitless quantity","Molar mass / 2","Density of any gas with respect to density of H\u2082 gas under same condition of P and T","All of the above"],correctAnswer:4,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q74)",text:`Vapour Density (VD) is defined as the density of a gas relative to that of hydrogen gas at the same temperature and pressure.
Since it is a ratio of two densities, it is a dimensionless / unitless quantity.
Mathematically: Vapour Density = Molar mass of gas / Molar mass of H\u2082 = Molar mass / 2.
Hence all options are correct.`,steps:["VD = (Density of gas) / (Density of H\u2082) at same T, P","VD = Molar mass / 2","VD is a dimensionless (unitless) ratio"]}},{id:75,subject:"Chemistry",topic:"Minimum Molecular Weight Calculation",questionText:"A compound contains 11.5% by mass of sodium. Its minimum molecular weight will be :-",options:["80 amu","200 amu","250 amu","300 amu"],correctAnswer:2,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q75)",text:`For minimum molecular weight, the compound must contain at least one sodium atom (atomic mass = 23 amu).
% of Na = (1 \xD7 23 / M_min) \xD7 100
11.5 = (23 / M_min) \xD7 100
M_min = 2300 / 11.5 = 200 amu.`,steps:["% Na = (23 / M) \xD7 100","11.5 = 2300 / M","M = 200 amu"]}},{id:76,subject:"Chemistry",topic:"Heisenberg's Uncertainty Principle",questionText:"What will be the uncertainty in velocity of an electron if uncertainty in its position is 1\xC5",options:["8.76 \xD7 10\u2076 m/s","5.76 \xD7 10\u2075 m/s","5 \xD7 10\u207B\xB2\u2074 m/s","1 \xD7 10\xB2\xB3 m/s"],correctAnswer:2,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q76)",text:`By Heisenberg\u2019s principle: \u0394x \xB7 m \u0394v \u2265 h / (4\u03C0)
\u0394v = h / (4\u03C0 m \u0394x)
= 6.626 \xD7 10\u207B\xB3\u2074 / [4 \xD7 3.1416 \xD7 (9.1 \xD7 10\u207B\xB3\xB9 kg) \xD7 (10\u207B\xB9\u2070 m)]
= 6.626 \xD7 10\u207B\xB3\u2074 / (1.1435 \xD7 10\u207B\xB3\u2079) = 5.76 \xD7 10\u2075 m/s.`,steps:["\u0394x = 1 \xC5 = 10\u207B\xB9\u2070 m","\u0394v = h / (4\u03C0 m \u0394x)","\u0394v = 5.76 \xD7 10\u2075 m/s"]}},{id:77,subject:"Chemistry",topic:"Mole Concept (Total Atoms in Compound)",questionText:"The total number of atoms present in 1 mol of Ammonium dichromate (NH\u2084)\u2082Cr\u2082O\u2087 is :-",options:["19","N_A","114.437 \xD7 10\xB2\xB3","84.322 \xD7 10\xB2\xB3"],correctAnswer:3,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q77)",text:`One formula unit of (NH\u2084)\u2082Cr\u2082O\u2087 contains:
2 Nitrogen + 8 Hydrogen + 2 Chromium + 7 Oxygen = 19 atoms.
1 mole of (NH\u2084)\u2082Cr\u2082O\u2087 contains 19 \xD7 N_A atoms
= 19 \xD7 6.023 \xD7 10\xB2\xB3 = 114.437 \xD7 10\xB2\xB3 atoms.`,steps:["Atoms per molecule = 2(1+4) + 2 + 7 = 19 atoms","Total atoms = 19 \xD7 6.023 \xD7 10\xB2\xB3 = 114.437 \xD7 10\xB2\xB3"]}},{id:78,subject:"Chemistry",topic:"Difference in Angular Momentum",questionText:"The difference in angular momentum associated with the electron in 3rd and 1st orbits of hydrogen atom is :-",options:["h/\u03C0","h/(2\u03C0)","h/2","(n-1) h/(2\u03C0)"],correctAnswer:1,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q78)",text:`L\u2083 = 3h / (2\u03C0)
L\u2081 = 1h / (2\u03C0)
\u0394L = L\u2083 - L\u2081 = (3 - 1) h / (2\u03C0) = 2h / (2\u03C0) = h / \u03C0.`,steps:["L_n = nh / (2\u03C0)","\u0394L = (3 - 1) h / 2\u03C0 = 2h / 2\u03C0 = h / \u03C0"]}},{id:79,subject:"Chemistry",topic:"Bohr Shell Nomenclature",questionText:"The ratio of the radius of two bohr orbits of Li\u207A\xB2 is 1 : 9, what would be there nomenclature :-",options:["K & L","L & M","K & M","K & N"],correctAnswer:3,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q79)",text:`r \u221D n\xB2 \u21D2 r\u2081 / r\u2082 = n\u2081\xB2 / n\u2082\xB2 = 1 / 9 \u21D2 n\u2081 / n\u2082 = 1 / 3.
For n = 1, shell name is K.
For n = 3, shell name is M.
Thus the shells are K & M.`,steps:["r\u2081 / r\u2082 = (n\u2081 / n\u2082)\xB2 = 1 / 9","n\u2081 = 1 (K shell), n\u2082 = 3 (M shell)"]}},{id:80,subject:"Chemistry",topic:"Photochemistry & Energy Conservation",questionText:"A gas absorbs a photon of 300 nm and emits out two wavelengths. If one of the emissions is at 600 nm, the other is at :-",options:["1035 nm","1200 nm","600 nm","518 nm"],correctAnswer:3,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q80)",text:`By conservation of energy: E_absorbed = E\u2081 + E\u2082
hc / \u03BB = hc / \u03BB\u2081 + hc / \u03BB\u2082
1 / 300 = 1 / 600 + 1 / \u03BB\u2082
1 / \u03BB\u2082 = 1 / 300 - 1 / 600 = 1 / 600 \u21D2 \u03BB\u2082 = 600 nm.`,steps:["1/\u03BB = 1/\u03BB\u2081 + 1/\u03BB\u2082","1/300 = 1/600 + 1/\u03BB\u2082","1/\u03BB\u2082 = 1/600 \u21D2 \u03BB\u2082 = 600 nm"]}},{id:81,subject:"Chemistry",topic:"Specific Charge of Particles",questionText:"Which of the following is correct sequence of specific charge ?",options:["e\u207B > Na\u207A > p > n","e\u207B > p > Na\u207A > n","Na\u207A > e\u207B > p > n","e\u207B > n > p > Na\u207A"],correctAnswer:2,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q81)",text:`Specific charge = q / m
Electron (e\u207B): 1.758 \xD7 10\xB9\xB9 C/kg
Proton (p): 9.58 \xD7 10\u2077 C/kg
Sodium ion (Na\u207A): (9.58 \xD7 10\u2077) / 23 = 4.16 \xD7 10\u2076 C/kg
Neutron (n): charge is 0 \u21D2 specific charge = 0
Correct order: e\u207B > p > Na\u207A > n.`,steps:["e\u207B: ~ 1.76 \xD7 10\xB9\xB9 C/kg","p: ~ 9.58 \xD7 10\u2077 C/kg","Na\u207A: ~ 4.16 \xD7 10\u2076 C/kg","n: 0 C/kg","Sequence: e\u207B > p > Na\u207A > n"]}},{id:82,subject:"Chemistry",topic:"Excited States Angular Momentum",questionText:"According to Bohr's theory, the angular momentum for an electron in its 3rd excited state will be :",options:["4h/(3\u03C0)","2h/\u03C0","5h/\u03C0","25h/\u03C0"],correctAnswer:2,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q82)",text:`3rd excited state corresponds to principal quantum number n = 4.
Angular momentum L = n h / (2\u03C0) = 4 h / (2\u03C0) = 2h / \u03C0.`,steps:["3rd excited state means n = 3 + 1 = 4","L = 4h / 2\u03C0 = 2h / \u03C0"]}},{id:83,subject:"Chemistry",topic:"Velocity of Electron in Different Orbits",questionText:"The ratio of velocity of the electron in the third and fifth orbit of Li\xB2\u207A would be :-",options:["3 : 5","5 : 3","25 : 9","9 : 25"],correctAnswer:2,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q83)",text:`Velocity in Bohr orbit v \u221D 1/n (for same Z)
v\u2083 / v\u2085 = n\u2085 / n\u2083 = 5 / 3 = 5 : 3.`,steps:["v \u221D 1/n","v\u2083 / v\u2085 = 5 / 3 = 5 : 3"]}},{id:84,subject:"Chemistry",topic:"Ionization Energy vs Ground State Energy",questionText:"If the ionization energy for He\u207A ion\u2019s e\u207B is x then the energy of e\u207B in its 1st orbit will be",options:["\u2013x/2","13x/2","\u2013x","\u2013x/3"],correctAnswer:3,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q84)",text:`Ionization Energy (IE) is defined as the minimum energy required to remove an electron from its ground state (n = 1) to infinity (n = \u221E):
IE = E_\u221E - E\u2081 = 0 - E\u2081 = - E\u2081
Given IE = x \u21D2 E\u2081 = -x.`,steps:["IE = E_\u221E - E\u2081 = - E\u2081","x = - E\u2081 \u21D2 E\u2081 = -x"]}},{id:85,subject:"Chemistry",topic:"Balmer Series First Line Wave Number",questionText:"The first emission line in H-atom spectrum in balmer series will have wave no. :-",options:["5R / 36","3R / 4","7R / 4","9R / 400"],correctAnswer:1,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q85)",text:`First line of Balmer series corresponds to transition from n\u2082 = 3 to n\u2081 = 2.
Wave number \u03BD\u0304 = R_H Z\xB2 [1/n\u2081\xB2 - 1/n\u2082\xB2]
= R (1)\xB2 [1/2\xB2 - 1/3\xB2] = R [1/4 - 1/9] = 5R / 36.`,steps:["Balmer first line: n\u2081 = 2, n\u2082 = 3","\u03BD\u0304 = R (1/4 - 1/9) = 5R / 36"]}},{id:86,subject:"Chemistry",topic:"Mole Concept (Moles of Electrons in Carbon)",questionText:"No. of moles of e\u207B in 12g C-atom will be :",options:["6 moles","3 moles","12 moles","4 moles"],correctAnswer:1,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q86)",text:`Moles of Carbon atoms = 12 g / (12 g/mol) = 1 mol C atoms.
Each neutral carbon atom (Z = 6) contains 6 electrons.
1 mol of carbon atoms contains 1 \xD7 6 = 6 moles of electrons.`,steps:["Moles of C = 12 / 12 = 1 mol","Electrons per C atom = 6","Moles of e\u207B = 6 moles"]}},{id:87,subject:"Chemistry",topic:"Mole Concept (Moles of Oxygen Atoms)",questionText:"Moles of atom in 32 g oxygen gas is :",options:["2 mol","3 mol","1 mol","None of these"],correctAnswer:1,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q87)",text:`Oxygen gas exists as diatomic molecules (O\u2082).
Molar mass of O\u2082 = 32 g/mol.
Moles of O\u2082 molecules = 32 g / 32 g/mol = 1 mol.
Each O\u2082 molecule contains 2 oxygen atoms.
Total moles of oxygen atoms = 1 \xD7 2 = 2 mol.`,steps:["Moles of O\u2082 = 32 / 32 = 1 mol O\u2082","Atomicity of O\u2082 = 2","Moles of O atoms = 2 mol"]}},{id:88,subject:"Chemistry",topic:"Combustion Stoichiometry & STP Volume",questionText:"In complete combustion of 3g ethane what is the volume of CO\u2082 gas produced at STP",options:["44.8 L","2.24 L","4.48 L","11.2 L"],correctAnswer:3,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q88)",text:`Molar mass of ethane (C\u2082H\u2086) = 2(12) + 6(1) = 30 g/mol.
Moles of C\u2082H\u2086 = 3 g / 30 g/mol = 0.1 mol.
Combustion reaction: C\u2082H\u2086 + 7/2 O\u2082 \u2192 2CO\u2082 + 3H\u2082O
1 mole C\u2082H\u2086 produces 2 moles CO\u2082.
0.1 mole C\u2082H\u2086 produces 0.2 mole CO\u2082.
Volume of CO\u2082 at STP = 0.2 mol \xD7 22.4 L/mol = 4.48 L.`,steps:["Moles of C\u2082H\u2086 = 3 / 30 = 0.1 mol","Moles of CO\u2082 = 0.1 \xD7 2 = 0.2 mol","Volume at STP = 0.2 \xD7 22.4 L = 4.48 L"]}},{id:89,subject:"Chemistry",topic:"Atomic Transitions & Frequency Addition",questionText:"In the following transition which statement is correct?",diagramKey:"chem_q44",options:["E\u2083\u208B\u2081 = E\u2083\u208B\u2082 \u2013 E\u2082\u208B\u2081","\u03BB\u2083 = \u03BB\u2081 + \u03BB\u2082","\u03BD\u2083 = \u03BD\u2081 + \u03BD\u2082","All of these"],correctAnswer:3,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q89)",text:`From the energy level diagram: E\u2083\u208B\u2081 = E\u2083\u208B\u2082 + E\u2082\u208B\u2081
Since E = h\u03BD: h\u03BD\u2083 = h\u03BD\u2081 + h\u03BD\u2082 \u21D2 \u03BD\u2083 = \u03BD\u2081 + \u03BD\u2082.
(In terms of wavelength: 1/\u03BB\u2083 = 1/\u03BB\u2081 + 1/\u03BB\u2082, not \u03BB\u2083 = \u03BB\u2081 + \u03BB\u2082).`,steps:["E\u2083\u208B\u2081 = E\u2083\u208B\u2082 + E\u2082\u208B\u2081","h\u03BD\u2083 = h\u03BD\u2081 + h\u03BD\u2082","\u03BD\u2083 = \u03BD\u2081 + \u03BD\u2082"]}},{id:90,subject:"Chemistry",topic:"Ionization Energies of H-like Species",questionText:"The ratio of Ionisation energies of Li\u207A\xB2 and Be\u207A\xB3 is",options:["2/3","3/2","9/16","16/9"],correctAnswer:3,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q90)",text:`Ionization Energy for single-electron (hydrogen-like) species in ground state:
IE = 13.6 \xD7 Z\xB2 eV
For Li\xB2\u207A: Z = 3 \u21D2 IE(Li\xB2\u207A) = 13.6 \xD7 3\xB2 = 13.6 \xD7 9
For Be\xB3\u207A: Z = 4 \u21D2 IE(Be\xB3\u207A) = 13.6 \xD7 4\xB2 = 13.6 \xD7 16
Ratio IE(Li\xB2\u207A) / IE(Be\xB3\u207A) = 9 / 16.`,steps:["IE \u221D Z\xB2","IE(Li\xB2\u207A) \u221D 3\xB2 = 9","IE(Be\xB3\u207A) \u221D 4\xB2 = 16","Ratio = 9 / 16"]}}];var rm=[{id:91,subject:"Biology",topic:"Animal Kingdom (Annelida)",questionText:"The given animal belongs to which phylum?",diagramKey:"bio_q91",options:["Platyhelminthes","Aschelminthes","Annelida","Arthropoda"],correctAnswer:3,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q91)",text:"The image depicts Nereis, an aquatic annelid that possesses parapodia for swimming and exhibits true metameric segmentation. It belongs to Phylum Annelida.",steps:["The organism shown is Nereis","Nereis belongs to Phylum Annelida"]}},{id:92,subject:"Biology",topic:"Animal Kingdom (Reptilia Common Names)",questionText:`Match the following column I and II to select correct answer:
Column I (Scientific Name):
1. Vipera
2. Naja
3. Hemidactylus
4. Python
Column II (Common Name):
a. Wall lizard
b. Ajgar
c. Indian cobra
d. Viper snake`,options:["1-c, 2-d, 3-a, 4-b","1-a, 2-b, 3-c, 4-d","1-d, 2-c, 3-a, 4-b","1-d, 2-c, 3-b, 4-a"],correctAnswer:3,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q92)",text:`1. Vipera \u2192 Viper snake (d)
2. Naja \u2192 Indian cobra (c)
3. Hemidactylus \u2192 Wall lizard (a)
4. Python \u2192 Ajgar (b)
Correct match is 1-d, 2-c, 3-a, 4-b.`,steps:["Vipera = Viper (1-d)","Naja = Cobra (2-c)","Hemidactylus = Wall lizard (3-a)","Python = Ajgar (4-b)"]}},{id:93,subject:"Biology",topic:"Animal Kingdom (Body Symmetry)",questionText:"Which of the following group of animals exhibit bilateral symmetry only ?",options:["Pennatula, Adamsia, Pleurobrachia","Euspongia, Spongilla, Taenia","Ascaris, Nereis, Scorpion","Echinus, Gorgonia, Sycon"],correctAnswer:3,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q93)",text:"Ascaris (Aschelminthes), Nereis (Annelida), and Scorpion (Arthropoda) all exhibit bilateral symmetry exclusively. Pennatula/Adamsia/Pleurobrachia have radial/biradial symmetry; Sponges are mostly asymmetrical; adult Echinoderms have radial symmetry.",steps:["Ascaris, Nereis, and Scorpion are triploblastic bilaterians","All three exhibit bilateral symmetry only"]}},{id:94,subject:"Biology",topic:"Animal Kingdom (Class Aves Features)",questionText:`Read the following statements from A-D ?
(A) They have pneumatic bones
(B) Skin is dry without glands.
(C) Digestive tract has additional chambers, the crop and gizzard.
(D) They are warm blooded.
These statements are correct for which animal ?`,options:["Vipera","Columba","Labeo","Pteropus"],correctAnswer:2,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q94)",text:"Pneumatic (air-filled) bones, dry skin devoid of glands (except preen/oil gland at tail base), digestive tract with crop and gizzard, and homeothermy (warm-blooded) are diagnostic characteristics of birds (Class Aves). Columba (pigeon) is a bird.",steps:["Features described belong to Class Aves","Columba (Pigeon) is a member of Class Aves"]}},{id:95,subject:"Biology",topic:"Animal Kingdom (Coelom Types)",questionText:"In the given diagram identify the coelomic condition in the animals :-",diagramKey:"bio_q95",options:["(A) Tapeworm, (B) Ascaris, (C) Earthworm","(A) Cockroach, (B) Ascaris, (C) Tapeworm","(A) Ascaris, (B) Tapeworm, (C) Earthworm","(A) Earthworm, (B) Cockroach, (C) Ascaris"],correctAnswer:2,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q95)",text:`Diagram (A) shows a true coelom lined completely by mesoderm (Coelomate, e.g. Cockroach / Earthworm).
Diagram (B) shows scattered pouches of mesoderm (Pseudocoelomate, e.g. Ascaris).
Diagram (C) shows no body cavity between ectoderm and endoderm (Acoelomate, e.g. Tapeworm / Platyhelminthes).
Hence: (A) Cockroach, (B) Ascaris, (C) Tapeworm.`,steps:["(A) True coelom = Cockroach (Arthropod)","(B) Pseudocoelom (scattered mesodermal pouches) = Ascaris","(C) Acoelomate (mesoderm solid) = Tapeworm"]}},{id:96,subject:"Biology",topic:"Animal Kingdom (Cnidaria Body Forms)",questionText:`Match the columns I, II, III and choose the correct combination from the given options :-
Column I (Diagram):
a. Stalked cylindrical body
b. Umbrella shaped free swimming body
Column II:
1. Aurelia
