Column III:
R. Polyp
S. Medusa`,diagramKey:"bio_q96",options:["a - 1 - R, b - 2 - S","a - 1 - S, b - 2 - R","a - 2 - R, b - 1 - S","a - 2 - S, b - 1 - R"],correctAnswer:3,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q96)",text:`a. Cylindrical and sessile form is Polyp, exemplified by Adamsia (Sea anemone) \u2192 a - 2 - R.
b. Umbrella-shaped and free-swimming form is Medusa, exemplified by Aurelia (Jelly fish) \u2192 b - 1 - S.`,steps:["Polyp (cylindrical/sessile) = Adamsia (a-2-R)","Medusa (umbrella/free-swimming) = Aurelia (b-1-S)"]}},{id:97,subject:"Biology",topic:"Animal Kingdom (Phylum Ctenophora)",questionText:`The characters given below are shown by :
(i) Extracellular and intracellular digestion.
(ii) Exclusively marine, radially symmetrical, diploblastic, tissue level of organisation.
(iii) Bisexual, fertilization external and indirect development.
(iv) Only sexual reproduction.`,options:["Cnidaria","Porifera","Ctenophora","Platyhelminthes"],correctAnswer:3,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q97)",text:"Exclusively marine habitat, radial symmetry, diploblastic tissue-level organization, both extra- and intracellular digestion, reproduction exclusively by sexual means, external fertilization, and ciliated comb plates are unique diagnostic features of Ctenophores (comb jellies/sea walnuts).",steps:["Exclusively marine + only sexual reproduction + external fertilization = Ctenophora"]}},{id:98,subject:"Biology",topic:"Animal Kingdom (Platyhelminthes)",questionText:"Select incorrect statement about flatworms :-",options:["Hooks and suckers are present in all flat worms.","Fertilization is internal and development occurs through many larval stages.","Some of them absorb nutrients through body surface.","Locomotory organs are absent."],correctAnswer:1,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q98)",text:"Hooks and suckers are present only in the parasitic flatworms (like Taenia/Fasciola) to adhere to host tissues, but are absent in free-living flatworms like Planaria. Hence statement (1) is incorrect.",steps:["Hooks and suckers are present only in parasitic forms, not in all flatworms"]}},{id:99,subject:"Biology",topic:"Animal Kingdom (Phylum Mollusca)",questionText:"Find out incorrect statement :-",options:["Body of molluscs is segmented as it is divided into head, muscular foot and visceral hump.","Gills help in excretion in Molluscs.","Anus of Mollusc open into mantle cavity","Loligo is also known as squid"],correctAnswer:1,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q99)",text:"Molluscs are unsegmented animals (except Neopilina). Their body is unsegmented and divided into head, muscular foot, and visceral hump. Therefore, statement (1) is incorrect.",steps:["Molluscs are unsegmented invertebrates","Statement (1) incorrectly calls them segmented"]}},{id:100,subject:"Biology",topic:"Animal Kingdom (Echinodermata Identification)",questionText:`How many animals are related with echinodermata ?
Asterias, Echinus, Sea lily, Ophiura, Cucumaria, Saccoglossus, Cuttle fish, Sea hare, Culex, Chiton`,options:["6","4","7","5"],correctAnswer:4,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q100)",text:`Echinoderms among the given list are:
1. Asterias (Star fish)
2. Echinus (Sea urchin)
3. Sea lily (Antedon)
4. Ophiura (Brittle star)
5. Cucumaria (Sea cucumber)
(Saccoglossus is Hemichordata; Cuttle fish, Sea hare, Chiton are Mollusca; Culex is Arthropoda). Total = 5.`,steps:["Echinoderms: Asterias, Echinus, Sea lily, Ophiura, Cucumaria = 5 animals"]}},{id:101,subject:"Biology",topic:"Animal Kingdom (Hemichordata Excretion)",questionText:"Proboscis gland is excretory in function, it is found in :",options:["Echinus","Saccoglossus","Balanoglossus","Both 2 and 3"],correctAnswer:4,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q101)",text:"In Phylum Hemichordata (e.g. Balanoglossus and Saccoglossus), the excretory organ is the proboscis gland situated in the proboscis region.",steps:["Proboscis gland is found in Hemichordates","Both Saccoglossus and Balanoglossus possess proboscis gland"]}},{id:102,subject:"Biology",topic:"Animal Kingdom (Chordata Classification Flowchart)",questionText:`Read the following chart given and identify A, B, C and D :-
Vertebrate \u2192 Division: [A] (Cyclostomata) and [B] (Super class: Pisces and [C]). Pisces includes Chondrichthyes and [D].`,diagramKey:"bio_q102",options:["A: Lacks Jaw, B: Bears Jaw, C: Apoda, D: Osteichthyes","A: Bears Jaw, B: Lacks Jaw, C: Octapoda, D: Osteichthyes","A: Lacks Jaw, B: Lacks Jaw, C: Hexapoda, D: Osteichthyes","A: Lacks Jaw, B: Bears Jaw, C: Tetrapoda, D: Osteichthyes"],correctAnswer:4,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q102)",text:`Subphylum Vertebrata is divided into two divisions:
- Agnatha (A: Lacks Jaw)
- Gnathostomata (B: Bears Jaw)
Gnathostomata is divided into super classes: Pisces (bears fins) and Tetrapoda (C: bears limbs).
Pisces contains classes Chondrichthyes and Osteichthyes (D: bony fishes).`,steps:["A = Agnatha (Lacks jaw)","B = Gnathostomata (Bears jaw)","C = Tetrapoda (Limbed vertebrates)","D = Osteichthyes (Bony fishes)"]}},{id:103,subject:"Biology",topic:"Animal Kingdom (Arthropoda Organs)",questionText:"Excretory and respiratory organs of the given animal are respectively :-",diagramKey:"bio_q103",options:["Malpighian tubules and Book lungs","Antennary glands and Book lungs","Coxal glands and Book lungs","Coxal glands and Trachea"],correctAnswer:3,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q103)",text:`The animal shown is a Scorpion (Class Arachnida, Phylum Arthropoda).
Its primary excretory organs are coxal glands (and Malpighian tubules) and its respiratory organs are book lungs.`,steps:["Animal is Scorpion (Arachnida)","Excretory organ: Coxal glands","Respiratory organ: Book lungs"]}},{id:104,subject:"Biology",topic:"Animal Kingdom (Digestive System Evolution)",questionText:"Name the first phylum in which alimentary canal is complete with a well developed muscular pharynx -",options:["Platyhelminthes","Aschelminthes","Ctenophora","Coelenterata"],correctAnswer:2,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q104)",text:"Aschelminthes (roundworms) is the first phylum to evolve a complete alimentary canal with both mouth and anus and a well-developed muscular pharynx. In lower phyla (Cnidaria, Ctenophora, Platyhelminthes) the digestive cavity has a single opening (incomplete).",steps:["Complete gut with muscular pharynx first appeared in Phylum Aschelminthes"]}},{id:105,subject:"Biology",topic:"Animal Kingdom (Chondrichthyes vs Osteichthyes)",questionText:`See following specimens (Dogfish / Scoliodon and Sea horse / Hippocampus) and give correct answer about them :-
How many of the following features are not common in both ?
(A) Marine
(B) Air bladder
(C) Cold blooded
(D) Terminal mouth
(E) Oviparous
(F) Presence of scales`,diagramKey:"bio_q105",options:["Two","Three","Four","Five"],correctAnswer:2,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q105)",text:`Comparison of Scoliodon (Chondrichthyes) vs Hippocampus (Osteichthyes):
- (A) Marine: Common to both
- (B) Air bladder: Present in Hippocampus, absent in Scoliodon (NOT common)
- (C) Cold blooded: Common to both (poikilothermous)
- (D) Terminal mouth: Ventral in Scoliodon, terminal in Hippocampus (NOT common)
- (E) Oviparous: Scoliodon is viviparous, Hippocampus is oviparous (NOT common)
- (F) Presence of scales: Common (placoid in dogfish, bony plates in seahorse)
Total NOT common features = 3 (B, D, E).`,steps:["Not common: Air bladder (B), Terminal mouth (D), Oviparous (E) = 3 features"]}},{id:106,subject:"Biology",topic:"Animal Kingdom (Protochordates)",questionText:"Protochordates are :-",options:["Non chordates","Euchordates","Tunicates and cephalochordates","Hemichordates"],correctAnswer:3,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q106)",text:"Protochordata (Acraniata) includes Subphylum Urochordata (Tunicata) and Subphylum Cephalochordata. They are exclusively marine and lack a cranium/vertebral column.",steps:["Protochordata consists of Urochordata (Tunicates) and Cephalochordata"]}},{id:107,subject:"Biology",topic:"Animal Kingdom (Mammalia Adaptations)",questionText:"Select the correct option and complete the analogy: Egg laying mammal: Platypus :: Flying mammal :_____.",options:["Corvus","Macropus","Exocoetus","Pteropus"],correctAnswer:4,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q107)",text:"Platypus (Ornithorhynchus) is an oviparous (egg-laying) mammal. Similarly, Pteropus (flying fox / bat) is a flying mammal (adapted for true powered flight). Corvus is a bird, Exocoetus is a flying fish, and Macropus is a kangaroo.",steps:["Flying mammal is Pteropus (Bat)"]}},{id:108,subject:"Biology",topic:"Animal Kingdom (Mammals vs Birds)",questionText:"Which is not an example of mammal ?",options:["Macropus","Struthio","Pteropus","Both 2 & 3"],correctAnswer:2,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q108)",text:"Struthio (Ostrich) is a flightless bird belonging to Class Aves, not Mammalia. Macropus (Kangaroo) and Pteropus (Bat) are mammals.",steps:["Struthio is an Ostrich (Class Aves)"]}},{id:109,subject:"Biology",topic:"Animal Kingdom (Genus Character Matching)",questionText:`In which one of the following the genus name, its two characters and its class/phylum are correctly matched ?
(1) Aurelia: (a) Cnidoblasts, (b) Organ level of organization | Coelenterata
(2) Ascaris: (a) Body segmented, (b) Males and females distinct | Annelida
(3) Salamandra: (a) A tympanum represents ear, (b) Fertilization is external | Amphibia
(4) Pteropus: (a) Skin possesses hair, (b) Oviparous | Mammalia`,options:["1","2","3","4"],correctAnswer:3,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q109)",text:"Salamandra belongs to Class Amphibia. Amphibians have a tympanum representing the ear and exhibit external fertilization. In (1) Aurelia has tissue level; in (2) Ascaris is unsegmented Aschelminthes; in (4) Pteropus is viviparous.",steps:["Salamandra (Amphibia): Tympanum ear + external fertilization is completely correct"]}},{id:110,subject:"Biology",topic:"Animal Kingdom (Amphibia Characteristics)",questionText:`Read the following four statements A-D :-
(A) Amphibians live in terrestrial habitats only.
(B) In amphibians, respiration takes place by gills, lungs, moist skin and through buccopharyngeal cavity.
(C) The skin of amphibians is smooth, moist and scaleless.
(D) In Amphibians, Alimentary canal, urinary tract and genital ducts open into a common chamber called cloaca.
How many of the above statements are incorrect?`,options:["Two","Three","Four","One"],correctAnswer:4,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q110)",text:"Statement (A) is incorrect because amphibians can live in dual habitats: aquatic as well as terrestrial. Statements (B), (C), and (D) are all correct. Hence, only ONE statement is incorrect.",steps:["Statement (A) is false (Amphibians live in aquatic and terrestrial habitats)","Statements B, C, D are true","Incorrect statement count = 1"]}},{id:111,subject:"Biology",topic:"Animal Kingdom (Peculiar Character of Porifera)",questionText:"The members of phylum porifera are called sponges, having numerous distinguishable character, but which of the following considered as their peculiar character ?",options:["These are diploblastic animals.","Most members are marine and some are fresh water.","Choanocytes line the spongocoel.","Intracellular digestion."],correctAnswer:3,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q111)",text:"Choanocytes (collar cells) lining the spongocoel and the radial canals are unique to Phylum Porifera and are not found in any other animal phylum.",steps:["Choanocytes (collar cells) lining spongocoel are unique/peculiar to sponges"]}},{id:112,subject:"Biology",topic:"Animal Kingdom (Chordata vs Vertebrata Statements)",questionText:`Read the following statements A-D and choose the option which have all the correct ones only. :-
(A) All vertebrates are chordates but all chordates are not vertebrates.
(B) In cephalochordata notochord persist throughout the life.
(C) Protochordates are vertebrates.
(D) In chordates nerve cord is situated at the ventral surface of body.`,options:["Statement C, D","Statement A, B","Statement A, B, D","Statement B, C and D"],correctAnswer:2,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q112)",text:`(A) Correct: Vertebrates are a subphylum of chordates.
(B) Correct: In Cephalochordates (e.g. Branchiostoma), notochord extends from head to tail and persists throughout life.
(C) Incorrect: Protochordates are non-vertebrate chordates.
(D) Incorrect: Chordates have a dorsal, hollow nerve cord.
Thus, only A and B are correct.`,steps:["A is true, B is true","C is false (Protochordates lack vertebral column)","D is false (Chordate nerve cord is dorsal)","Correct option: Statement A, B"]}},{id:113,subject:"Biology",topic:"Animal Kingdom (General Features)",questionText:"Members belong to kingdom animalia are characterized by :-",options:["Heterotrophic, Multicellular","Eukaryotic organism, cell wall absent","Directly or indirectly depends upon plants for food.","All of the above"],correctAnswer:4,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q113)",text:"Kingdom Animalia comprises multicellular, eukaryotic, heterotrophic organisms lacking cell walls and chlorophyll, directly or indirectly dependent on plants for nourishment. All the given features are characteristic of animals.",steps:["All statements correctly define Kingdom Animalia"]}},{id:114,subject:"Biology",topic:"Animal Kingdom (Comparative Characteristics)",questionText:"Which one of the following pairs of animals are similar to each other pertaining to the feature stated against them?",options:["Ascaris and Ancylostoma \u2014 Metameric segmentation","Sea horse and Flying fish \u2014 Cold blooded (poikilothermal)","Pteropus and Ornithorhynchus \u2014 Viviparity","Garden lizard and Crocodile \u2014 Three chambered heart"],correctAnswer:2,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q114)",text:"Sea horse (Hippocampus) and Flying fish (Exocoetus) are both bony fishes (Osteichthyes) and are cold-blooded (poikilothermous). Ascaris/Ancylostoma are unsegmented; Ornithorhynchus is oviparous; Crocodile has a 4-chambered heart.",steps:["Sea horse and flying fish are both poikilotherms (Option 2 is correct)"]}},{id:115,subject:"Biology",topic:"Animal Kingdom (Exceptions in Animal Taxa)",questionText:"Which one of the following categories of animals, is correctly described with no single exception in it ?",options:["All sponges are marine and have collar cells.","All mammals are viviparous and possess diaphragm for breathing.","All reptiles possess scales, have a three chambered heart and are cold blooded (poikilothermal).","All bony fishes have gills covered by an operculum on each sides."],correctAnswer:4,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q115)",text:"All bony fishes (Osteichthyes) possess 4 pairs of gills covered by an operculum on each side without exception. (Spongilla is freshwater sponge; Platypus is oviparous mammal; Crocodile is 4-chambered reptile).",steps:["Operculum over gills is universally present in all Osteichthyes"]}},{id:116,subject:"Biology",topic:"Animal Kingdom (Reptilia Characteristics)",questionText:"Which one is poikilothermic and has dryskin ?",diagramKey:"bio_q116",options:["Salamander (Salamandra)","Sea horse (Hippocampus)","Chameleon (Calotes / Tree lizard)","Platypus (Ornithorhynchus)"],correctAnswer:3,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q116)",text:"Chameleon (Reptilia) is poikilothermous (cold-blooded) and has dry, cornified skin covered by epidermal scales or scutes. Salamandra has moist skin; Sea horse has wet skin with mucous; Platypus is warm-blooded (homeothermous).",steps:["Dry cornified skin + poikilothermic = Reptile (Chameleon)"]}},{id:117,subject:"Biology",topic:"Taxonomic Hierarchy of Chordata",questionText:`Match column-I with column-II and select the correct option :
Column-I:
(a) Phylum
(b) Subphylum
(c) Division
(d) Super class
(e) Class
Column-II:
(P) Agnatha
(Q) Cyclostomata
(R) Tetrapoda

(T) Vertebrata`,options:["a-S, b-T, c-P, d-Q, e-R","a-S, b-T, c-Q, d-R, e-P","a-S, b-T, c-P, d-R, e-Q","a-S, b-R, c-Q, d-P, e-T"],correctAnswer:3,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q117)",text:`(a) Phylum \u2192 Chordata (S)
(b) Subphylum \u2192 Vertebrata (T)
(c) Division \u2192 Agnatha / Gnathostomata (P)

Correct match: a-S, b-T, c-P, d-R, e-Q.`,steps:["Phylum = Chordata (S)","Subphylum = Vertebrata (T)","Division = Agnatha (P)","Super class = Tetrapoda (R)","Class = Cyclostomata (Q)"]}},{id:118,subject:"Biology",topic:"Circulatory System in Birds & Mammals",questionText:"Birds and mammals have :-",options:["Three chambered heart with double circulation","Four chambered heart with double circulation","Two chambered heart with single circulation","Four chambered heart with truncus arteriosus"],correctAnswer:2,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q118)",text:"Both birds (Aves) and mammals possess a four-chambered heart (two atria and two ventricles) with completely separated pulmonary and systemic circuits, exhibiting complete double circulation.",steps:["4-chambered heart + complete double circulation"]}},{id:119,subject:"Biology",topic:"Animal Kingdom (Match Organs to Phyla)",questionText:`Match the column-I and II correctly :-
Column-I (Phylum):

(C) Hemichordata
(D) Echinodermata
Column-II (Feature/Organ):
(i) Proboscis gland
(ii) Radial symmetry
(iii) Malpighian tubules
(iv) Radula`,options:["A-i, B-iii, C-iv, D-ii","A-i, B-ii, C-iii, D-iv","A-i, B-iv, C-ii, D-iii","A-iv, B-iii, C-i, D-ii"],correctAnswer:4,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q119)",text:`(A) Mollusca \u2192 Radula (iv)
(B) Arthropoda \u2192 Malpighian tubules (iii)
(C) Hemichordata \u2192 Proboscis gland (i)
(D) Echinodermata \u2192 Radial symmetry in adult (ii)
Matching: A-iv, B-iii, C-i, D-ii.`,steps:["Mollusca = Radula (iv)","Arthropoda = Malpighian tubules (iii)","Hemichordata = Proboscis gland (i)","Echinodermata = Radial symmetry (ii)"]}},{id:120,subject:"Biology",topic:"Vertebrate Heart Chambers",questionText:"Which of the following animals has three chambered heart ?",options:["Scoliodon","Hippocampus","Chelone","Pteropus"],correctAnswer:3,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q120)",text:"Chelone (Turtle) is a reptile and possesses a 3-chambered heart (two atria and one incompletely divided ventricle). Scoliodon and Hippocampus are fishes (2-chambered); Pteropus is a mammal (4-chambered).",steps:["Chelone (turtle) is a reptile with a 3-chambered heart"]}},{id:121,subject:"Biology",topic:"Living World (Binomial Nomenclature)",questionText:`Assertion (A): Binomial nomenclature consists of two words \u2013 genus and specific epithet.
Reason (R): This system was given by Ernst Mayr.
Choose correct option:`,options:["Both A and R are true, and R is the correct explanation of A","Both A and R are true, but R is not the correct explanation of A","A is true but R is false","A is false but R is true"],correctAnswer:3,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q121)",text:"Assertion is true: Binomial nomenclature uses two parts \u2014 generic name and specific epithet. Reason is false: The binomial nomenclature system was established and standardized by Carolus Linnaeus (Ernst Mayr proposed the biological concept of species).",steps:["Binomial system was given by Carolus Linnaeus, not Ernst Mayr","Assertion is true, Reason is false"]}},{id:122,subject:"Biology",topic:"Living World (Scientific Names Matching)",questionText:`Match the organism with the correct scientific name:

Correct code: A-3, B-1, C-4, D-2.`,steps:["Man = Homo sapiens","Mango = Mangifera indica","Housefly = Musca domestica","Wheat = Triticum aestivum"]}},{id:123,subject:"Biology",topic:"Living World (Binomial Nomenclature Rules)",questionText:"Scientific name of mango is:",options:["Mangifera Indica","Mangifera indica Linn","mangifera indica","Mangifera Indica L."],correctAnswer:2,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q123)",text:"According to ICBN rules, the genus name starts with a capital letter (Mangifera), the specific epithet starts with a small letter (indica), and the author citation is written in Roman script at the end in abbreviated form (Linn. or L.). Hence Mangifera indica Linn is the correct scientific name.",steps:["Genus capitalized, species small, author citation at the end: Mangifera indica Linn"]}},{id:124,subject:"Biology",topic:"Living World (Taxon Definition)",questionText:"In taxonomy, which term refers to a group at any level?",options:["Kingdom","Taxon","Category","Species"],correctAnswer:2,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q124)",text:"A taxon (plural: taxa) is a scientific term used to represent a taxonomic group of real organisms at any rank or level (e.g. Dogs, Mammals, Plants, Chordates).",steps:["A group of real organisms at any taxonomic level is termed a Taxon"]}},{id:125,subject:"Biology",topic:"Taxonomic Hierarchy (Broadest Category)",questionText:"Which one of the following categories has the maximum number of organisms?",options:["Class","Order","Genus","Kingdom"],correctAnswer:4,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q125)",text:"In the taxonomic hierarchy from species to kingdom, Kingdom is the highest and broadest obligate category, encompassing the maximum diversity and largest number of organisms.",steps:["Kingdom is the highest rank and contains the maximum organisms"]}},{id:126,subject:"Biology",topic:"Binomial Nomenclature (Genus and Specific Epithet)",questionText:"Which of the following is a correct example of genus and specific epithet ?",options:["Mangifera \u2013 indica","indica \u2013 Mangifera","Triticum \u2013 aestivum","Both (1) and (3)"],correctAnswer:4,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q126)",text:"In Mangifera indica, Mangifera is the genus and indica is the specific epithet. In Triticum aestivum, Triticum is the genus and aestivum is the specific epithet. Both (1) and (3) are correct.",steps:["Both Mangifera-indica and Triticum-aestivum have genus first then species"]}},{id:127,subject:"Biology",topic:"Taxonomy (Order Carnivora)",questionText:"Which of the following organisms belong to order Carnivora?",options:["Dog, Tiger","Cow, Goat","Rabbit, Mouse","Deer, Buffalo"],correctAnswer:1,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q127)",text:"Order Carnivora comprises flesh-eating mammals including families Canidae (Dog, Wolf, Fox) and Felidae (Tiger, Lion, Leopard, Cat).",steps:["Dog (Canidae) and Tiger (Felidae) belong to Order Carnivora"]}},{id:128,subject:"Biology",topic:"Taxonomic Terminology (Phylum vs Division)",questionText:"Which of the following refers to the taxonomic category \u201CPhylum\u201D?",options:["Only used in plants","Used only for prokaryotes","Used only for vertebrates","Used in animals instead of division"],correctAnswer:4,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q128)",text:'In taxonomic hierarchy, the term "Phylum" is used for animals, whereas the equivalent rank "Division" is used for plants.',steps:["Phylum is used for animal classification in place of Division"]}},{id:129,subject:"Biology",topic:"Binomial Nomenclature Rules",questionText:`Which of the following statements are correct regarding binomial nomenclature?
I. Genus and species names are always written in Latin.
II. The first word in the binomial name starts with a capital letter.
III. Scientific names are never underlined even when handwritten.
IV. The naming system was introduced by Carolus Linnaeus.`,options:["Only I, II, and IV","I, III, and IV","II and III only","All are correct"],correctAnswer:1,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q129)",text:"Statements I, II, and IV are correct. Statement III is incorrect because when handwritten, both genus and species names MUST be separately underlined to indicate their Latin origin.",steps:["Statement III is false (handwritten names must be underlined)","Statements I, II, IV are true"]}},{id:130,subject:"Biology",topic:"Mango Taxonomy (Mangifera indica)",questionText:`Which of the following are true regarding Mangifera indica?
I. 'Mangifera' refers to the genus.
II. 'indica' is the specific epithet.
III. The name must be underlined if handwritten.
IV. It belongs to the family Poaceae.`,options:["I, II, III","I, II, III, IV","I and III only","II, III, IV"],correctAnswer:1,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q130)",text:"I, II, and III are true. Statement IV is false because Mango belongs to the family Anacardiaceae (Poaceae is the grass/wheat family).",steps:["Mango family is Anacardiaceae (not Poaceae)","Statements I, II, III are correct"]}},{id:131,subject:"Biology",topic:"Biological Classification (Lichens)",questionText:"Lichens are :",options:["Symbiotic association between algae and fungi","Pollution indicators","Not placed in any kingdom by R.H. Whittaker","All of these are correct"],correctAnswer:4,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q131)",text:"Lichens are symbiotic associations of phycobiont (algae) and mycobiont (fungi). They are very sensitive to SO\u2082 air pollution and do not grow in polluted areas (pollution indicators). Whittaker did not include lichens (as well as viruses and viroids) in his Five Kingdom classification.",steps:["All statements accurately describe Lichens"]}},{id:132,subject:"Biology",topic:"Biological Classification (Mycorrhiza & TMV)",questionText:`Read the following statements :
(i) Mycorrhiza is the symbiotic association between roots of higher plants and fungus.
(ii) Lichens are biological indicator for water pollution.
(iii) Viroids contain only low molecular weight DNA and protein.
(iv) W.M. Stanley crystallised TMV
Which of the above statements are correct:`,options:["(i), (ii) and (iv)","(i) and (iv)","(ii) and (iii)","(i) and (ii)"],correctAnswer:2,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q132)",text:`(i) Correct: Mycorrhiza is symbiotic association of fungus and roots of higher plants (e.g. Pinus).
(ii) Incorrect: Lichens are bio-indicators for SO\u2082 air pollution, not water pollution.
(iii) Incorrect: Viroids lack a protein coat and contain free, low molecular weight RNA (no DNA, no protein).
(iv) Correct: W.M. Stanley (1935) crystallized TMV.`,steps:["Statement (i) is true","Statement (ii) is false (air pollution, not water)","Statement (iii) is false (viroids are free RNA without protein)","Statement (iv) is true (Stanley crystallized TMV)","Correct statements: (i) and (iv)"]}},{id:133,subject:"Biology",topic:"Biological Classification (Fungi Match)",questionText:`Match List-I with List-II.

Choose the correct answer from the options given below :-`,options:["A-III, B-II, C-IV, D-I","A-I, B-III, C-II, D-IV","A-III, B-II, C-I, D-IV","A-IV, B-III, C-II, D-I"],correctAnswer:1,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q133)",text:`A. Rhizopus \u2192 Bread mould (III)
B. Ustilago \u2192 Smut fungus (II)
C. Puccinia \u2192 Rust fungus (IV)
D. Agaricus \u2192 Mushroom (I)
Matching: A-III, B-II, C-IV, D-I.`,steps:["Rhizopus = Bread mould","Ustilago = Smut","Puccinia = Rust","Agaricus = Mushroom"]}},{id:134,subject:"Biology",topic:"Protista Nutrition Types",questionText:`Match List-I with List-II.

List-II (Mode of Nutrition):

IV. Switching between photosynthetic and heterotrophic mode`,options:["A-III, B-IV, C-II, D-I","A-IV, B-II, C-I, D-III","A-IV, B-III, C-II, D-I","A-IV, B-II, C-III, D-I"],correctAnswer:3,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q134)",text:`A. Euglenoids (mixotrophic, switch between photosynthetic and predatory/heterotrophic) \u2192 IV
B. Dinoflagellates (mostly marine photosynthetic) \u2192 III
C. Slime moulds (saprophytic protists) \u2192 II
D. Plasmodium (malarial parasite) \u2192 I
Matching: A-IV, B-III, C-II, D-I.`,steps:["Euglenoid = Mixotrophic (IV)","Dinoflagellate = Photosynthetic (III)","Slime mould = Saprophytic (II)","Plasmodium = Parasitic (I)"]}},{id:135,subject:"Biology",topic:"Kingdom Fungi (Class Ascomycetes)",questionText:`The following features belong to class :
A. Mycelium branched and septate.
B. Asexual spores conidia produced exogenously.
C. Sexual spores produced endogenously.
D. Many members of this class are edible.
Identify the class of fungi:`,options:["Ascomycetes","Phycomycetes","Basidiomycetes","Deuteromycetes"],correctAnswer:1,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q135)",text:"Ascomycetes (sac fungi) have branched, septate mycelium, produce asexual conidia exogenously on conidiophores, produce sexual ascospores endogenously in sac-like asci, and include edible delicacies such as morels and truffles.",steps:["Endogenous sexual spores (ascospores) + exogenous conidia = Ascomycetes"]}}];var cm=[{id:136,subject:"Biology",topic:"Biological Classification (Kingdom Protista)",questionText:`Read the following statements (A-D) :-
(A) Mostly unicellular with well defined nucleus.
(B) Cell wall made of silica.
(C) Reserve food is paramylum.
(D) Spores possess true cell wall.
Which of the following kingdoms is characterized by the above statements ?`,options:["Protista","Monera","Plantae","Fungi"],correctAnswer:1,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q136)",text:"Kingdom Protista includes unicellular eukaryotes with well-defined nucleus, containing Chrysophytes (diatoms with silica wall), Euglenoids (paramylum reserve food), and Slime moulds (spores with true walls).",steps:["All statements describe various groups belonging to Kingdom Protista"]}},{id:137,subject:"Biology",topic:"Fungi Imperfecti (Deuteromycetes)",questionText:"Which one of the following matches is correct ?",options:["Mucor - Reproduction by Conjugation - Ascomycetes","Agaricus - Parasitic fungus - Basidiomycetes","Alternaria - Sexual reproduction absent - Deuteromycetes","Phytophthora - Aseptate mycelium - Basidiomycetes"],correctAnswer:3,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q137)",text:"Alternaria is a member of Deuteromycetes (fungi imperfecti), in which sexual reproduction is absent or not yet discovered. (Mucor is Phycomycetes; Agaricus is saprophytic; Phytophthora is Phycomycetes).",steps:["Alternaria belongs to Deuteromycetes and lacks sexual stage"]}},{id:138,subject:"Biology",topic:"Five Kingdom Classification Criteria",questionText:"Five kingdom system of classification suggested by R.H. Whittaker is not based on :",options:["Presence or absence of a well defined nucleus","Mode of reproduction","Mode of locomotion","Mode of nutrition"],correctAnswer:3,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q138)",text:"Whittaker\u2019s 5 kingdom criteria are: 1. Cell structure (prokaryotic vs eukaryotic), 2. Body organization / thallus organization, 3. Mode of nutrition, 4. Reproduction, 5. Phylogenetic relationships. Locomotion was NOT a main criterion used by Whittaker.",steps:["Locomotion was not one of the main five classification criteria"]}},{id:139,subject:"Biology",topic:"Biological Classification (Viruses)",questionText:"Which of the following statement is false regarding viruses ?",options:["They are obligate parasite","Genetic material is either DNA or RNA","Viruses are inert crystalline structure outside living cell","They have their own metabolic system"],correctAnswer:4,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q139)",text:"Viruses do not possess their own metabolic machinery or protein synthesis enzymes. They hijack and use the host cell\u2019s metabolic apparatus for replication.",steps:["Viruses lack their own metabolic system (Statement 4 is false)"]}},{id:140,subject:"Biology",topic:"Kingdom Monera (Mycoplasma & Cyanobacteria)",questionText:"Which of the following statement is true ?",options:["All bacteria are autotrophs","Mycoplasma have cell wall","Cyanobacteria have chlorophyll a similar to green plants","Heterotrophic bacteria are responsible for production of biogas"],correctAnswer:3,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q140)",text:"Cyanobacteria (blue-green algae) are oxygenic photosynthetic organisms having chlorophyll a similar to higher green plants. Mycoplasma completely lack cell walls; Methanogens (archaebacteria) produce biogas; vast majority of bacteria are heterotrophs.",steps:["Cyanobacteria possess chlorophyll a (Oxygenic photoautotrophs)"]}},{id:141,subject:"Biology",topic:"Kingdom Fungi (Karyogamy & Plasmogamy)",questionText:"Fusion of protoplasms between two motile or non-motile gametes is called :-",options:["Karyogamy","Meiosis","Fertilization","Plasmogamy"],correctAnswer:4,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q141)",text:"The fusion of protoplasms (cytoplasms) between two motile or non-motile gametes in the fungal sexual cycle is called Plasmogamy. Karyogamy is the subsequent fusion of the two nuclei.",steps:["Protoplasm/cytoplasm fusion = Plasmogamy","Nuclear fusion = Karyogamy"]}},{id:142,subject:"Biology",topic:"Biological Classification (Kingdom Monera)",questionText:"Which kingdom has the sole members as bacteria ?",options:["Monera","Protista","Fungi","Plantae"],correctAnswer:1,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q142)",text:"Kingdom Monera encompasses all prokaryotes; bacteria are the sole members of Kingdom Monera.",steps:["Bacteria are the sole members of Kingdom Monera"]}},{id:143,subject:"Biology",topic:"Biological Classification (Bacterial Shapes)",questionText:`Match the column I with column II regarding bacterial shapes:

A. Coccus
B. Bacillus
C. Spirillum
D. Vibrio
Column II:
1. Rod-shaped
2. Comma-shaped
3. Spherical
4. Spiral`,options:["A-1, B-3, C-4, D-2","A-3, B-1, C-2, D-4","A-3, B-1, C-4, D-2","A-2, B-4, C-1, D-3"],correctAnswer:3,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q143)",text:`A. Coccus \u2192 Spherical (3)
B. Bacillus \u2192 Rod-shaped (1)
C. Spirillum \u2192 Spiral (4)
D. Vibrio \u2192 Comma-shaped (2)
Correct option: A-3, B-1, C-4, D-2.`,steps:["Coccus = spherical","Bacillus = rod","Spirillum = spiral","Vibrio = comma"]}},{id:144,subject:"Biology",topic:"Protista (Chrysophytes & Diatomaceous Earth)",questionText:"Diatomaceous earth is formed by the cell wall deposits of :-",options:["Dinoflagellates","Euglenoids","Chrysophytes","Slime moulds"],correctAnswer:3,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q144)",text:"Diatoms (Chrysophytes) have cell walls embedded with silica that are indestructible. Over billions of years, huge accumulation of their cell wall deposits on ocean bed forms diatomaceous earth / kieselguhr.",steps:["Diatom cell walls are indestructible (silica) forming diatomaceous earth"]}},{id:145,subject:"Biology",topic:"Protista (Euglena & Pellicle)",questionText:"Instead of a cell wall, Euglenoids have a protein rich layer called :-",options:["Capsule","Pellicle","Cuticle","Silica frustule"],correctAnswer:2,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q145)",text:"Euglenoids lack a cellulose cell wall and instead possess a flexible, protein-rich outer covering called the pellicle, which makes their body flexible.",steps:["Euglenoids have a protein-rich flexible pellicle"]}},{id:146,subject:"Biology",topic:"Kingdom Fungi (Bread Mould Rhizopus)",questionText:"Which class of fungi does Rhizopus belong to ?",options:["Ascomycetes","Basidiomycetes","Phycomycetes","Deuteromycetes"],correctAnswer:3,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q146)",text:"Rhizopus (bread mould), Mucor, and Albugo (parasitic fungus on mustard) belong to the class Phycomycetes (Zygomycetes/Oomycetes) with coenocytic and aseptate mycelium.",steps:["Rhizopus belongs to Phycomycetes"]}},{id:147,subject:"Biology",topic:"Kingdom Fungi (Puccinia & Rust)",questionText:"Puccinia is commonly known as :-",options:["Smut fungus","Mushroom","Rust fungus","Bracket fungus"],correctAnswer:3,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q147)",text:"Puccinia is a basidiomycete fungus known as the rust fungus (e.g., Puccinia graminis tritici causes black stem rust of wheat). Ustilago is smut fungus, Agaricus is mushroom.",steps:["Puccinia = Rust fungus"]}},{id:148,subject:"Biology",topic:"Acellular Agents (Prions)",questionText:"Bovine spongiform encephalopathy (BSE) or Mad Cow disease is caused by :-",options:["Prions","Viroids","Viruses","Bacteria"],correctAnswer:1,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q148)",text:"BSE (Mad cow disease) in cattle and its human analogue Cr-Jacob disease (CJD) are caused by Prions (abnormally folded infectious protein particles).",steps:["BSE and CJD are caused by Prions"]}},{id:149,subject:"Biology",topic:"Acellular Agents (Viroids Discovery)",questionText:"Viroids were discovered by :-",options:["D.J. Ivanowsky","M.W. Beijerinck","T.O. Diener","W.M. Stanley"],correctAnswer:3,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q149)",text:"Viroids were discovered in 1971 by T.O. Diener as a new infectious agent smaller than viruses that caused potato spindle tuber disease.",steps:["T.O. Diener discovered Viroids in 1971"]}},{id:150,subject:"Biology",topic:"Kingdom Plantae (Classification Systems)",questionText:"Natural system of classification for flowering plants was given by :-",options:["Carolus Linnaeus","George Bentham and Joseph Dalton Hooker","Engler and Prantl","Hutchinson"],correctAnswer:2,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q150)",text:"The natural system of classification for seed plants based on natural affinities, internal and external structural features was developed by George Bentham and Joseph Dalton Hooker in Genera Plantarum.",steps:["Bentham & Hooker proposed the Natural classification system"]}},{id:151,subject:"Biology",topic:"Plant Kingdom (Phycocolloids Algin & Carrageen)",questionText:"Hydrocolloids algin and carrageen are obtained from :-",options:["Brown algae and Green algae respectively","Green algae and Brown algae respectively","Red algae and Brown algae respectively","Brown algae and Red algae respectively"],correctAnswer:4,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q151)",text:"Algin (alginic acid) is a water-holding phycocolloid extracted from Brown algae (Phaeophyceae), while Carrageen is extracted from Red algae (Rhodophyceae, like Chondrus crispus).",steps:["Algin from Brown algae, Carrageen from Red algae"]}},{id:152,subject:"Biology",topic:"Plant Kingdom (Agar Commercial Source)",questionText:"Agar-agar is obtained from which algae ?",options:["Gelidium and Gracilaria","Laminaria and Fucus","Volvox and Chara","Spirogyra and Ulothrix"],correctAnswer:1,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q152)",text:"Agar, one of the commercial hydrocolloids used to grow microbes in culture media and in ice-creams and jellies, is obtained from red algae Gelidium and Gracilaria.",steps:["Agar is produced from Gelidium and Gracilaria (Red algae)"]}},{id:153,subject:"Biology",topic:"Plant Kingdom (Volvox Colony)",questionText:"Which of the following is a colonial green alga ?",options:["Chlamydomonas","Volvox","Ulothrix","Spirogyra"],correctAnswer:2,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q153)",text:"Volvox is a colonial green alga that forms a hollow spherical coenobium colony. Chlamydomonas is unicellular, while Ulothrix and Spirogyra are unbranched filamentous algae.",steps:["Volvox is a colonial green alga"]}},{id:154,subject:"Biology",topic:"Plant Kingdom (Stored Food in Phaeophyceae)",questionText:"In Phaeophyceae (Brown algae), the food is stored in the form of complex carbohydrates, which may be in the form of :-",options:["Laminarin or Mannitol","Floridean starch","Glycogen","Paramylum"],correctAnswer:1,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q154)",text:"In brown algae (Phaeophyceae), photosynthetic food is stored as complex carbohydrates in the form of Laminarin or Mannitol (sugar alcohol). (Floridean starch is stored in Rhodophyceae).",steps:["Brown algae store food as Laminarin or Mannitol"]}},{id:155,subject:"Biology",topic:"Plant Kingdom (Rhodophyceae Pigment)",questionText:"The major pigment responsible for the characteristic red colour of red algae is :-",options:["Chlorophyll a","Chlorophyll b","Fucoxanthin","r-phycoerythrin"],correctAnswer:4,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q155)",text:"Red algae (Rhodophyceae) owe their red color to the predominance of the red accessory pigment r-phycoerythrin in their body. Fucoxanthin gives brown color to Phaeophyceae.",steps:["r-phycoerythrin gives red algae their characteristic red appearance"]}},{id:156,subject:"Biology",topic:"Plant Kingdom (Bryophytes Habitat)",questionText:'Bryophytes are also called "amphibians of the plant kingdom" because :-',options:["They live only in water","They live on land but are dependent on water for sexual reproduction (fertilization)","They resemble amphibians in appearance","They have vascular tissues like amphibious animals"],correctAnswer:2,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q156)",text:"Bryophytes live in soil/land but require water for the swimming of flagellated antherozoids (male gametes) to the archegonium for fertilization. Thus they are known as amphibians of the plant kingdom.",steps:["Bryophytes require water for flagellated male gametes to fertilize eggs"]}},{id:157,subject:"Biology",topic:"Plant Kingdom (Sphagnum & Peat)",questionText:"Which moss provides peat that has long been used as fuel and packing material for trans-shipment of living material ?",options:["Sphagnum","Funaria","Polytrichum","Marchantia"],correctAnswer:1,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q157)",text:"Sphagnum (peat moss) produces peat that serves as fossil fuel. Due to its remarkable water-retention capacity, it is used as a packing material for trans-shipment of living seedlings.",steps:["Sphagnum provides peat and is used for packaging living material"]}},{id:158,subject:"Biology",topic:"Plant Kingdom (Pteridophytes First Vascular)",questionText:"First terrestrial plants to possess vascular tissues (xylem and phloem) are :-",options:["Bryophytes","Algae","Gymnosperms","Pteridophytes"],correctAnswer:4,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q158)",text:"Pteridophytes (ferns and horsetails) are the first terrestrial plants to evolve vascular tissues (xylem and phloem) for conduction of water and nutrients.",steps:["Pteridophytes are the first vascular land plants (Tracheophytes)"]}},{id:159,subject:"Biology",topic:"Plant Kingdom (Heterospory in Pteridophytes)",questionText:"Which of the following pteridophytes are heterosporous ?",options:["Selaginella and Salvinia","Dryopteris and Pteris","Lycopodium and Equisetum","Adiantum and Psilotum"],correctAnswer:1,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q159)",text:"While most pteridophytes are homosporous, Selaginella and Salvinia produce two distinct kinds of spores (microspores and megaspores) and are heterosporous, a vital step preceding the evolution of the seed habit.",steps:["Selaginella and Salvinia are heterosporous pteridophytes"]}},{id:160,subject:"Biology",topic:"Plant Kingdom (Gymnosperm Naked Seeds)",questionText:"In Gymnosperms, the seeds are naked because :-",options:["Ovules are not enclosed by any ovary wall before and after fertilization","Seeds have no seed coat","Fruits are absent due to lack of pollen tube","Cotyledons are absent"],correctAnswer:1,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q160)",text:"Gymnosperms (gymnos = naked, sperma = seed) have ovules that are directly exposed on megasporophylls and not enclosed within an ovary wall before or after fertilization; hence seeds remain naked (no fruit).",steps:["Ovules and seeds are not enclosed within an ovary wall"]}},{id:161,subject:"Biology",topic:"Plant Kingdom (Mycorrhiza & Coralloid Roots)",questionText:"Mycorrhizal roots and Coralloid roots are found respectively in :-",options:["Cycas and Pinus","Pinus and Cycas","Ginkgo and Ephedra","Cedrus and Sequoia"],correctAnswer:2,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q161)",text:"In Pinus, roots have symbiotic association with fungal hyphae (Mycorrhiza). In Cycas, specialized apogeotropic coralloid roots harbor nitrogen-fixing cyanobacteria (Anabaena cycadae/Nostoc).",steps:["Pinus has Mycorrhiza; Cycas has Coralloid roots"]}},{id:162,subject:"Biology",topic:"Plant Kingdom (Giant Redwood Sequoia)",questionText:"One of the tallest tree species Sequoia belongs to :-",options:["Gymnosperms","Pteridophytes","Angiosperms","Bryophytes"],correctAnswer:1,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q162)",text:"Sequoia sempervirens (the giant redwood tree) is one of the tallest living gymnosperm tree species in the plant kingdom.",steps:["Sequoia is a giant gymnosperm tree"]}},{id:163,subject:"Biology",topic:"Plant Kingdom (Prothallus in Pteridophytes)",questionText:"In pteridophytes, spores germinate to give rise to inconspicuous, small but multicellular, free-living, mostly photosynthetic thalloid gametophytes called :-",options:["Protonema","Prothallus","Strobili","Sporophyll"],correctAnswer:2,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q163)",text:"In pteridophytes, spores germinate to form a free-living, green, multicellular, photosynthetic heart-shaped gametophyte called a prothallus, which bears antheridia and archegonia.",steps:["The free-living gametophyte in pteridophytes is the Prothallus"]}},{id:164,subject:"Biology",topic:"Plant Kingdom (Moss Protonema Stage)",questionText:"The predominant stage of the life cycle of a moss is the gametophyte which consists of two stages. The first stage is :-",options:["Protonema stage","Leafy stage","Sporophyte","Prothallus"],correctAnswer:1,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q164)",text:"The moss gametophyte develops through two stages: the juvenile creeping, green, branched filamentous protonema stage (formed directly from spore germination) followed by the erect leafy stage.",steps:["First stage of moss gametophyte is the Protonema stage"]}},{id:165,subject:"Biology",topic:"Plant Kingdom (Algal Classification Table)",questionText:`Match column I with column II regarding algae :
Column I:
A. Chlorophyceae
B. Phaeophyceae
C. Rhodophyceae
Column II:
1. Chlorophyll a, c, fucoxanthin
2. Chlorophyll a, d, phycoerythrin
3. Chlorophyll a, b`,options:["A-1, B-2, C-3","A-2, B-1, C-3","A-3, B-1, C-2","A-3, B-2, C-1"],correctAnswer:3,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q165)",text:`A. Chlorophyceae (Green algae) \u2192 Chlorophyll a, b (3)
B. Phaeophyceae (Brown algae) \u2192 Chlorophyll a, c, fucoxanthin (1)
C. Rhodophyceae (Red algae) \u2192 Chlorophyll a, d, phycoerythrin (2)
Matching: A-3, B-1, C-2.`,steps:["Chlorophyceae = a,b","Phaeophyceae = a,c,fucoxanthin","Rhodophyceae = a,d,phycoerythrin"]}},{id:166,subject:"Biology",topic:"Plant Kingdom (Archegoniate Plant Groups)",questionText:"Archegonia (female sex organs) are present in which of the following groups ?",options:["Bryophytes only","Pteridophytes only","Gymnosperms and Angiosperms only","Bryophytes, Pteridophytes and Gymnosperms"],correctAnswer:4,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q166)",text:"Archegoniatae is a broad grouping that includes Bryophytes, Pteridophytes, and Gymnosperms, all of which bear flask-shaped female sex organs called archegonia. (Angiosperms have replaced archegonia with the embryo sac).",steps:["Archegonia are present in Bryophytes, Pteridophytes, and Gymnosperms"]}},{id:167,subject:"Biology",topic:"Plant Kingdom (Life Cycle Patterns)",questionText:"Haplontic life cycle is exhibited by :-",options:["Fucus","Ectocarpus","Polysiphonia","Volvox and Spirogyra"],correctAnswer:4,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q167)",text:"In Volvox, Spirogyra, and Chlamydomonas, the dominant phase is free-living haploid gametophyte; the diploid stage is represented only by the single-celled zygote (zygotic meiosis), which is a haplontic life cycle. (Fucus is diplontic; Ectocarpus/Polysiphonia are haplo-diplontic).",steps:["Volvox and Spirogyra exhibit haplontic life cycle"]}},{id:168,subject:"Biology",topic:"Plant Kingdom (Gemma Cups in Marchantia)",questionText:"Gemmae are asexual vegetative reproductive structures produced in gemma cups found in :-",options:["Funaria","Marchantia","Riccia","Sphagnum"],correctAnswer:2,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q168)",text:"Marchantia (a liverwort) bears small receptacles called gemma cups on the dorsal surface of the thallus, inside which green, multicellular asexual buds called gemmae develop.",steps:["Gemma cups are characteristic asexual structures of Marchantia"]}},{id:169,subject:"Biology",topic:"Plant Kingdom (Horsetails / Equisetum)",questionText:"Horsetails and ferns belong to :-",options:["Bryophytes","Pteridophytes","Gymnosperms","Thallophytes"],correctAnswer:2,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q169)",text:"Pteridophytes include horsetails (Sphenopsida, e.g. Equisetum) and ferns (Pteropsida, e.g. Dryopteris, Pteris, Adiantum).",steps:["Horsetails and ferns are Pteridophytes"]}},{id:170,subject:"Biology",topic:"Plant Kingdom (Gymnosperm Pollination)",questionText:"Pollination in Gymnosperms is exclusively :-",options:["Entomophilous (by insects)","Hydrophilous (by water)","Zoophilous (by animals)","Anemophilous (by wind)"],correctAnswer:4,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q170)",text:"In Gymnosperms, pollen grains are released from microsporangia and carried exclusively by air currents (wind pollination / anemophily) to come into direct contact with the micropyle of ovules.",steps:["Gymnosperms rely exclusively on wind pollination (Anemophily)"]}},{id:171,subject:"Biology",topic:"Plant Kingdom (Cycas Unbranched Stem)",questionText:"Unbranched stem is present in :-",options:["Cycas","Pinus","Cedrus","All of these"],correctAnswer:1,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q171)",text:"In Cycas, the aerial trunk is columnar and unbranched, marked with scars of fallen leaves. In Pinus and Cedrus, the stem is profusely branched.",steps:["Cycas has an unbranched stem; Pinus/Cedrus are branched"]}},{id:172,subject:"Biology",topic:"Plant Kingdom (Pteridophytes Sporophylls & Cones)",questionText:"In some pteridophytes, sporophylls may form distinct compact structures called strobili or cones, as in :-",options:["Dryopteris","Pteris","Adiantum","Selaginella and Equisetum"],correctAnswer:4,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q172)",text:"In Selaginella and Equisetum, sporophylls aggregate compactly at shoot apices to form distinct cones or strobili.",steps:["Selaginella and Equisetum produce distinct compact strobili/cones"]}},{id:173,subject:"Biology",topic:"Plant Kingdom (Dominant Phase in Bryophytes)",questionText:"The main plant body of the bryophyte is haploid and produces gametes, hence it is called a :-",options:["Sporophyte","Sporangium","Capsule","Gametophyte"],correctAnswer:4,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q173)",text:"The dominant, independent, photosynthetic stage in bryophytes is the haploid gametophyte, which produces sex organs and gametes.",steps:["The dominant haploid free-living plant body is the Gametophyte"]}},{id:174,subject:"Biology",topic:"Plant Kingdom (Liverworts vs Mosses)",questionText:"Marchantia and Riccia are members of :-",options:["Hepaticopsida (Liverworts)","Bryopsida (Mosses)","Pteropsida","Sphenopsida"],correctAnswer:1,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q174)",text:"Marchantia and Riccia are thalloid bryophytes belonging to the class Hepaticopsida (Liverworts). Funaria, Polytrichum, and Sphagnum belong to Bryopsida (Mosses).",steps:["Marchantia and Riccia are liverworts (Hepaticopsida)"]}},{id:175,subject:"Biology",topic:"Plant Kingdom (Female Sex Organ in Bryophytes)",questionText:"The female sex organ in bryophytes is flask-shaped and produces a single egg. It is called :-",options:["Archegonium","Antheridium","Oogonium","Carpogonium"],correctAnswer:1,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q175)",text:"The female sex organ in bryophytes is a multicellular, jacketed, flask-shaped structure called the Archegonium, which encloses a single non-motile egg in its swollen venter.",steps:["Flask-shaped female sex organ is the Archegonium"]}},{id:176,subject:"Biology",topic:"Plant Kingdom (Red Algae Non-motile Gametes)",questionText:"Non-motile gametes and non-motile spores are characteristic of :-",options:["Rhodophyceae (Red algae)","Chlorophyceae","Phaeophyceae","All algae"],correctAnswer:1,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q176)",text:"In Rhodophyceae (Red algae), flagellated / motile stages are completely absent in the entire life cycle. Asexual spores (non-motile) and gametes (non-motile spermatia and carpogonium) are non-flagellated.",steps:["Red algae completely lack motile/flagellated cells"]}},{id:177,subject:"Biology",topic:"Plant Kingdom (Kelp Giant Marine Algae)",questionText:"Kelps are massive marine forms belonging to :-",options:["Phaeophyceae (Brown algae)","Chlorophyceae","Rhodophyceae","Cyanophyceae"],correctAnswer:1,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q177)",text:"Kelps (e.g. Macrocystis) are giant brown algae (Phaeophyceae) that may reach heights of 100 meters in coastal marine environments.",steps:["Kelps are giant Brown algae (Phaeophyceae)"]}},{id:178,subject:"Biology",topic:"Plant Kingdom (Algal Cell Wall Composition)",questionText:"Algae usually have cell walls made of :-",options:["Cellulose, hemicellulose and pectin","Chitin and peptidoglycan","Cellulose, pectin and suberin","Cellulose, galactans, mannans and minerals like calcium carbonate"],correctAnswer:4,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q178)",text:"Algal cell walls are composed of cellulose, galactans, mannans, and minerals such as calcium carbonate, differing from terrestrial higher plants which contain cellulose, hemicellulose, pectins, and proteins.",steps:["Algal cell wall = cellulose, galactans, mannans, and calcium carbonate"]}},{id:179,subject:"Biology",topic:"Biological Classification (Kingdom System History)",questionText:"Two kingdom system of classification was proposed by Carolus Linnaeus. The two kingdoms were :-",options:["Prokaryota and Eukaryota","Plantae and Animalia","Monera and Protista","Autotrophs and Heterotrophs"],correctAnswer:2,solution:{reference:"Allen Test Series 0999DMD363104260001 (Q179)",text:"Carolus Linnaeus established the Two Kingdom Classification syste         currentQIndex++;

    function saveAndNext() {

    function prevQuestion() {
