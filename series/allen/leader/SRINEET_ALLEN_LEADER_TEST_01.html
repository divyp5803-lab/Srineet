<script>
const QUESTIONS = [{"id":1,"subject":"Physics","topic":"Vectors & Parallel Vectors","questionText":"If a⃗ = 2î + 6ĵ + mk̂ and b⃗ = nî + 12ĵ + 4k̂ are parallel to each other, then product of m and n is :-","options":["2","4","8","16"],"correctAnswer":3,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q1)","text":"For two vectors to be parallel, their corresponding components must be proportional:\n2/n = 6/12 = m/4\n6/12 = 1/2 ⇒ 2/n = 1/2 ⇒ n = 4\nm/4 = 1/2 ⇒ m = 2\nTherefore, product m × n = 2 × 4 = 8.","steps":["Condition for parallel vectors: a_x / b_x = a_y / b_y = a_z / b_z","2/n = 6/12 = m/4","n = 4 and m = 2","Product m × n = 2 × 4 = 8"]}},{"id":2,"subject":"Physics","topic":"Kinematics & Vector Subtraction","questionText":"A truck travelling due north at 20 m/s turns west and travels at the same speed. The change in its velocity be :-","options":["40 m/s N-W","20√2 m/s N-W","40 m/s S-W","20√2 m/s S-W"],"correctAnswer":4,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q2)","text":"Initial velocity v⃗_i = 20 ĵ (North)\nFinal velocity v⃗_f = -20 î (West)\nChange in velocity Δv⃗ = v⃗_f - v⃗_i = -20 î - 20 ĵ\nMagnitude |Δv⃗| = √((-20)² + (-20)²) = 20√2 m/s\nDirection: -î is West, -ĵ is South, so direction is South-West (S-W).","steps":["Initial velocity v⃗_i = 20 ĵ m/s","Final velocity v⃗_f = -20 î m/s","Change in velocity Δv⃗ = v⃗_f - v⃗_i = -20 î - 20 ĵ m/s","|Δv⃗| = √(20² + 20²) = 20√2 m/s towards South-West (S-W)"]}},{"id":3,"subject":"Physics","topic":"Calculus in Physics (Integration)","questionText":"∫ 2 sin(2x + 3) dx = ................. ?","options":["4 cos(2x + 3) + C","cos(2x + 3)/2 + C","– cos(2x + 3) + C","– cos(2x + 3)/4 + C"],"correctAnswer":3,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q3)","text":"Using standard integral formula: ∫ sin(ax + b) dx = - (1/a) cos(ax + b) + C\nHere, ∫ 2 sin(2x + 3) dx = 2 × [ - (1/2) cos(2x + 3) ] + C = - cos(2x + 3) + C.","steps":["∫ sin(ax + b) dx = - (1/a) cos(ax + b) + C","∫ 2 sin(2x + 3) dx = 2 × [-1/2 cos(2x + 3)] + C","= - cos(2x + 3) + C"]}},{"id":4,"subject":"Physics","topic":"Mathematical Tools (Trigonometry)","questionText":"cos(α + β) – cos(α – β) is equal to–","options":["2 cosα cosβ","–2 cosα cosβ","2 sinα sinβ","–2 sinα sinβ"],"correctAnswer":4,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q4)","text":"cos(α + β) = cosα cosβ - sinα sinβ\ncos(α - β) = cosα cosβ + sinα sinβ\ncos(α + β) - cos(α - β) = (cosα cosβ - sinα sinβ) - (cosα cosβ + sinα sinβ) = - 2 sinα sinβ.","steps":["cos(α + β) = cosα cosβ - sinα sinβ","cos(α - β) = cosα cosβ + sinα sinβ","Subtracting gives: - 2 sinα sinβ"]}},{"id":5,"subject":"Physics","topic":"Vectors Addition & Resultant","questionText":"Vector A⃗ is 2cm long and is 60° above the x–axis in the first quadrant. Vector B⃗ is 2cm long and is 60° below the x–axis in the fourth quadrant. The sum A⃗ + B⃗ is a vector of magnitude","options":["2 cm along + y–axis","2cm along +x–axis","2 cm along –y– axis","2 cm along – x– axis"],"correctAnswer":2,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q5)","text":"A⃗ = 2 cos 60° î + 2 sin 60° ĵ = 1 î + √3 ĵ\nB⃗ = 2 cos 60° î - 2 sin 60° ĵ = 1 î - √3 ĵ\nA⃗ + B⃗ = (1 + 1) î + (√3 - √3) ĵ = 2 î cm.\nThus, resultant has magnitude 2 cm along the +x-axis.","steps":["A⃗ = 2 cos 60° î + 2 sin 60° ĵ = î + √3 ĵ","B⃗ = 2 cos 60° î - 2 sin 60° ĵ = î - √3 ĵ","A⃗ + B⃗ = 2 î cm (magnitude 2 cm along +x axis)"]}},{"id":6,"subject":"Physics","topic":"Kinematics (Differentiation)","questionText":"If velocity of particle varies with time as v = (t + 2)(t + 3), then its acceleration at t = 1s is :-","options":["5 m/s²","7 m/s²","2 m/s²","3 m/s²"],"correctAnswer":2,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q6)","text":"v = (t + 2)(t + 3) = t² + 5t + 6\nAcceleration a = dv/dt = d/dt(t² + 5t + 6) = 2t + 5\nAt t = 1 s: a = 2(1) + 5 = 7 m/s².","steps":["v = t² + 5t + 6","a = dv/dt = 2t + 5","At t = 1 s, a = 2(1) + 5 = 7 m/s²"]}},{"id":7,"subject":"Physics","topic":"Mathematical Tools (Quadratic Equations)","questionText":"The roots of 10x² – 27x + 5 = 0 are :-","options":["2/5, 1/5","2/5, 5","5/2, 1/5","2, 5/2"],"correctAnswer":3,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q7)","text":"10x² - 27x + 5 = 0\n10x² - 25x - 2x + 5 = 0\n5x(2x - 5) - 1(2x - 5) = 0\n(5x - 1)(2x - 5) = 0\nRoots: x = 1/5 and x = 5/2.","steps":["Discriminant D = (-27)² - 4(10)(5) = 729 - 200 = 529 = 23²","x = (27 ± 23) / 20","x₁ = 50/20 = 5/2, x₂ = 4/20 = 1/5"]}},{"id":8,"subject":"Physics","topic":"Vectors (Triangle Inequality of Forces)","questionText":"Which of the following group of forces can't produce zero resultant :","options":["10, 10, 10","10, 10, 20","10, 20, 20","10, 20, 40"],"correctAnswer":4,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q8)","text":"For three forces to produce a zero resultant, the sum of any two forces must be greater than or equal to the third force (Triangle inequality: |A - B| ≤ C ≤ A + B).\nFor (10, 20, 40): 10 + 20 = 30 < 40, so they cannot form a closed triangle or produce zero resultant.","steps":["Condition for zero resultant of 3 forces: sum of smaller two ≥ largest","For 10, 20, 40: 10 + 20 = 30 < 40","Hence 10, 20, 40 cannot produce zero resultant"]}},{"id":9,"subject":"Physics","topic":"Maxima and Minima","questionText":"If y = 2x² – 2x then find out minimum value of y:","options":["1/2","–1/2","3/2","–3/2"],"correctAnswer":2,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q9)","text":"y = 2x² - 2x\ndy/dx = 4x - 2 = 0 ⇒ x = 1/2\nd²y/dx² = 4 > 0 (Minima)\nMinimum value y_min = 2(1/2)² - 2(1/2) = 2(1/4) - 1 = 1/2 - 1 = -1/2.","steps":["dy/dx = 4x - 2 = 0 ⇒ x = 1/2","d²y/dx² = 4 > 0 (confirms minimum)","y_min = 2(1/2)² - 2(1/2) = 1/2 - 1 = -1/2"]}},{"id":10,"subject":"Physics","topic":"Vectors (Cross Product vs Dot Product)","questionText":"Assertion : If angle between two vectors A⃗ and B⃗ is 45° then A⃗ × B⃗ = A⃗ · B⃗.\nReason : At θ = 45°, sin θ = cos θ\nChoose correct alternative : -","options":["Both are correct and reason is correct explanation for assertion.","Both are correct and reason is not correct explanation for assertion.","Assertion is wrong, reason is correct.","Assertion is correct, reason is wrong."],"correctAnswer":3,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q10)","text":"A⃗ × B⃗ is a vector quantity (|A||B| sin θ n̂), whereas A⃗ · B⃗ is a scalar quantity (|A||B| cos θ). A vector cannot be equated to a scalar without magnitude notation (|A⃗ × B⃗| = A⃗ · B⃗). Thus Assertion is wrong, while Reason (sin 45° = cos 45°) is mathematically correct.","steps":["A⃗ × B⃗ is a vector, A⃗ · B⃗ is a scalar","Vector ≠ Scalar, so Assertion is false","At θ = 45°, sin 45° = cos 45° = 1/√2, so Reason is true"]}},{"id":11,"subject":"Physics","topic":"Resolution of Vectors (Rotated Axes)","questionText":"A vector of magnitude 5m is placed in a coordinate system as shown in the figure. An auxiliary set of axes (x' and y') is formed by rotating the original axes clockwise by 16°. Find the components of the vector along the new x' and y' axes.","diagramKey":"physics_q11","options":["(4,3)","(3,4)","(3/5, 4/5)","(4,5)"],"correctAnswer":2,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q11)","text":"The vector is at an angle of 37° above the positive x-axis. The new x'-axis is formed by rotating the x-axis clockwise by 16° (i.e. 16° below the x-axis).\nTotal angle of the vector with the new x'-axis θ' = 37° + 16° = 53°.\nComponents along x' and y':\nx' component = 5 cos 53° = 5 × (3/5) = 3 m\ny' component = 5 sin 53° = 5 × (4/5) = 4 m\nSo components are (3, 4).","steps":["Angle with original x-axis = 37°","Rotation of new x' axis clockwise = 16°","Total angle with x' axis θ' = 37° + 16° = 53°","x' = 5 cos 53° = 3 m, y' = 5 sin 53° = 4 m ⇒ (3, 4)"]}},{"id":12,"subject":"Physics","topic":"Vector Projection","questionText":"Find the projection of î + 2ĵ on 2î + 3ĵ in vector form","options":["(8/√5)(î + 2ĵ)","(8/13)(2î + 3ĵ)","(6/√13)(2î + 3ĵ)","(6/√5)(î + 2ĵ)"],"correctAnswer":2,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q12)","text":"Let A⃗ = î + 2ĵ and B⃗ = 2î + 3ĵ.\nVector projection of A⃗ on B⃗ = [(A⃗ · B⃗) / |B⃗|²] B⃗\nA⃗ · B⃗ = (1)(2) + (2)(3) = 2 + 6 = 8\n|B⃗|² = 2² + 3² = 4 + 9 = 13\nVector projection = (8/13)(2î + 3ĵ).","steps":["Projection vector = [(A⃗ · B⃗) / |B⃗|²] B⃗","A⃗ · B⃗ = 1(2) + 2(3) = 8","|B⃗|² = 2² + 3² = 13","Projection = (8/13)(2î + 3ĵ)"]}},{"id":13,"subject":"Physics","topic":"Properties of Vectors","questionText":"Let A⃗, B⃗, C⃗ be three non-zero vectors. Consider the following statements:\n(a) The sum of two vectors does not depend on their order.\n(b) The subtraction of two vectors can be written by reversing the order with a negative sign.\n(c) If the dot product of two vectors is zero, that one of the vectors must be a zero vector.\n(d) The cross product of two vectors changes sign when the order of vectors is reversed.\nChoose the correct option:","options":["only a, b, d are correct","only a, c, d are correct","only a, b are correct","all are correct"],"correctAnswer":1,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q13)","text":"(a) A⃗ + B⃗ = B⃗ + A⃗ (Commutative) → True\n(b) A⃗ - B⃗ = -(B⃗ - A⃗) → True\n(c) A⃗ · B⃗ = 0 means vectors can be perpendicular to each other; neither needs to be zero → False\n(d) A⃗ × B⃗ = -(B⃗ × A⃗) (Anti-commutative) → True\nThus, statements a, b, d are correct.","steps":["Vector addition is commutative: a is true","Vector subtraction anti-symmetry: b is true","Dot product zero only implies orthogonal non-zero vectors: c is false","Cross product is anti-commutative: d is true"]}},{"id":14,"subject":"Physics","topic":"Vernier Callipers & Zero Error","questionText":"The main scale of a vernier callipers reads 10 mm in 10 divisions. 10 divisions of Vernier scale coincide with 9 divisions of the main scale. When the two jaws of the callipers touch each other, the fifth division of the vernier coincides with 9 main scale divisions and the zero of the vernier is to the right of zero of main scale. When a cylinder is tightly placed between the two jaws, the zero of vernier scale lies slightly behind 3.2 cm and the fourth vernier division coincides with a main scale division. The diameter of the cylinder is.","options":["3.10 cm","3.8 cm","3.09 cm","–3.09 cm"],"correctAnswer":3,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q14)","text":"1 MSD = 10 mm / 10 = 1 mm = 0.1 cm.\n10 VSD = 9 MSD ⇒ 1 VSD = 0.9 mm.\nLeast Count (LC) = 1 MSD - 1 VSD = 0.1 mm = 0.01 cm.\nZero of Vernier is to the right of zero of main scale ⇒ Positive Zero Error (+ZE) = +5 × LC = +0.5 mm = +0.05 cm.\nWhen cylinder is measured: Zero of vernier lies slightly behind 3.2 cm ⇒ Main Scale Reading (MSR) = 3.1 cm.\nVernier Scale Reading (VSR) = 4 × LC = 4 × 0.01 cm = 0.04 cm.\nObserved Reading = 3.1 + 0.04 = 3.14 cm.\nCorrect Reading = Observed Reading - ZE = 3.14 cm - 0.05 cm = 3.09 cm.","steps":["LC = 1 MSD - 1 VSD = 1 mm - 0.9 mm = 0.1 mm = 0.01 cm","Positive Zero Error (+ZE) = +5 × 0.01 cm = +0.05 cm","MSR = 3.1 cm, VSR = 4 × 0.01 cm = 0.04 cm","True Reading = (3.1 + 0.04) - 0.05 = 3.09 cm"]}},{"id":15,"subject":"Physics","topic":"Units & Dimensions (Dimensional Analysis)","questionText":"If the time of oscillation (T) of a gas bubble from an explosion under water depends on static pressure (P), density of water (d) and total energy of explosion (E), find the relation between them : -","options":["T ∝ P^(–5/6) d^(1/2) E^(1/3)","T ∝ P^(1/2) d^(1/3) E^(1/2)","T ∝ P^(–5/6) d^(1/3) E^(1/2)","T ∝ P^(–2/3) d^(1/2) E^(1/3)"],"correctAnswer":1,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q15)","text":"T ∝ P^a d^b E^c\n[T] = [M L⁻¹ T⁻²]^a [M L⁻³]^b [M L² T⁻²]^c\nEquating powers of M, L, T:\nM: a + b + c = 0\nL: -a - 3b + 2c = 0\nT: -2a - 2c = 1 ⇒ a + c = -1/2\nFrom M: b = -(a + c) = 1/2\nFrom L: -a - 3(1/2) + 2c = 0 ⇒ -a + 2c = 3/2\nSolving: 3c = 1 ⇒ c = 1/3\na = -1/2 - 1/3 = -5/6\nHence, T ∝ P^(–5/6) d^(1/2) E^(1/3).","steps":["[T] = [M L⁻¹ T⁻²]^a [M L⁻³]^b [M L² T⁻²]^c","a + b + c = 0, -a - 3b + 2c = 0, -2a - 2c = 1","b = 1/2, c = 1/3, a = -5/6","T ∝ P^(–5/6) d^(1/2) E^(1/3)"]}},{"id":16,"subject":"Physics","topic":"Screw Gauge & Negative Zero Error","questionText":"In an experiment to find out the diameter of wire using screw gauge, the following observations were noted :\n(a) Screw moves 0.5 mm on main scale in one complete rotation\n(b) Total divisions on circular scale = 50\n(c) Main scale reading is 2.5 mm\n(d) 45th division of circular scale is in the pitch line\n(e) Instrument has 0.03 mm negative error\nThen the diameter of wire is :","diagramKey":"physics_q16","options":["2.92 mm","2.54 mm","2.98 mm","3.45 mm"],"correctAnswer":3,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q16)","text":"Pitch = 0.5 mm\nLeast Count (LC) = Pitch / Total CSD = 0.5 mm / 50 = 0.01 mm\nObserved Reading = MSR + (CSR × LC) = 2.5 mm + (45 × 0.01 mm) = 2.5 + 0.45 = 2.95 mm\nCorrect Reading = Observed Reading - (Zero Error)\n= 2.95 mm - (-0.03 mm) = 2.95 + 0.03 = 2.98 mm.","steps":["LC = 0.5 mm / 50 = 0.01 mm","Observed = 2.5 mm + (45 × 0.01 mm) = 2.95 mm","True Reading = 2.95 - (-0.03) = 2.98 mm"]}},{"id":17,"subject":"Physics","topic":"Dimensional Correctness (Stokes Law / Terminal Velocity)","questionText":"Which of the following relation is dimensionally correct for the terminal velocity (V) of a rain drop? (where r is radius, g is acceleration due to gravity, ρ is density of drop, σ is density of air and η is viscosity) : -","options":["V = (2/9) [r² g (ρ - σ) / η]","V = (2/9) [r g (ρ - σ) / η]","V = (2/9) [r² η (ρ - σ) / g]","V = (2/9) [η g / (r² (ρ - σ))]"],"correctAnswer":1,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q17)","text":"Terminal velocity formula from Stokes law is V = (2/9) [r² g (ρ - σ) / η].\nDimensionally: [r² g (ρ - σ) / η] = [L²][L T⁻²][M L⁻³] / [M L⁻¹ T⁻¹] = [M L⁰ T⁻²] / [M L⁻¹ T⁻¹] = [L T⁻¹], which matches the dimension of velocity.","steps":["LHS: [V] = [L T⁻¹]","RHS: [r² g (ρ - σ) / η] = [L²][L T⁻²][M L⁻³] / [M L⁻¹ T⁻¹] = [L T⁻¹]","Option (1) is dimensionally correct"]}},{"id":18,"subject":"Physics","topic":"Units & Measurements (Light Year & Parsec)","questionText":"Assertion : Light year and parallactic second used to measure time.\nReason : Both light year and parallactic second have the dimensions of length (L).\nChoose the correct option:","options":["Both A & R are true, R is correct explaination of A.","Both A & R are true, R is not correct explaination of A.","A is true but R is false.","A is false but R is true."],"correctAnswer":4,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q18)","text":"Light year (distance travelled by light in vacuum in 1 year = 9.46 × 10¹⁵ m) and Parallactic second (parsec = 3.08 × 10¹⁶ m) are both units of astronomical distance/length, not time. Thus, Assertion is false and Reason is true.","steps":["Light year and parsec measure astronomical distance (length)","Assertion: says they measure time → False","Reason: both have dimension of length [L] → True"]}},{"id":19,"subject":"Physics","topic":"Errors & Propagation","questionText":"The mass and volume of a body are found to be (5.00 ± 0.05) kg and (1.00 ± 0.05) m³ respectively. Then the maximum possible percentage error in density :-","options":["3%","10%","6%","5%"],"correctAnswer":3,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q19)","text":"Density ρ = m / V\n(Δρ / ρ) × 100% = [(Δm / m) + (ΔV / V)] × 100%\n= (0.05 / 5.00) × 100% + (0.05 / 1.00) × 100%\n= 1% + 5% = 6%.","steps":["Δρ/ρ = Δm/m + ΔV/V","Δm/m × 100% = 0.05 / 5.00 × 100 = 1%","ΔV/V × 100% = 0.05 / 1.00 × 100 = 5%","Total % error = 1% + 5% = 6%"]}},{"id":20,"subject":"Physics","topic":"Principle of Homogeneity & Dimensions","questionText":"In each of the following expression A, B and C represent lengths :-\nI. A + B\nII. AB\nIII. AB / C\nIV. A / (B + C)\nWhich of the following statements is incorrect ?","options":["One of them has dimensions of volume","One of them has dimensions of area","Two of them have dimensions of length","One of them is dimensionless"],"correctAnswer":1,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q20)","text":"I. [A + B] = [L] (Length)\nII. [AB] = [L][L] = [L²] (Area)\nIII. [AB / C] = [L²] / [L] = [L] (Length)\nIV. [A / (B + C)] = [L] / [L] = [M⁰ L⁰ T⁰] (Dimensionless)\nNone of the expressions has dimensions of volume [L³]. Hence statement (1) is incorrect.","steps":["I: [A+B] = L","II: [AB] = L² (Area)","III: [AB/C] = L (Length)","IV: [A/(B+C)] = L/L = 1 (Dimensionless)","Statement (1) claiming one has volume dimension is incorrect"]}},{"id":21,"subject":"Physics","topic":"Dimensional Analysis (Frequency of Spring)","questionText":"The frequency of vibration ƒ of a mass m suspended from a spring of spring constant k is given by a relation of this type ƒ = c m^x k^y; where c is dimensionless quantity. The values of x and y are :-","options":["x = 1/2, y = 1/2","x = -1/2, y = -1/2","x = 1/2, y = -1/2","x = -1/2, y = 1/2"],"correctAnswer":4,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q21)","text":"[f] = [T⁻¹] = [M⁰ L⁰ T⁻¹]\n[m] = [M]\n[k] = [Force/displacement] = [M T⁻²]\n[T⁻¹] = [M]^x [M T⁻²]^y = [M^(x+y) T^(-2y)]\nEquating powers:\nx + y = 0 ⇒ x = -y\n-2y = -1 ⇒ y = 1/2\nThus, x = -1/2 and y = 1/2.","steps":["[f] = [M⁰ L⁰ T⁻¹], [m] = [M], [k] = [M T⁻²]","M^(x+y) T^(-2y) = M⁰ T⁻¹","-2y = -1 ⇒ y = 1/2","x + y = 0 ⇒ x = -1/2"]}},{"id":22,"subject":"Physics","topic":"Conversion of Units (Dimensions of Power)","questionText":"In a certain system of units, 1 unit of time is 5 sec, 1 unit of mass is 20 kg and unit of length is 10m. In this system, one unit of power will correspond to","options":["16 watts","1/16 watts","25 watts","none of these"],"correctAnswer":1,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q22)","text":"Dimension of Power [P] = [M L² T⁻³]\n1 Unit of Power = (1 unit of mass) × (1 unit of length)² × (1 unit of time)⁻³\n= (20 kg) × (10 m)² × (5 s)⁻³\n= 20 × 100 / 125 = 2000 / 125 = 16 W (watts).","steps":["[P] = [M L² T⁻³]","n₂ / n₁ = [M₁/M₂]¹ [L₁/L₂]² [T₁/T₂]⁻³","1 new unit = 20 × (10)² / (5)³ = 2000 / 125 = 16 Watts"]}},{"id":23,"subject":"Physics","topic":"Dimensional Formula Match","questionText":"Match the physical quantities given in column I with dimensions in column II :-\nColumn I:\na. Torque\nb. Angular momentum\nc. Latent heat\nd. Surface tension\ne. Light year\nColumn II:\nP. [M L² T⁻¹]\nq. [M⁰ L² T⁻²]\nr. [M⁰ L⁰ T¹]\ns. [M⁰ L¹ T⁰]\nt. [M L² T⁻²]\nu. [M L⁰ T⁻²]","options":["a – t, b – p, c – q, d – u, e – s","a – q, b – r, c – p, d – t, e – s","a – q, b – p, c – t, d – r, e – s","a – t, b – s, c – q, d – p, e – r"],"correctAnswer":1,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q23)","text":"a. Torque = [M L² T⁻²] (t)\nb. Angular momentum = [M L² T⁻¹] (p)\nc. Latent heat = Q/m = [L² T⁻²] = [M⁰ L² T⁻²] (q)\nd. Surface tension = F/L = [M T⁻²] = [M L⁰ T⁻²] (u)\ne. Light year = Distance = [L] = [M⁰ L¹ T⁰] (s)\nMatching: a-t, b-p, c-q, d-u, e-s.","steps":["Torque = [M L² T⁻²] → t","Angular momentum = [M L² T⁻¹] → p","Latent heat = [M⁰ L² T⁻²] → q","Surface tension = [M L⁰ T⁻²] → u","Light year = [M⁰ L¹ T⁰] → s"]}},{"id":24,"subject":"Physics","topic":"Error Propagation in Formulas","questionText":"For Z = a² x³ y^(1/2), where ‘a’ is a constant. If percentage error in measurement of ‘x’ and ‘y’ are 4% and 12%, respectively, then the percentage error for ‘z’ will be %.","options":["14%","18%","20%","22%"],"correctAnswer":2,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q24)","text":"Z = a² x³ y^(1/2), where a is constant (Δa = 0).\n(ΔZ / Z) × 100 = 3 (Δx / x × 100) + (1/2) (Δy / y × 100)\n= 3(4%) + (1/2)(12%) = 12% + 6% = 18%.","steps":["ΔZ/Z = 3(Δx/x) + (1/2)(Δy/y)","= 3(4%) + (1/2)(12%)","= 12% + 6% = 18%"]}},{"id":25,"subject":"Physics","topic":"Significant Figures","questionText":"Assertion (A) : - The number of significant figures in 0.005 is one, while in 0.500 it is three.\nReason (R) : - Zeros to the left of the first non-zero digit are not significant, but trailing zeros in a number with a decimal points are significant.\nChoose correct option:","options":["A & R are correct & R is correct explanation of A.","A & R are correct but R is not correct explanation of A.","A is correct but R is not correct.","A is not correct but R is correct."],"correctAnswer":1,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q25)","text":"In 0.005, leading zeros are not significant, so it has 1 significant figure.\nIn 0.500, trailing zeros after decimal point are significant, so it has 3 significant figures.\nReason correctly states both rules. Therefore, both A & R are correct and R is the correct explanation of A.","steps":["0.005: leading zeros are placeholders → 1 SF","0.500: trailing zeros after decimal indicate precision → 3 SF","Reason states the exact rule that explains Assertion"]}},{"id":26,"subject":"Physics","topic":"Electrostatics (Equilibrium of Charges)","questionText":"Two charge particles are shown in the diagram. Where should a third charge particle q₀ be placed so q₀ will be in equilibrium :-","diagramKey":"physics_q26","options":["x = 10 a","x = 8 a","x = 11 a","x = 12 a"],"correctAnswer":1,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q26)","text":"Charges are +16q at x₁ = 2a and +25q at x₂ = 20a.\nSeparation distance d = 20a - 2a = 18a.\nFor equilibrium of third charge q₀ placed at distance r from +16q:\nk(16q)q₀ / r² = k(25q)q₀ / (18a - r)²\nTaking square root on both sides:\n4 / r = 5 / (18a - r)\n72a - 4r = 5r ⇒ 9r = 72a ⇒ r = 8a.\nPosition of q₀ on x-axis: x = 2a + r = 2a + 8a = 10a.","steps":["Separation d = 20a - 2a = 18a","k(16q)/r² = k(25q)/(18a - r)²","4/r = 5/(18a - r) ⇒ 9r = 72a ⇒ r = 8a from +16q","x = 2a + 8a = 10a"]}},{"id":27,"subject":"Physics","topic":"Electrostatics (Suspended Pith Balls)","questionText":"Two pith balls each with mass m are suspended from insulating threads. When the pith balls are given equal positive charge Q, they hang in equilibrium as shown. We now increase the charge on the left pith ball from Q to 2Q while leaving its mass essentially unchanged. Which of the following diagrams best represents the new equilibrium configuration?","diagramKey":"physics_q27","options":["Left angle remains θ, right angle increases","Left angle > right angle","Right angle > left angle","Both threads deflect by equal angle θ' > θ"],"correctAnswer":4,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q27)","text":"According to Newton’s third law, the electrostatic repulsive force on both pith balls is identical in magnitude (F_e = k(2Q)(Q)/r²).\nSince both balls have the same mass m, tan θ = F_e / (mg) is the same for both threads.\nAs the charge is increased, F_e increases, so both threads make an equal, increased angle θ' > θ with the vertical.","steps":["Electrostatic force on both balls is equal in magnitude (Action-Reaction)","Both balls have equal mass m, so tan θ₁ = F_e / mg = tan θ₂","Both angles remain equal to each other (θ₁ = θ₂ = θ' > θ)"]}},{"id":28,"subject":"Physics","topic":"Coulomb's Law in Vector Form","questionText":"A charge particle q₁ is at position (2, –1, 3). The electrostatic force on another charged particle q₂ at (0, 0, 0) is :","options":["[q₁q₂ / (56πε₀)] (2î – ĵ + 3k̂)","[q₁q₂ / (56√14πε₀)] (2î – ĵ + 3k̂)","[q₁q₂ / (56πε₀)] (ĵ – 2î – 3k̂)","[q₁q₂ / (56√14πε₀)] (–2î + ĵ – 3k̂)"],"correctAnswer":4,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q28)","text":"Position vector of q₁: r⃗₁ = 2î - ĵ + 3k̂\nPosition vector of q₂: r⃗₂ = 0î + 0ĵ + 0k̂\nVector from q₁ to q₂: r⃗ = r⃗₂ - r⃗₁ = -2î + ĵ - 3k̂\nDistance r = √((-2)² + 1² + (-3)²) = √(4 + 1 + 9) = √14\nForce F⃗₂₁ = [1 / (4πε₀)] [q₁q₂ / r³] r⃗\n= [1 / (4πε₀)] [q₁q₂ / (14√14)] (-2î + ĵ - 3k̂)\n= [q₁q₂ / (56√14πε₀)] (-2î + ĵ - 3k̂).","steps":["Displacement vector r⃗ = r⃗₂ - r⃗₁ = -2î + ĵ - 3k̂","Magnitude r = √14, r³ = 14√14","F⃗₂₁ = [1 / (4πε₀)] [q₁q₂ / r³] r⃗","= [q₁q₂ / (56√14πε₀)] (-2î + ĵ - 3k̂)"]}},{"id":29,"subject":"Physics","topic":"Electrostatic Potential Energy of System","questionText":"Two negative charge, each of magnitude q are situated at 2r distance apart. A positive charge q is lying at the centre between them. The potential energy of the system is U₁. If the two nearest charges are mutually interchanged and the potential energy becomes U₂, then U₁/U₂ will be :-","options":["3","5","2","1"],"correctAnswer":1,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q29)","text":"Initial configuration: -q at x=0, +q at x=r, -q at x=2r.\nU₁ = U(-q, +q) + U(+q, -q) + U(-q, -q)\n= -kq²/r - kq²/r + k(-q)(-q)/(2r) = -2kq²/r + kq²/(2r) = -3kq²/(2r).\nAfter swapping the left negative charge and middle positive charge (+q at x=0, -q at x=r, -q at x=2r):\nU₂ = U(+q, -q) + U(-q, -q) + U(+q, -q)\n= -kq²/r + kq²/r - kq²/(2r) = -kq²/(2r).\nRatio U₁ / U₂ = (-3kq²/(2r)) / (-kq²/(2r)) = 3.","steps":["U₁ = -kq²/r - kq²/r + kq²/(2r) = -3kq²/(2r)","U₂ = -kq²/r + kq²/r - kq²/(2r) = -kq²/(2r)","U₁ / U₂ = (-3/2) / (-1/2) = 3"]}},{"id":30,"subject":"Physics","topic":"Electric Field of Continuous Charge Distributions","questionText":"In the figure shown, find the ratio of the linear charge densities λ₁ (on semi-infinite straight wire) and λ₂ (on semi-circular part) that is λ₁/λ₂ so that the field at O is along y direction.","diagramKey":"physics_q30","options":["2","1.5","3","2.5"],"correctAnswer":1,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q30)","text":"For the semi-infinite straight wire extending along the +x axis at distance R below O:\nElectric field components at O: E_x = kλ₁/R (towards -x) and E_y = kλ₁/R (towards +y).\nFor the semi-circular arc of radius R:\nElectric field is purely along the x-axis: E_x' = 2kλ₂/R (towards +x).\nFor net electric field at O to be purely along y-direction, x-components must cancel:\nkλ₁/R = 2kλ₂/R ⇒ λ₁ = 2λ₂ ⇒ λ₁/λ₂ = 2.","steps":["E_x (wire) = kλ₁ / R (leftward)","E_x (semi-circle) = 2kλ₂ / R (rightward)","For net field along y-axis: kλ₁ / R = 2kλ₂ / R ⇒ λ₁/λ₂ = 2"]}},{"id":31,"subject":"Physics","topic":"Electric Field Lines","questionText":"Three positive charges of equal value q are placed at vertices of an equilateral triangle. The resulting lines of force should be sketched as in :-","diagramKey":"physics_q31","options":["Symmetrical outward curves bending away from the centre with a central neutral point","Lines connecting the charges directly","Circular concentric closed loops around the triangle","Triangular closed loops"],"correctAnswer":1,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q31)","text":"Field lines from identical positive charges originate radially outward and repel each other. They bend away from the central region forming a neutral point at the centroid where electric field is zero. They never form closed loops or connect positive charges to positive charges.","steps":["Field lines emerge from positive charges and never form closed loops","Mutual repulsion causes lines to bend away from the centroid","Sketch (1) correctly shows 3-fold symmetry with a central neutral point"]}},{"id":32,"subject":"Physics","topic":"Quantization of Charge & Conduction","questionText":"Two identical spheres carrying charges –9µC and 5µC respectively are kept in contact and then separated from each other. Point out true statement from the following. On each sphere (after contact) :-","options":["1.25 × 10¹³ electrons are in deficit","1.25 × 10¹³ electrons are in excess","2.15 × 10¹³ electrons are in excess","2.15 × 10¹³ electrons are in deficit"],"correctAnswer":2,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q32)","text":"Total charge Q_total = -9 µC + 5 µC = -4 µC.\nSince spheres are identical, charge on each sphere after contact q = Q_total / 2 = -2 µC.\nSince the charge is negative, there is an excess of electrons.\nNumber of excess electrons n = q / e = (2 × 10⁻⁶ C) / (1.6 × 10⁻¹⁹ C) = 1.25 × 10¹³ electrons in excess.","steps":["q = (-9 + 5) / 2 = -2 µC on each sphere","Negative charge means excess of electrons","n = 2 × 10⁻⁶ / (1.6 × 10⁻¹⁹) = 1.25 × 10¹³ electrons in excess"]}},{"id":33,"subject":"Physics","topic":"Potential of Uniformly Charged Solid Sphere","questionText":"A point charge (+q) of mass m is released from a distance R/2 from the centre of a solid sphere of radius R and charge Q (uniformly charged in volume). The speed of the point charge when it reaches a distance R from the surface of the sphere (there is no interaction between sphere and point charge other than electrostatic). k = 1/(4πε₀)","diagramKey":"physics_q33","options":["√(7kQq / (16mR))","√(7kQq / (4mR))","√(5kQq / (16mR))","√(3kQq / (4mR))"],"correctAnswer":2,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q33)","text":"Potential inside solid sphere at r = R/2:\nV_i = [kQ / (2R³)] [3R² - (R/2)²] = [kQ / (2R³)] [11R²/4] = 11kQ / (8R).\nPotential outside sphere at distance 2R from centre (distance R from surface):\nV_f = kQ / (2R) = 4kQ / (8R).\nPotential difference ΔV = V_i - V_f = (11 - 4)kQ / (8R) = 7kQ / (8R).\nConservation of energy: (1/2)mv² = q ΔV = 7kQq / (8R) ⇒ v = √(7kQq / (4mR)).","steps":["V_inside(r = R/2) = kQ/(2R³) [3R² - (R/2)²] = 11kQ / (8R)","V_outside(r = 2R) = kQ / (2R)","Work done = q(V_i - V_f) = 7kQq / (8R)","(1/2)mv² = 7kQq / (8R) ⇒ v = √(7kQq / (4mR))"]}},{"id":34,"subject":"Physics","topic":"Electric Field as Negative Gradient of Potential","questionText":"Electric potential at a point is: V = x²y + yz. The electric field at the point (1, 3, 1) is","options":["7 units","70 units","49 units","490 units"],"correctAnswer":1,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q34)","text":"E⃗ = - [ (∂V/∂x) î + (∂V/∂y) ĵ + (∂V/∂z) k̂ ]\n∂V/∂x = 2xy ⇒ at (1,3,1) = 2(1)(3) = 6 ⇒ E_x = -6\n∂V/∂y = x² + z ⇒ at (1,3,1) = 1² + 1 = 2 ⇒ E_y = -2\n∂V/∂z = y ⇒ at (1,3,1) = 3 ⇒ E_z = -3\nMagnitude |E⃗| = √((-6)² + (-2)² + (-3)²) = √(36 + 4 + 9) = √49 = 7 units.","steps":["E_x = -∂V/∂x = -2xy = -6","E_y = -∂V/∂y = -(x² + z) = -2","E_z = -∂V/∂z = -y = -3","|E⃗| = √(36 + 4 + 9) = √49 = 7 units"]}},{"id":35,"subject":"Physics","topic":"Work Done in Rotating Dipole","questionText":"An electric dipole of moment P⃗ is kept in a uniform electric field E⃗. Angle between P⃗ and E⃗ is 30°. Calculate work done by field when angle is increased to 60°.","options":["(pE/2)(√3 – 1)","(pE/2)(1 – √3)","(pE)(√3 – √2)","zero"],"correctAnswer":2,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q35)","text":"Work done by electric field W_field = -ΔU = U_initial - U_final\n= -pE cos θ₁ - (-pE cos θ₂) = pE(cos θ₂ - cos θ₁)\n= pE(cos 60° - cos 30°) = pE(1/2 - √3/2) = (pE/2)(1 - √3).","steps":["W_field = -ΔU = pE(cos θ₂ - cos θ₁)","θ₁ = 30°, θ₂ = 60°","W = pE(1/2 - √3/2) = (pE/2)(1 - √3)"]}},{"id":36,"subject":"Physics","topic":"Electrostatic Shielding in Conductors","questionText":"The figure shows a charge q placed inside a cavity in an uncharged conductor. Now if an external electric field is switched on then :","diagramKey":"physics_q36","options":["only induced charge on outer surface will redistribute","only induced charge on inner surface will redistribute","Both induced charge on outer and inner surface will redistribute","force on charge q placed inside the cavity will change"],"correctAnswer":1,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q36)","text":"Due to electrostatic shielding, the cavity and the charge q inside it are completely shielded from external electric fields. The charge distribution on the inner surface of the cavity depends solely on the charge inside the cavity and does not change. When an external electric field is switched on, only the free charges on the outer surface of the conductor redistribute to cancel the external field inside the bulk.","steps":["Inner cavity charge distribution is fixed by charge q","Electrostatic shielding prevents external field from entering cavity","Only charges on the outer surface redistribute"]}},{"id":37,"subject":"Physics","topic":"Gauss Law (Flux Through Symmetrical Geometry)","questionText":"A charge q is placed at a vertex of the given geometry of angle 60°. Then, the flux coming out from this geometry will be","diagramKey":"physics_q37","options":["q / (6ε₀)","q / (16ε₀)","q / (8ε₀)","q / (12ε₀)"],"correctAnswer":4,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q37)","text":"A full solid angle around a vertex is 4π steradians. In a horizontal plane, 360°/60° = 6 such wedge geometries meet. Since the charge is placed at the top vertex, it also spans the upper and lower half-spaces (factor of 2). Total 6 × 2 = 12 identical prisms are required to completely enclose the charge q. Hence flux through one geometry is Φ = q / (12ε₀).","steps":["Number of 60° wedges to complete 360° = 6","Vertex divides upper and lower space: 6 × 2 = 12 identical blocks enclose q","Flux through given geometry = q / (12ε₀)"]}},{"id":38,"subject":"Physics","topic":"Charged Sheet & Suspended Ball Equilibrium","questionText":"A charged ball B hangs from a silk thread S, which makes an angle θ with a large charged conducting sheet P, as shown in the figure. The surface charge density σ of the sheet is proportional to :-","diagramKey":"physics_q38","options":["sin θ","cos θ","tan θ","cot θ"],"correctAnswer":3,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q38)","text":"Electric field due to a large conducting sheet E = σ / ε₀.\nForces on the ball in equilibrium:\nT cos θ = mg\nT sin θ = q E = q (σ / ε₀)\nDividing the two equations: tan θ = q σ / (ε₀ mg) ⇒ σ ∝ tan θ.","steps":["T cos θ = mg","T sin θ = q(σ / ε₀)","tan θ = q σ / (ε₀ mg) ⇒ σ ∝ tan θ"]}},{"id":39,"subject":"Physics","topic":"Motion of Charged Particle in Uniform Electric Field","questionText":"An electron enter the region between the plates of a parallel plate as shown in figure. The plate length is ℓ & separation is d. Electric field between plates is uniform. The electron misses the upper plate & follows the path shown. Neglect gravity. Then correct relation is :-","diagramKey":"physics_q39","options":["tan θ = 2d / ℓ","tan θ = 4d / ℓ","tan θ = 8d / ℓ","The data given is insufficient to find a relation among d, ℓ, θ"],"correctAnswer":2,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q39)","text":"This is analogous to projectile motion under uniform downward acceleration a = eE/m.\nMaximum vertical height reached is d: d = u_y² / (2a)\nHorizontal range is ℓ: ℓ = 2 u_x u_y / a\nDividing height by range:\nd / ℓ = [u_y² / (2a)] / [2 u_x u_y / a] = u_y / (4 u_x) = (1/4) tan θ\nTherefore: tan θ = 4d / ℓ.","steps":["Vertical maximum height d = u_y² / (2a)","Horizontal range ℓ = 2 u_x u_y / a","d / ℓ = (1/4) (u_y / u_x) = (1/4) tan θ","tan θ = 4d / ℓ"]}},{"id":40,"subject":"Physics","topic":"Equipotential Surfaces & Particle Motion","questionText":"In the figure equipotential surfaces are shown. A particle of charge q and mass m is released from rest from origin at t = 0. Position vector of particle at t = 1 sec is :-","diagramKey":"physics_q40","options":["(100q/m)(î – ĵ) m","(50q/m)(î – ĵ) m","(50q/m)(–î + ĵ) m","(100q/m)(–î + ĵ) m"],"correctAnswer":2,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q40)","text":"Equipotential lines are inclined at 45° to the x-axis with potential decreasing towards +x. Perpendicular distance between 50V and 40V lines is Δr = 0.1 cos 45° = 0.1 / √2 m.\nMagnitude of Electric field E = -ΔV / Δr = 10 / (0.1 / √2) = 100√2 V/m.\nDirection of E⃗ is perpendicular to equipotential lines pointing in direction of decreasing potential (i.e. at -45° to +x axis):\nE⃗ = (100√2 cos 45°) î - (100√2 sin 45°) ĵ = 100 î - 100 ĵ V/m.\nAcceleration a⃗ = (q/m) E⃗ = (100q/m)(î - ĵ).\nPosition vector at t = 1 s: r⃗ = (1/2) a⃗ t² = (50q/m)(î - ĵ) m.","steps":["E is perpendicular to equipotential lines towards decreasing potential","E = 10 / (0.1 cos 45°) = 100√2 V/m at -45° to x-axis","E⃗ = 100 î - 100 ĵ","r⃗(t=1) = 1/2 (qE⃗/m)(1)² = (50q/m)(î - ĵ) m"]}},{"id":41,"subject":"Physics","topic":"Electric Field of a Short Dipole","questionText":"Electric field at a distance r (r >> a) is E₁, when angle θ is 30°. If only θ changes to 45° then electric field is :-","diagramKey":"physics_q41","options":["√(10/7) E₁","√(7/10) E₁","√(10/13) E₁","E₁"],"correctAnswer":3,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q41)","text":"Electric field at distance r and angle θ for a short dipole: E = (kp / r³) √(3 cos²θ + 1)\nFor θ = 30°: E₁ = (kp / r³) √(3 cos² 30° + 1) = (kp / r³) √(3(3/4) + 1) = (kp / r³) √(13/4) = (kp / 2r³) √13\nFor θ = 45°: E₂ = (kp / r³) √(3 cos² 45° + 1) = (kp / r³) √(3(1/2) + 1) = (kp / r³) √(5/2) = (kp / 2r³) √10\nRatio: E₂ / E₁ = √10 / √13 = √(10/13) ⇒ E₂ = √(10/13) E₁.","steps":["E(θ) ∝ √(3 cos²θ + 1)","For θ = 30°: √(3(3/4) + 1) = √13 / 2","For θ = 45°: √(3(1/2) + 1) = √10 / 2","E₂ = √(10/13) E₁"]}},{"id":42,"subject":"Physics","topic":"Gauss Law (Flux in Composite Surfaces)","questionText":"A charge q is surrounded by a closed surface consisting of an inverted cone of height h and base radius R, and a hemisphere of radius R as shown in the figure. The electric flux through the conical surface is nq / (6ε₀) (in SI units). The value of n is ________.","diagramKey":"physics_q42","options":["3","6","1","2"],"correctAnswer":1,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q42)","text":"By Gauss’s Law, the total flux through the closed surface is Φ_total = q / ε₀.\nThe charge q is placed exactly at the centre of the circular interface separating the upper hemisphere and lower cone.\nBy symmetry, exactly half of the total flux passes through the hemisphere and half through the conical surface:\nΦ_cone = (1/2) (q / ε₀) = 3q / (6ε₀).\nComparing with nq / (6ε₀), we get n = 3.","steps":["Total flux through closed surface = q / ε₀","Charge at interface divides field symmetrically: Φ_cone = Φ_hemisphere = q / (2ε₀)","q / (2ε₀) = 3q / (6ε₀) ⇒ n = 3"]}},{"id":43,"subject":"Physics","topic":"Force on Dipole in Non-Uniform Electric Field","questionText":"A dipole p⃗ = pî + pĵ is placed in an electric field E⃗ = (ax)î + (by)ĵ. The net force on the dipole is:","options":["p(a + b) (î + ĵ)","paî + pbĵ","(pa + pb) k̂","Zero"],"correctAnswer":2,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q43)","text":"Potential energy of dipole U = - p⃗ · E⃗ = - (p î + p ĵ) · (ax î + by ĵ) = - (p a x + p b y)\nForce F⃗ = - ∇U = - [ (∂U/∂x) î + (∂U/∂y) ĵ ]\n∂U/∂x = - p a ⇒ F_x = - (- p a) = p a\n∂U/∂y = - p b ⇒ F_y = - (- p b) = p b\nHence net force F⃗ = p a î + p b ĵ.","steps":["U = - p⃗ · E⃗ = - (p a x + p b y)","F⃗ = - ∇U = - [ (-pa)î + (-pb)ĵ ]","F⃗ = pa î + pb ĵ"]}},{"id":44,"subject":"Physics","topic":"Electrostatic Potential & Work Done","questionText":"A point charge of 10⁻⁸ C is placed at origin. The work done in moving a point charge 2 μC from point A(4, 4, 2) m to B(2, 2, 1) m is __________J. (1/(4πε₀) = 9 × 10⁹ in SI units)","options":["45 × 10⁻⁶","0","30 × 10⁻⁶","15 × 10⁻⁶"],"correctAnswer":3,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q44)","text":"Distance of A from origin: r_A = √(4² + 4² + 2²) = √(16 + 16 + 4) = √36 = 6 m.\nDistance of B from origin: r_B = √(2² + 2² + 1²) = √(4 + 4 + 1) = √9 = 3 m.\nWork done by external agent W_ext = q_test [V_B - V_A]\n= q_test × (k Q) [1/r_B - 1/r_A]\n= (2 × 10⁻⁶) × (9 × 10⁹ × 10⁻⁸) [1/3 - 1/6]\n= (2 × 10⁻⁶) × 90 × (1/6) = 30 × 10⁻⁶ J.","steps":["r_A = √(16 + 16 + 4) = 6 m","r_B = √(4 + 4 + 1) = 3 m","W_ext = q₀ k Q [1/r_B - 1/r_A]","= 2×10⁻⁶ × 90 × (1/6) = 30 × 10⁻⁶ J"]}},{"id":45,"subject":"Physics","topic":"Conductors & Electric Field Lines","questionText":"A point charge q is placed at a point inside a hollow conducting sphere. Which of the following electric force pattern is correct ?","diagramKey":"physics_q45","options":["Field lines originate from charge ending normally on inner surface, E=0 inside shell, emerging radially outward normally from outer surface","Field lines passing straight through conductor without bending","Field lines existing inside the metallic shell wall","No field lines outside the spherical shell"],"correctAnswer":1,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q45)","text":"1. Electric field lines from the internal point charge terminate perpendicularly on the inner surface inducing -q charge.\n2. Electric field inside the conducting material is zero (no lines inside conductor body).\n3. An equal +q charge is induced uniformly on the outer surface, and electric field lines emerge normally from the outer surface into external space pointing radially as if originating from the sphere centre.\nHence Pattern (1) is correct.","steps":["Field lines must be normal to conductor surfaces","E = 0 inside the conductor body","Pattern (1) satisfies all electrostatic boundary conditions"]}},{"id":46,"subject":"Chemistry","topic":"Atomic Structure (Emission Spectrum Lines)","questionText":"In the hydrogen atoms, the electrons are excited to the 5th energy level. The number of the lines that may appear in the emission spectrum will be :","options":["4","8","10","12"],"correctAnswer":3,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q46)","text":"Total number of spectral lines emitted during de-excitation from nth level to ground state:\nN = n(n - 1) / 2 = 5(5 - 1) / 2 = (5 × 4) / 2 = 10 lines.","steps":["Formula: N = n(n - 1) / 2","For n = 5: N = 5(4) / 2 = 10 lines"]}},{"id":47,"subject":"Chemistry","topic":"Bohr's Atomic Model (Orbit Radii)","questionText":"If radius of second stationary orbit (in Bohr's atom) is R. Then radius of third orbit will be:-","options":["R/3","9R","R/9","2.25 R"],"correctAnswer":4,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q47)","text":"Radius of nth Bohr orbit r_n ∝ n²\nr₂ = R ∝ 2² = 4\nr₃ ∝ 3² = 9\nr₃ / r₂ = 9 / 4 = 2.25 ⇒ r₃ = 2.25 R.","steps":["r_n ∝ n²","r₃ / r₂ = 3² / 2² = 9 / 4 = 2.25","r₃ = 2.25 R"]}},{"id":48,"subject":"Chemistry","topic":"Atomic Structure (Excitation Energy)","questionText":"How much energy must be provided to an electron present in ground state of hydrogen atom, so that electron excites to 2nd excited state.","options":["10.2 eV","13.6 eV","1.89 eV","12.09 eV"],"correctAnswer":4,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q48)","text":"Ground state: n₁ = 1, E₁ = -13.6 eV\n2nd excited state corresponds to n₂ = 3: E₃ = -13.6 / 3² = -1.51 eV\nExcitation energy ΔE = E₃ - E₁ = -1.51 - (-13.6) = +12.09 eV.","steps":["Ground state n = 1 (E₁ = -13.6 eV)","2nd excited state n = 3 (E₃ = -1.51 eV)","ΔE = E₃ - E₁ = 12.09 eV"]}},{"id":49,"subject":"Chemistry","topic":"Nuclear Chemistry (Isodiaphers)","questionText":"₅¹¹B and ₆¹³C are related to each other as :-","options":["Isotope","Isodiapher","Isosters","Isoelectronic"],"correctAnswer":2,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q49)","text":"For ₅¹¹B: p = 5, n = 11 - 5 = 6 ⇒ (n - p) = 6 - 5 = 1\nFor ₆¹³C: p = 6, n = 13 - 6 = 7 ⇒ (n - p) = 7 - 6 = 1\nNuclides having the same isotopic excess (n - p) are called isodiaphers.","steps":["₅¹¹B: n - p = 6 - 5 = 1","₆¹³C: n - p = 7 - 6 = 1","Same (n - p) value indicates Isodiaphers"]}},{"id":50,"subject":"Chemistry","topic":"Electronic Configuration (Isoelectronic Species)","questionText":"Which species are isoelectronic (NO₃⁻, CO₃²⁻, ClO₃⁻, SO₃)","options":["NO₃⁻, CO₃²⁻","SO₃, NO₃⁻","ClO₃⁻, CO₃²⁻","CO₃²⁻, SO₃"],"correctAnswer":1,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q50)","text":"Total electrons in NO₃⁻ = 7 + 3(8) + 1 = 32 electrons\nTotal electrons in CO₃²⁻ = 6 + 3(8) + 2 = 32 electrons\nTotal electrons in ClO₃⁻ = 17 + 3(8) + 1 = 42 electrons\nTotal electrons in SO₃ = 16 + 3(8) = 40 electrons\nThus, NO₃⁻ and CO₃²⁻ both have 32 electrons and are isoelectronic.","steps":["NO₃⁻: 7 + 24 + 1 = 32 e⁻","CO₃²⁻: 6 + 24 + 2 = 32 e⁻","Both have 32 e⁻, hence isoelectronic"]}},{"id":51,"subject":"Chemistry","topic":"Atomic Number & Nuclear Composition","questionText":"X⁺² has 10 protons then find number of protons in X⁻² :","options":["10","12","14","16"],"correctAnswer":1,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q51)","text":"The number of protons represents the atomic number (Z) of an element, which is a fundamental nuclear characteristic and does not change during ionization or loss/gain of electrons. Therefore, X⁻² will also have 10 protons.","steps":["Proton count = Atomic Number (Z)","Nuclear charge / protons do not change upon adding/removing electrons","Number of protons remains 10"]}},{"id":52,"subject":"Chemistry","topic":"Nuclear Composition","questionText":"In ₉₂U²³⁵ nucleus, the number of electrons is :-","options":["92","235","143","Zero"],"correctAnswer":4,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q52)","text":"The question specifically asks for the number of electrons inside the nucleus. An atomic nucleus contains only nucleons (protons and neutrons) and zero electrons. (Electrons revolve in orbits outside the nucleus).","steps":["Nucleus consists of protons and neutrons only","Number of electrons inside any nucleus is 0"]}},{"id":53,"subject":"Chemistry","topic":"Fundamental Particles (Neutron vs Proton Mass)","questionText":"Ratio of mass of neutron and proton is :-","options":["Less than one","More than one","Exactly equal to one","Can't be predicted"],"correctAnswer":2,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q53)","text":"Mass of neutron m_n = 1.00866 amu (1.6749 × 10⁻²⁷ kg)\nMass of proton m_p = 1.00727 amu (1.6726 × 10⁻²⁷ kg)\nRatio m_n / m_p = 1.00866 / 1.00727 = 1.00138 > 1 (More than one).","steps":["m_n = 1.00866 amu, m_p = 1.00727 amu","m_n > m_p","Ratio m_n / m_p > 1"]}},{"id":54,"subject":"Chemistry","topic":"Rutherford's Scattering Experiment","questionText":"Rutherford's experiment on scattering of alpha particles showed for the first time that atom has:","options":["Electrons","Protons","Nucleus","Neutrons"],"correctAnswer":3,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q54)","text":"Rutherford's alpha particle scattering experiment on gold foil showed that most alpha particles passed undeflected, but a few were deflected through large angles (and 1 in 20,000 rebounded by 180°), proving the existence of a tiny, dense, positively charged core called the nucleus.","steps":["Alpha scattering proved concentrated central positive charge","Led to discovery of atomic nucleus"]}},{"id":55,"subject":"Chemistry","topic":"Rutherford's Model Conclusions","questionText":"Which of the following conclusions regarding the structure of atom is true based on Rutherford's α-particle scattering experiment ?","options":["The positive charge is concentrated in a very small volume of the atom","The positive charge is scattered with the electrons throughout the atom","The volume occupied by the nucleus is half of the volume of atom","Most of the space in the atom is occupied by the neutrons."],"correctAnswer":1,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q55)","text":"Rutherford concluded that the entire positive charge and almost all the mass of the atom is concentrated in an extremely small central region called the nucleus (radius ~ 10⁻¹⁵ m compared to atomic radius ~ 10⁻¹⁰ m).","steps":["Nucleus occupies less than 10⁻¹⁵ of the total atomic volume","Positive charge is concentrated in this tiny volume"]}},{"id":56,"subject":"Chemistry","topic":"Bohr's Postulates (Orbital Angular Momentum)","questionText":"Angular momentum for P–shell electron is :–","options":["3h/π","Zero","√2h/(2π)","None"],"correctAnswer":1,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q56)","text":"Shell notation: K(n=1), L(n=2), M(n=3), N(n=4), O(n=5), P(n=6).\nFor P-shell: principal quantum number n = 6.\nAngular momentum L = n h / (2π) = 6 h / (2π) = 3h/π.","steps":["P-shell corresponds to n = 6","L = nh / (2π) = 6h / (2π) = 3h / π"]}},{"id":57,"subject":"Chemistry","topic":"Atomic Composition (Protons, Neutrons, Electrons)","questionText":"The mass no. of an element is 39. The number of neutrons in its nucleus is one more than the number of protons. The number of protons, neutrons and electrons respectively in its atom would be","options":["19, 20, 19","19, 19, 20","20, 19, 19","20, 19, 20"],"correctAnswer":1,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q57)","text":"Mass number A = p + n = 39\nGiven: n = p + 1\nSubstituting: p + (p + 1) = 39 ⇒ 2p = 38 ⇒ p = 19.\nNumber of neutrons n = 19 + 1 = 20.\nFor a neutral atom, electrons = protons = 19.\nRespective numbers: 19, 20, 19 (Potassium-39).","steps":["p + n = 39 and n = p + 1","2p + 1 = 39 ⇒ p = 19","n = 20, e = 19"]}},{"id":58,"subject":"Chemistry","topic":"Bohr Energy Levels in Hydrogen","questionText":"Energy of e⁻ in 2nd orbit of H-atom is-","options":["13.6 eV","–3.4 eV","–1.51 eV","–0.54 eV"],"correctAnswer":2,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q58)","text":"Energy of electron in nth Bohr orbit of hydrogen: E_n = -13.6 / n² eV.\nFor 2nd orbit (n = 2): E₂ = -13.6 / 2² = -13.6 / 4 = -3.4 eV.","steps":["E_n = -13.6 / n² eV","E₂ = -13.6 / 4 = -3.4 eV"]}},{"id":59,"subject":"Chemistry","topic":"Kinetic Energy of Orbiting Electrons","questionText":"If the K.E. of e⁻ in first and second orbit of Li⁺² ion is x and y respectively then :","options":["x < y","x > y","x = y","None of these"],"correctAnswer":2,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q59)","text":"Kinetic Energy in Bohr model K.E. = +13.6 × (Z² / n²) eV.\nAs principal quantum number n increases, radius r increases and K.E. decreases (K.E. ∝ 1/n²).\nFor n=1, K.E. = x = 13.6(3²)/1² = 122.4 eV.\nFor n=2, K.E. = y = 13.6(3²)/2² = 30.6 eV.\nTherefore, x > y.","steps":["K.E. = 13.6 Z² / n² eV","K.E. ∝ 1/n²","x (n=1) > y (n=2)"]}},{"id":60,"subject":"Chemistry","topic":"Hydrogen Spectrum Series (Maximum Frequency Ratio)","questionText":"Find out ratio of following (ν_max)_Lyman : (ν_max)_Brackett","options":["1 : 16","16 : 1","4 : 1","1 : 4"],"correctAnswer":2,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q60)","text":"Maximum frequency corresponds to series limit (transition from n = ∞):\n(ν_max)_Lyman = R c [1/1² - 1/∞²] = R c (1)\n(ν_max)_Brackett = R c [1/4² - 1/∞²] = R c (1/16)\nRatio = (R c) / (R c / 16) = 16 : 1.","steps":["ν_max occurs for transition from n₂ = ∞","Lyman: n₁ = 1 ⇒ ν_max ∝ 1/1² = 1","Brackett: n₁ = 4 ⇒ ν_max ∝ 1/4² = 1/16","Ratio = 1 / (1/16) = 16 : 1"]}},{"id":61,"subject":"Chemistry","topic":"Mole Concept (Avogadro Number)","questionText":"Moles of O₃ in its 12.044 × 10²² molecules of O₃ will be :","options":["2 mol","0.4 mol","1 mol","0.2 mol"],"correctAnswer":4,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q61)","text":"Moles = (Number of molecules) / N_A\n= (12.044 × 10²²) / (6.022 × 10²³)\n= (12.044 / 6.022) × 10⁻¹ = 2 × 0.1 = 0.2 mol.","steps":["Moles = N / N_A","= (12.044 × 10²²) / (6.022 × 10²³)","= 0.2 mol"]}},{"id":62,"subject":"Chemistry","topic":"Solutions & Concentration Terms (Mole Fraction)","questionText":"If 5 moles of A is mixed 15 moles of B then what is the mole fraction of A in the mixture ?","options":["0.75","0.35","0.25","0.5"],"correctAnswer":3,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q62)","text":"Total moles n_total = n_A + n_B = 5 + 15 = 20 moles.\nMole fraction of A: x_A = n_A / n_total = 5 / 20 = 1 / 4 = 0.25.","steps":["n_total = 5 + 15 = 20","x_A = n_A / n_total = 5 / 20 = 0.25"]}},{"id":63,"subject":"Chemistry","topic":"Stoichiometry (Gay-Lussac Law of Combining Volumes)","questionText":"Volume of H₂(g) required to react completely with 3L of N₂(g) to form ammonia at same T & P condition will be :","options":["7 L","6 L","9 L","4 L"],"correctAnswer":3,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q63)","text":"Balanced chemical equation: N₂(g) + 3H₂(g) → 2NH₃(g)\nBy Avogadro’s Law at same T & P, volume ratio = mole ratio.\n1 Volume of N₂ reacts with 3 Volumes of H₂.\nHence, 3 L of N₂ requires 3 × 3 L = 9 L of H₂.","steps":["N₂ + 3H₂ → 2NH₃","1 L N₂ reacts with 3 L H₂","3 L N₂ requires 3 × 3 = 9 L H₂"]}},{"id":64,"subject":"Chemistry","topic":"Limiting & Excess Reagent","questionText":"When 5 moles of A will react with 3 moles of B according to given balanced reaction 2A + 6B → C. Then which of the following reactant will be in excess amount","options":["A","B","can’t be determined","Both will act as limiting reagent"],"correctAnswer":1,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q64)","text":"Mole-to-coefficient ratios:\nFor A: 5 / 2 = 2.5\nFor B: 3 / 6 = 0.5\nSince the ratio for B is smaller, B is the limiting reagent.\nFor 3 moles of B, moles of A consumed = 3 × (2 / 6) = 1 mol.\nRemaining moles of A = 5 - 1 = 4 moles (A is in excess).","steps":["Ratio for A = 5/2 = 2.5","Ratio for B = 3/6 = 0.5 (Limiting Reagent)","A is present in excess"]}},{"id":65,"subject":"Chemistry","topic":"Percentage Composition","questionText":"% of H in methane will be :","options":["25%","30%","17%","32%"],"correctAnswer":1,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q65)","text":"Molar mass of methane (CH₄) = 12 + 4(1) = 16 g/mol.\nMass of Hydrogen in 1 mole CH₄ = 4 g.\n% of H = (4 / 16) × 100% = 25%.","steps":["Molar mass of CH₄ = 16 g/mol","Mass of H = 4 g","% of H = (4 / 16) × 100 = 25%"]}},{"id":66,"subject":"Chemistry","topic":"Empirical Formula","questionText":"The no. of atoms of A and B in their molecule are 9 × 10²⁰ and 3 × 10²⁰ respectively then their empirical formula will be :","options":["AB₃","A₃B","AB","A₉B"],"correctAnswer":2,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q66)","text":"Simplest atomic ratio A : B = (9 × 10²⁰) / (3 × 10²⁰) = 3 : 1.\nEmpirical formula is A₃B.","steps":["Ratio A : B = 9 × 10²⁰ : 3 × 10²⁰ = 3 : 1","Empirical formula = A₃B"]}},{"id":67,"subject":"Chemistry","topic":"Molality Calculation","questionText":"2 moles of urea is dissolved in 20 kg of solvent then molality of the solution formed is :","options":["0.1 m","0.2 m","1 m","1.5 m"],"correctAnswer":1,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q67)","text":"Molality (m) = (Moles of solute) / (Mass of solvent in kg)\n= 2 moles / 20 kg = 0.1 mol/kg = 0.1 m.","steps":["Molality m = n_solute / W_solvent(kg)","m = 2 / 20 = 0.1 m"]}},{"id":68,"subject":"Chemistry","topic":"Planck’s Quantum Theory (Photon Energy & Wavelength)","questionText":"The ratio of the energy of a photon of wavelength 3000 Å to that of a photon of wavelength 6000 Å is :","options":["1/2","2","3","1/3"],"correctAnswer":2,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q68)","text":"Energy of a photon E = hc / λ ⇒ E ∝ 1/λ\nE₁ / E₂ = λ₂ / λ₁ = 6000 Å / 3000 Å = 2.","steps":["E ∝ 1/λ","E₁ / E₂ = 6000 / 3000 = 2"]}},{"id":69,"subject":"Chemistry","topic":"Bohr's Orbit Angular Momentum","questionText":"According to Bohr's theory, the angular momentum to an electron in 5th orbit is :","options":["25 (h/π)","1.0 (h/π)","10 (h/π)","2.5 (h/π)"],"correctAnswer":4,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q69)","text":"L = n h / (2π)\nFor n = 5: L = 5h / (2π) = 2.5 (h/π).","steps":["L = nh / 2π","For n = 5: L = 5/2 (h/π) = 2.5 (h/π)"]}},{"id":70,"subject":"Chemistry","topic":"Spectral Lines & Shortest Wavelength","questionText":"When electrons are de-exciting from nth orbit of hydrogen atoms to ground state, 15 spectral lines are formed. The shortest wavelength among these will be :","options":["11 / (900 R)","36 / (35 R)","35 / (36 R)","35 / (36 R)"],"correctAnswer":2,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q70)","text":"Total lines = n(n - 1) / 2 = 15 ⇒ n(n - 1) = 30 ⇒ n = 6.\nShortest wavelength corresponds to maximum energy transition (from highest level n = 6 to ground state n = 1):\n1 / λ_min = R_H [1/1² - 1/6²] = R [1 - 1/36] = 35 R / 36\nλ_min = 36 / (35 R).","steps":["n(n - 1) / 2 = 15 ⇒ n = 6","1 / λ = R (1/1² - 1/6²) = 35R / 36","λ = 36 / (35 R)"]}},{"id":71,"subject":"Chemistry","topic":"Gas Mixtures & Molecule Ratio","questionText":"A gaseous mixture contains CO₂(g) and N₂O(g) in 2:5 ratio by mass. The ratio of the number of molecules of CO₂(g) and N₂O (g) is:","options":["5 : 2","2 : 5","1 : 2","5 : 4"],"correctAnswer":2,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q71)","text":"Molar mass of CO₂ = 12 + 2(16) = 44 g/mol\nMolar mass of N₂O = 2(14) + 16 = 44 g/mol\nSince both gases have identical molar mass (44 g/mol):\nMole ratio = (w_CO₂ / 44) / (w_N₂O / 44) = w_CO₂ / w_N₂O = 2 / 5.\nNumber of molecules ratio = Mole ratio = 2 : 5.","steps":["Molar mass of CO₂ = 44 g/mol","Molar mass of N₂O = 44 g/mol","Molecule ratio = Mass ratio = 2 : 5"]}},{"id":72,"subject":"Chemistry","topic":"Molecular Formula Determination","questionText":"The empirical formula of a compound of molecular mass 120 is CH₂O. The molecular formula of the compound is:","options":["C₂H₄O₂","C₄H₈O₄","C₃H₆O₃","All of these"],"correctAnswer":2,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q72)","text":"Empirical formula mass of CH₂O = 12 + 2(1) + 16 = 30 g/mol.\nn = Molecular mass / Empirical formula mass = 120 / 30 = 4.\nMolecular formula = (CH₂O)₄ = C₄H₈O₄.","steps":["Empirical mass = 12 + 2 + 16 = 30","n = 120 / 30 = 4","Molecular formula = C₄H₈O₄"]}},{"id":73,"subject":"Chemistry","topic":"Bohr Velocity in Hydrogen-like Species","questionText":"If the velocity of an electron in 1st orbit of H-atom is u, what will be the velocity of electron in 3rd orbit Li⁺² ?","options":["u","u/3","3u","9u"],"correctAnswer":1,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q73)","text":"Velocity of electron in Bohr orbit v ∝ Z / n\nFor H (Z = 1, n = 1): v₁ = u ∝ 1/1 = 1\nFor Li²⁺ (Z = 3, n = 3): v₃ ∝ 3/3 = 1\nHence v₃ = u.","steps":["v ∝ Z / n","For H (n=1): v = u ∝ 1/1","For Li²⁺ (Z=3, n=3): v = u × (3/3) = u"]}},{"id":74,"subject":"Chemistry","topic":"Vapour Density Definition","questionText":"Vapour density of any gas is :-","options":["Unitless quantity","Molar mass / 2","Density of any gas with respect to density of H₂ gas under same condition of P and T","All of the above"],"correctAnswer":4,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q74)","text":"Vapour Density (VD) is defined as the density of a gas relative to that of hydrogen gas at the same temperature and pressure.\nSince it is a ratio of two densities, it is a dimensionless / unitless quantity.\nMathematically: Vapour Density = Molar mass of gas / Molar mass of H₂ = Molar mass / 2.\nHence all options are correct.","steps":["VD = (Density of gas) / (Density of H₂) at same T, P","VD = Molar mass / 2","VD is a dimensionless (unitless) ratio"]}},{"id":75,"subject":"Chemistry","topic":"Minimum Molecular Weight Calculation","questionText":"A compound contains 11.5% by mass of sodium. Its minimum molecular weight will be :-","options":["80 amu","200 amu","250 amu","300 amu"],"correctAnswer":2,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q75)","text":"For minimum molecular weight, the compound must contain at least one sodium atom (atomic mass = 23 amu).\n% of Na = (1 × 23 / M_min) × 100\n11.5 = (23 / M_min) × 100\nM_min = 2300 / 11.5 = 200 amu.","steps":["% Na = (23 / M) × 100","11.5 = 2300 / M","M = 200 amu"]}},{"id":76,"subject":"Chemistry","topic":"Heisenberg's Uncertainty Principle","questionText":"What will be the uncertainty in velocity of an electron if uncertainty in its position is 1Å","options":["8.76 × 10⁶ m/s","5.76 × 10⁵ m/s","5 × 10⁻²⁴ m/s","1 × 10²³ m/s"],"correctAnswer":2,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q76)","text":"By Heisenberg’s principle: Δx · m Δv ≥ h / (4π)\nΔv = h / (4π m Δx)\n= 6.626 × 10⁻³⁴ / [4 × 3.1416 × (9.1 × 10⁻³¹ kg) × (10⁻¹⁰ m)]\n= 6.626 × 10⁻³⁴ / (1.1435 × 10⁻³⁹) = 5.76 × 10⁵ m/s.","steps":["Δx = 1 Å = 10⁻¹⁰ m","Δv = h / (4π m Δx)","Δv = 5.76 × 10⁵ m/s"]}},{"id":77,"subject":"Chemistry","topic":"Mole Concept (Total Atoms in Compound)","questionText":"The total number of atoms present in 1 mol of Ammonium dichromate (NH₄)₂Cr₂O₇ is :-","options":["19","N_A","114.437 × 10²³","84.322 × 10²³"],"correctAnswer":3,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q77)","text":"One formula unit of (NH₄)₂Cr₂O₇ contains:\n2 Nitrogen + 8 Hydrogen + 2 Chromium + 7 Oxygen = 19 atoms.\n1 mole of (NH₄)₂Cr₂O₇ contains 19 × N_A atoms\n= 19 × 6.023 × 10²³ = 114.437 × 10²³ atoms.","steps":["Atoms per molecule = 2(1+4) + 2 + 7 = 19 atoms","Total atoms = 19 × 6.023 × 10²³ = 114.437 × 10²³"]}},{"id":78,"subject":"Chemistry","topic":"Difference in Angular Momentum","questionText":"The difference in angular momentum associated with the electron in 3rd and 1st orbits of hydrogen atom is :-","options":["h/π","h/(2π)","h/2","(n-1) h/(2π)"],"correctAnswer":1,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q78)","text":"L₃ = 3h / (2π)\nL₁ = 1h / (2π)\nΔL = L₃ - L₁ = (3 - 1) h / (2π) = 2h / (2π) = h / π.","steps":["L_n = nh / (2π)","ΔL = (3 - 1) h / 2π = 2h / 2π = h / π"]}},{"id":79,"subject":"Chemistry","topic":"Bohr Shell Nomenclature","questionText":"The ratio of the radius of two bohr orbits of Li⁺² is 1 : 9, what would be there nomenclature :-","options":["K & L","L & M","K & M","K & N"],"correctAnswer":3,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q79)","text":"r ∝ n² ⇒ r₁ / r₂ = n₁² / n₂² = 1 / 9 ⇒ n₁ / n₂ = 1 / 3.\nFor n = 1, shell name is K.\nFor n = 3, shell name is M.\nThus the shells are K & M.","steps":["r₁ / r₂ = (n₁ / n₂)² = 1 / 9","n₁ = 1 (K shell), n₂ = 3 (M shell)"]}},{"id":80,"subject":"Chemistry","topic":"Photochemistry & Energy Conservation","questionText":"A gas absorbs a photon of 300 nm and emits out two wavelengths. If one of the emissions is at 600 nm, the other is at :-","options":["1035 nm","1200 nm","600 nm","518 nm"],"correctAnswer":3,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q80)","text":"By conservation of energy: E_absorbed = E₁ + E₂\nhc / λ = hc / λ₁ + hc / λ₂\n1 / 300 = 1 / 600 + 1 / λ₂\n1 / λ₂ = 1 / 300 - 1 / 600 = 1 / 600 ⇒ λ₂ = 600 nm.","steps":["1/λ = 1/λ₁ + 1/λ₂","1/300 = 1/600 + 1/λ₂","1/λ₂ = 1/600 ⇒ λ₂ = 600 nm"]}},{"id":81,"subject":"Chemistry","topic":"Specific Charge of Particles","questionText":"Which of the following is correct sequence of specific charge ?","options":["e⁻ > Na⁺ > p > n","e⁻ > p > Na⁺ > n","Na⁺ > e⁻ > p > n","e⁻ > n > p > Na⁺"],"correctAnswer":2,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q81)","text":"Specific charge = q / m\nElectron (e⁻): 1.758 × 10¹¹ C/kg\nProton (p): 9.58 × 10⁷ C/kg\nSodium ion (Na⁺): (9.58 × 10⁷) / 23 = 4.16 × 10⁶ C/kg\nNeutron (n): charge is 0 ⇒ specific charge = 0\nCorrect order: e⁻ > p > Na⁺ > n.","steps":["e⁻: ~ 1.76 × 10¹¹ C/kg","p: ~ 9.58 × 10⁷ C/kg","Na⁺: ~ 4.16 × 10⁶ C/kg","n: 0 C/kg","Sequence: e⁻ > p > Na⁺ > n"]}},{"id":82,"subject":"Chemistry","topic":"Excited States Angular Momentum","questionText":"According to Bohr's theory, the angular momentum for an electron in its 3rd excited state will be :","options":["4h/(3π)","2h/π","5h/π","25h/π"],"correctAnswer":2,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q82)","text":"3rd excited state corresponds to principal quantum number n = 4.\nAngular momentum L = n h / (2π) = 4 h / (2π) = 2h / π.","steps":["3rd excited state means n = 3 + 1 = 4","L = 4h / 2π = 2h / π"]}},{"id":83,"subject":"Chemistry","topic":"Velocity of Electron in Different Orbits","questionText":"The ratio of velocity of the electron in the third and fifth orbit of Li²⁺ would be :-","options":["3 : 5","5 : 3","25 : 9","9 : 25"],"correctAnswer":2,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q83)","text":"Velocity in Bohr orbit v ∝ 1/n (for same Z)\nv₃ / v₅ = n₅ / n₃ = 5 / 3 = 5 : 3.","steps":["v ∝ 1/n","v₃ / v₅ = 5 / 3 = 5 : 3"]}},{"id":84,"subject":"Chemistry","topic":"Ionization Energy vs Ground State Energy","questionText":"If the ionization energy for He⁺ ion’s e⁻ is x then the energy of e⁻ in its 1st orbit will be","options":["–x/2","13x/2","–x","–x/3"],"correctAnswer":3,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q84)","text":"Ionization Energy (IE) is defined as the minimum energy required to remove an electron from its ground state (n = 1) to infinity (n = ∞):\nIE = E_∞ - E₁ = 0 - E₁ = - E₁\nGiven IE = x ⇒ E₁ = -x.","steps":["IE = E_∞ - E₁ = - E₁","x = - E₁ ⇒ E₁ = -x"]}},{"id":85,"subject":"Chemistry","topic":"Balmer Series First Line Wave Number","questionText":"The first emission line in H-atom spectrum in balmer series will have wave no. :-","options":["5R / 36","3R / 4","7R / 4","9R / 400"],"correctAnswer":1,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q85)","text":"First line of Balmer series corresponds to transition from n₂ = 3 to n₁ = 2.\nWave number ν̄ = R_H Z² [1/n₁² - 1/n₂²]\n= R (1)² [1/2² - 1/3²] = R [1/4 - 1/9] = 5R / 36.","steps":["Balmer first line: n₁ = 2, n₂ = 3","ν̄ = R (1/4 - 1/9) = 5R / 36"]}},{"id":86,"subject":"Chemistry","topic":"Mole Concept (Moles of Electrons in Carbon)","questionText":"No. of moles of e⁻ in 12g C-atom will be :","options":["6 moles","3 moles","12 moles","4 moles"],"correctAnswer":1,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q86)","text":"Moles of Carbon atoms = 12 g / (12 g/mol) = 1 mol C atoms.\nEach neutral carbon atom (Z = 6) contains 6 electrons.\n1 mol of carbon atoms contains 1 × 6 = 6 moles of electrons.","steps":["Moles of C = 12 / 12 = 1 mol","Electrons per C atom = 6","Moles of e⁻ = 6 moles"]}},{"id":87,"subject":"Chemistry","topic":"Mole Concept (Moles of Oxygen Atoms)","questionText":"Moles of atom in 32 g oxygen gas is :","options":["2 mol","3 mol","1 mol","None of these"],"correctAnswer":1,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q87)","text":"Oxygen gas exists as diatomic molecules (O₂).\nMolar mass of O₂ = 32 g/mol.\nMoles of O₂ molecules = 32 g / 32 g/mol = 1 mol.\nEach O₂ molecule contains 2 oxygen atoms.\nTotal moles of oxygen atoms = 1 × 2 = 2 mol.","steps":["Moles of O₂ = 32 / 32 = 1 mol O₂","Atomicity of O₂ = 2","Moles of O atoms = 2 mol"]}},{"id":88,"subject":"Chemistry","topic":"Combustion Stoichiometry & STP Volume","questionText":"In complete combustion of 3g ethane what is the volume of CO₂ gas produced at STP","options":["44.8 L","2.24 L","4.48 L","11.2 L"],"correctAnswer":3,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q88)","text":"Molar mass of ethane (C₂H₆) = 2(12) + 6(1) = 30 g/mol.\nMoles of C₂H₆ = 3 g / 30 g/mol = 0.1 mol.\nCombustion reaction: C₂H₆ + 7/2 O₂ → 2CO₂ + 3H₂O\n1 mole C₂H₆ produces 2 moles CO₂.\n0.1 mole C₂H₆ produces 0.2 mole CO₂.\nVolume of CO₂ at STP = 0.2 mol × 22.4 L/mol = 4.48 L.","steps":["Moles of C₂H₆ = 3 / 30 = 0.1 mol","Moles of CO₂ = 0.1 × 2 = 0.2 mol","Volume at STP = 0.2 × 22.4 L = 4.48 L"]}},{"id":89,"subject":"Chemistry","topic":"Atomic Transitions & Frequency Addition","questionText":"In the following transition which statement is correct?","diagramKey":"chem_q44","options":["E₃₋₁ = E₃₋₂ – E₂₋₁","λ₃ = λ₁ + λ₂","ν₃ = ν₁ + ν₂","All of these"],"correctAnswer":3,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q89)","text":"From the energy level diagram: E₃₋₁ = E₃₋₂ + E₂₋₁\nSince E = hν: hν₃ = hν₁ + hν₂ ⇒ ν₃ = ν₁ + ν₂.\n(In terms of wavelength: 1/λ₃ = 1/λ₁ + 1/λ₂, not λ₃ = λ₁ + λ₂).","steps":["E₃₋₁ = E₃₋₂ + E₂₋₁","hν₃ = hν₁ + hν₂","ν₃ = ν₁ + ν₂"]}},{"id":90,"subject":"Chemistry","topic":"Ionization Energies of H-like Species","questionText":"The ratio of Ionisation energies of Li⁺² and Be⁺³ is","options":["2/3","3/2","9/16","16/9"],"correctAnswer":3,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q90)","text":"Ionization Energy for single-electron (hydrogen-like) species in ground state:\nIE = 13.6 × Z² eV\nFor Li²⁺: Z = 3 ⇒ IE(Li²⁺) = 13.6 × 3² = 13.6 × 9\nFor Be³⁺: Z = 4 ⇒ IE(Be³⁺) = 13.6 × 4² = 13.6 × 16\nRatio IE(Li²⁺) / IE(Be³⁺) = 9 / 16.","steps":["IE ∝ Z²","IE(Li²⁺) ∝ 3² = 9","IE(Be³⁺) ∝ 4² = 16","Ratio = 9 / 16"]}},{"id":91,"subject":"Biology","topic":"Animal Kingdom (Annelida)","questionText":"The given animal belongs to which phylum?","diagramKey":"bio_q91","options":["Platyhelminthes","Aschelminthes","Annelida","Arthropoda"],"correctAnswer":3,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q91)","text":"The image depicts Nereis, an aquatic annelid that possesses parapodia for swimming and exhibits true metameric segmentation. It belongs to Phylum Annelida.","steps":["The organism shown is Nereis","Nereis belongs to Phylum Annelida"]}},{"id":92,"subject":"Biology","topic":"Animal Kingdom (Reptilia Common Names)","questionText":"Match the following column I and II to select correct answer:\nColumn I (Scientific Name):\n1. Vipera\n2. Naja\n3. Hemidactylus\n4. Python\nColumn II (Common Name):\na. Wall lizard\nb. Ajgar\nc. Indian cobra\nd. Viper snake","options":["1-c, 2-d, 3-a, 4-b","1-a, 2-b, 3-c, 4-d","1-d, 2-c, 3-a, 4-b","1-d, 2-c, 3-b, 4-a"],"correctAnswer":3,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q92)","text":"1. Vipera → Viper snake (d)\n2. Naja → Indian cobra (c)\n3. Hemidactylus → Wall lizard (a)\n4. Python → Ajgar (b)\nCorrect match is 1-d, 2-c, 3-a, 4-b.","steps":["Vipera = Viper (1-d)","Naja = Cobra (2-c)","Hemidactylus = Wall lizard (3-a)","Python = Ajgar (4-b)"]}},{"id":93,"subject":"Biology","topic":"Animal Kingdom (Body Symmetry)","questionText":"Which of the following group of animals exhibit bilateral symmetry only ?","options":["Pennatula, Adamsia, Pleurobrachia","Euspongia, Spongilla, Taenia","Ascaris, Nereis, Scorpion","Echinus, Gorgonia, Sycon"],"correctAnswer":3,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q93)","text":"Ascaris (Aschelminthes), Nereis (Annelida), and Scorpion (Arthropoda) all exhibit bilateral symmetry exclusively. Pennatula/Adamsia/Pleurobrachia have radial/biradial symmetry; Sponges are mostly asymmetrical; adult Echinoderms have radial symmetry.","steps":["Ascaris, Nereis, and Scorpion are triploblastic bilaterians","All three exhibit bilateral symmetry only"]}},{"id":94,"subject":"Biology","topic":"Animal Kingdom (Class Aves Features)","questionText":"Read the following statements from A-D ?\n(A) They have pneumatic bones\n(B) Skin is dry without glands.\n(C) Digestive tract has additional chambers, the crop and gizzard.\n(D) They are warm blooded.\nThese statements are correct for which animal ?","options":["Vipera","Columba","Labeo","Pteropus"],"correctAnswer":2,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q94)","text":"Pneumatic (air-filled) bones, dry skin devoid of glands (except preen/oil gland at tail base), digestive tract with crop and gizzard, and homeothermy (warm-blooded) are diagnostic characteristics of birds (Class Aves). Columba (pigeon) is a bird.","steps":["Features described belong to Class Aves","Columba (Pigeon) is a member of Class Aves"]}},{"id":95,"subject":"Biology","topic":"Animal Kingdom (Coelom Types)","questionText":"In the given diagram identify the coelomic condition in the animals :-","diagramKey":"bio_q95","options":["(A) Tapeworm, (B) Ascaris, (C) Earthworm","(A) Cockroach, (B) Ascaris, (C) Tapeworm","(A) Ascaris, (B) Tapeworm, (C) Earthworm","(A) Earthworm, (B) Cockroach, (C) Ascaris"],"correctAnswer":2,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q95)","text":"Diagram (A) shows a true coelom lined completely by mesoderm (Coelomate, e.g. Cockroach / Earthworm).\nDiagram (B) shows scattered pouches of mesoderm (Pseudocoelomate, e.g. Ascaris).\nDiagram (C) shows no body cavity between ectoderm and endoderm (Acoelomate, e.g. Tapeworm / Platyhelminthes).\nHence: (A) Cockroach, (B) Ascaris, (C) Tapeworm.","steps":["(A) True coelom = Cockroach (Arthropod)","(B) Pseudocoelom (scattered mesodermal pouches) = Ascaris","(C) Acoelomate (mesoderm solid) = Tapeworm"]}},{"id":96,"subject":"Biology","topic":"Animal Kingdom (Cnidaria Body Forms)","questionText":"Match the columns I, II, III and choose the correct combination from the given options :-\nColumn I (Diagram):\na. Stalked cylindrical body\nb. Umbrella shaped free swimming body\nColumn II:\n1. Aurelia\n2. Adamsia\nColumn III:\nR. Polyp\nS. Medusa","diagramKey":"bio_q96","options":["a - 1 - R, b - 2 - S","a - 1 - S, b - 2 - R","a - 2 - R, b - 1 - S","a - 2 - S, b - 1 - R"],"correctAnswer":3,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q96)","text":"a. Cylindrical and sessile form is Polyp, exemplified by Adamsia (Sea anemone) → a - 2 - R.\nb. Umbrella-shaped and free-swimming form is Medusa, exemplified by Aurelia (Jelly fish) → b - 1 - S.","steps":["Polyp (cylindrical/sessile) = Adamsia (a-2-R)","Medusa (umbrella/free-swimming) = Aurelia (b-1-S)"]}},{"id":97,"subject":"Biology","topic":"Animal Kingdom (Phylum Ctenophora)","questionText":"The characters given below are shown by :\n(i) Extracellular and intracellular digestion.\n(ii) Exclusively marine, radially symmetrical, diploblastic, tissue level of organisation.\n(iii) Bisexual, fertilization external and indirect development.\n(iv) Only sexual reproduction.","options":["Cnidaria","Porifera","Ctenophora","Platyhelminthes"],"correctAnswer":3,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q97)","text":"Exclusively marine habitat, radial symmetry, diploblastic tissue-level organization, both extra- and intracellular digestion, reproduction exclusively by sexual means, external fertilization, and ciliated comb plates are unique diagnostic features of Ctenophores (comb jellies/sea walnuts).","steps":["Exclusively marine + only sexual reproduction + external fertilization = Ctenophora"]}},{"id":98,"subject":"Biology","topic":"Animal Kingdom (Platyhelminthes)","questionText":"Select incorrect statement about flatworms :-","options":["Hooks and suckers are present in all flat worms.","Fertilization is internal and development occurs through many larval stages.","Some of them absorb nutrients through body surface.","Locomotory organs are absent."],"correctAnswer":1,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q98)","text":"Hooks and suckers are present only in the parasitic flatworms (like Taenia/Fasciola) to adhere to host tissues, but are absent in free-living flatworms like Planaria. Hence statement (1) is incorrect.","steps":["Hooks and suckers are present only in parasitic forms, not in all flatworms"]}},{"id":99,"subject":"Biology","topic":"Animal Kingdom (Phylum Mollusca)","questionText":"Find out incorrect statement :-","options":["Body of molluscs is segmented as it is divided into head, muscular foot and visceral hump.","Gills help in excretion in Molluscs.","Anus of Mollusc open into mantle cavity","Loligo is also known as squid"],"correctAnswer":1,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q99)","text":"Molluscs are unsegmented animals (except Neopilina). Their body is unsegmented and divided into head, muscular foot, and visceral hump. Therefore, statement (1) is incorrect.","steps":["Molluscs are unsegmented invertebrates","Statement (1) incorrectly calls them segmented"]}},{"id":100,"subject":"Biology","topic":"Animal Kingdom (Echinodermata Identification)","questionText":"How many animals are related with echinodermata ?\nAsterias, Echinus, Sea lily, Ophiura, Cucumaria, Saccoglossus, Cuttle fish, Sea hare, Culex, Chiton","options":["6","4","7","5"],"correctAnswer":4,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q100)","text":"Echinoderms among the given list are:\n1. Asterias (Star fish)\n2. Echinus (Sea urchin)\n3. Sea lily (Antedon)\n4. Ophiura (Brittle star)\n5. Cucumaria (Sea cucumber)\n(Saccoglossus is Hemichordata; Cuttle fish, Sea hare, Chiton are Mollusca; Culex is Arthropoda). Total = 5.","steps":["Echinoderms: Asterias, Echinus, Sea lily, Ophiura, Cucumaria = 5 animals"]}},{"id":101,"subject":"Biology","topic":"Animal Kingdom (Hemichordata Excretion)","questionText":"Proboscis gland is excretory in function, it is found in :","options":["Echinus","Saccoglossus","Balanoglossus","Both 2 and 3"],"correctAnswer":4,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q101)","text":"In Phylum Hemichordata (e.g. Balanoglossus and Saccoglossus), the excretory organ is the proboscis gland situated in the proboscis region.","steps":["Proboscis gland is found in Hemichordates","Both Saccoglossus and Balanoglossus possess proboscis gland"]}},{"id":102,"subject":"Biology","topic":"Animal Kingdom (Chordata Classification Flowchart)","questionText":"Read the following chart given and identify A, B, C and D :-\nVertebrate → Division: [A] (Cyclostomata) and [B] (Super class: Pisces and [C]). Pisces includes Chondrichthyes and [D].","diagramKey":"bio_q102","options":["A: Lacks Jaw, B: Bears Jaw, C: Apoda, D: Osteichthyes","A: Bears Jaw, B: Lacks Jaw, C: Octapoda, D: Osteichthyes","A: Lacks Jaw, B: Lacks Jaw, C: Hexapoda, D: Osteichthyes","A: Lacks Jaw, B: Bears Jaw, C: Tetrapoda, D: Osteichthyes"],"correctAnswer":4,"solution":{"reference":"Allen Test Series 0999DMD363104260001 (Q102)","text":"Subphylum Vertebrata is divided into two divisions:\n- Agnatha (A: Lacks Jaw)\n- Gnathostomata (B: Bears Jaw)\nGnathostomata is di
