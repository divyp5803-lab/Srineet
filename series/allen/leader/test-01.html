<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEST 01 | ALLEN LEADER | SRINEET</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,Helvetica,sans-serif;
background:#f3f7fc;
color:#14233b;
}

.header{
height:76px;
background:#fff;
border-bottom:1px solid #dfe7f0;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 24px;
position:sticky;
top:0;
z-index:10;
}

.brand{
display:flex;
align-items:center;
gap:12px;
}

.logo{
width:46px;
height:46px;
border-radius:14px;
background:linear-gradient(145deg,#1681ff,#0754c7);
color:#fff;
display:flex;
align-items:center;
justify-content:center;
font-size:24px;
font-weight:900;
box-shadow:0 5px 0 #063d91;
}

.brand-name{
font-size:21px;
font-weight:900;
}

.exam{
text-align:center;
}

.exam h2{
font-size:18px;
font-weight:900;
}

.exam p{
font-size:11px;
color:#7b8798;
margin-top:5px;
}

.timer{
background:#edf6ff;
border:1px solid #d7eaff;
border-radius:14px;
padding:8px 18px;
text-align:center;
min-width:120px;
}

.timer small{
font-size:9px;
font-weight:800;
color:#7c8999;
display:block;
}

#timer{
font-size:22px;
font-weight:900;
color:#176dd3;
margin-top:2px;
}

.main{
max-width:1450px;
margin:auto;
padding:20px;
display:grid;
grid-template-columns:minmax(0,1fr) 320px;
gap:20px;
}

.card{
background:#fff;
border:1px solid #e0e8f1;
border-radius:20px;
box-shadow:0 8px 30px rgba(20,50,90,.07);
overflow:hidden;
}

.qhead{
padding:19px 24px;
border-bottom:1px solid #edf1f5;
display:flex;
justify-content:space-between;
align-items:center;
}

.qnumber{
font-size:20px;
font-weight:900;
}

.qnumber span{
color:#176dd3;
}

.status{
padding:8px 13px;
border-radius:20px;
background:#f1f4f7;
font-size:11px;
font-weight:800;
color:#758195;
}

.status.answered{
background:#e8f8f1;
color:#119568;
}

.status.review{
background:#f0eaff;
color:#7652d3;
}

.qbody{
padding:30px;
min-height:440px;
}

.subject{
font-size:11px;
font-weight:900;
letter-spacing:1px;
color:#176dd3;
margin-bottom:14px;
}

.question{
font-size:19px;
font-weight:700;
line-height:1.65;
}

.options{
margin-top:28px;
display:grid;
gap:12px;
}

.option{
display:flex;
align-items:center;
gap:14px;
padding:14px;
border:1px solid #dce5ee;
border-radius:14px;
cursor:pointer;
transition:.2s;
}

.option:hover{
border-color:#1681ff;
background:#f7fbff;
}

.option.selected{
border-color:#176dd3;
background:#edf6ff;
}

.letter{
width:36px;
height:36px;
border-radius:10px;
background:#f0f4f8;
display:flex;
align-items:center;
justify-content:center;
font-weight:900;
flex-shrink:0;
}

.option.selected .letter{
background:#176dd3;
color:#fff;
}

.option-text{
font-size:14px;
font-weight:600;
line-height:1.45;
}

.controls{
padding:15px 20px;
border-top:1px solid #edf1f5;
display:flex;
gap:9px;
align-items:center;
flex-wrap:wrap;
}

.btn{
border:none;
border-radius:11px;
padding:12px 15px;
font-size:11px;
font-weight:900;
cursor:pointer;
}

.prev{
background:#fff;
border:1px solid #dce4ed;
color:#657286;
}

.next{
background:linear-gradient(145deg,#1681ff,#075acb);
color:#fff;
box-shadow:0 4px 0 #064499;
}

.clear{
background:#fff1f1;
color:#c85757;
}

.review{
background:#f1ebff;
color:#7350cf;
}

.submit{
margin-left:auto;
background:#10243f;
color:#fff;
}

.palette-card{
padding:18px;
height:max-content;
position:sticky;
top:96px;
}

.palette-head{
display:flex;
justify-content:space-between;
padding-bottom:15px;
border-bottom:1px solid #edf1f5;
}

.palette-head h3{
font-size:16px;
font-weight:900;
}

.palette-head span{
font-size:11px;
color:#7a8798;
font-weight:800;
}

.legend{
display:grid;
grid-template-columns:1fr 1fr;
gap:9px;
padding:15px 0;
border-bottom:1px solid #edf1f5;
}

.legend-item{
font-size:10px;
font-weight:700;
color:#69768a;
display:flex;
align-items:center;
gap:6px;
}

.dot{
width:11px;
height:11px;
border-radius:4px;
}

.green{background:#16a673}
.gray{background:#f1f4f7;border:1px solid #d8e0e8}
.purple{background:#7652d3}
.blue{background:#fff;border:2px solid #176dd3}

.palette{
margin-top:15px;
display:grid;
grid-template-columns:repeat(6,1fr);
gap:6px;
max-height:550px;
overflow-y:auto;
}

.pal{
height:36px;
border:1px solid #dce4ed;
background:#f7f9fb;
border-radius:8px;
font-size:10px;
font-weight:900;
cursor:pointer;
color:#617086;
}

.pal.answered{
background:#16a673;
border-color:#16a673;
color:#fff;
}

.pal.marked{
background:#7652d3;
border-color:#7652d3;
color:#fff;
}

.pal.current{
outline:2px solid #176dd3;
outline-offset:1px;
}

.result{
display:none;
position:fixed;
inset:0;
background:rgba(8,25,48,.65);
z-index:100;
align-items:center;
justify-content:center;
padding:18px;
}

.result-box{
background:#fff;
border-radius:22px;
width:min(700px,100%);
max-height:90vh;
overflow:auto;
padding:28px;
}

.result-box h2{
font-size:25px;
}

.result-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
margin-top:20px;
}

.result-item{
background:#f5f8fb;
border-radius:13px;
padding:15px;
}

.result-item small{
color:#788599;
font-weight:700;
}

.result-item strong{
display:block;
font-size:23px;
margin-top:5px;
}

.review-list{
margin-top:20px;
display:grid;
gap:10px;
}

.review-item{
padding:14px;
border:1px solid #e0e7ef;
border-radius:12px;
font-size:13px;
line-height:1.5;
}

.correct{color:#109568;font-weight:900}
.incorrect{color:#d34f4f;font-weight:900}
.unattempted{color:#788599;font-weight:900}

.close{
margin-top:18px;
background:#10243f;
color:#fff;
}

@media(max-width:850px){

.header{
padding:0 12px;
height:68px;
}

.brand-name{
display:none;
}

.logo{
width:40px;
height:40px;
}

.exam h2{
font-size:12px;
}

.exam p{
font-size:9px;
}

.timer{
min-width:92px;
padding:7px;
}

#timer{
font-size:17px;
}

.main{
grid-template-columns:1fr;
padding:12px;
}

.palette-card{
position:static;
}

.qbody{
padding:23px 17px;
min-height:400px;
}

.question{
font-size:17px;
}

.submit{
margin-left:0;
width:100%;
}

.palette{
grid-template-columns:repeat(8,1fr);
}

}

@media(max-width:500px){

.qhead{
padding:16px;
}

.qnumber{
font-size:16px;
}

.status{
font-size:9px;
}

.controls{
padding:12px;
}

.btn{
padding:11px 10px;
font-size:9px;
}

.palette{
grid-template-columns:repeat(7,1fr);
}

.result-grid{
grid-template-columns:1fr;
}

}
</style>
</head>

<body>

<header class="header">

<div class="brand">
<div class="logo">S</div>
<div class="brand-name">SRINEET</div>
</div>

<div class="exam">
<h2>ALLEN • LEADER TEST SERIES</h2>
<p>TEST 01 • NEET</p>
</div>

<div class="timer">
<small>TIME LEFT</small>
<div id="timer">180:00</div>
</div>

</header>


<main class="main">

<div class="card">

<div class="qhead">

<div class="qnumber">
Question <span id="number">1</span> of 180
</div>

<div id="status" class="status">
Not Answered
</div>

</div>


<div class="qbody">

<div class="subject" id="subject">PHYSICS</div>

<div class="question" id="question"></div>

<div class="options" id="options"></div>

</div>


<div class="controls">

<button class="btn prev" onclick="previousQuestion()">
← PREVIOUS
</button>

<button class="btn next" onclick="nextQuestion()">
SAVE & NEXT
</button>

<button class="btn clear" onclick="clearAnswer()">
CLEAR
</button>

<button class="btn review" onclick="markReview()">
MARK FOR REVIEW
</button>

<button class="btn submit" onclick="submitTest()">
SUBMIT TEST
</button>

</div>

</div>


<div class="card palette-card">

<div class="palette-head">
<h3>Question Palette</h3>
<span><b id="answered">0</b> / 180</span>
</div>

<div class="legend">

<div class="legend-item">
<span class="dot green"></span>
Answered
</div>

<div class="legend-item">
<span class="dot gray"></span>
Not Answered
</div>

<div class="legend-item">
<span class="dot purple"></span>
Review
</div>

<div class="legend-item">
<span class="dot blue"></span>
Current
</div>

</div>

<div class="palette" id="palette"></div>

</div>

</main>


<div class="result" id="result">

<div class="result-box">

<h2>Test Result</h2>

<p style="margin-top:5px;color:#778498">
ALLEN • LEADER TEST SERIES • TEST 01
</p>

<div class="result-grid">

<div class="result-item">
<small>Marks Obtained</small>
<strong id="marks">0</strong>
</div>

<div class="result-item">
<small>Correct</small>
<strong id="correct">0</strong>
</div>

<div class="result-item">
<small>Incorrect</small>
<strong id="incorrect">0</strong>
</div>

<div class="result-item">
<small>Unattempted</small>
<strong id="unattempted">0</strong>
</div>

</div>

<h3 style="margin-top:25px">
Answer Review
</h3>

<div class="review-list" id="reviewList"></div>

<button class="btn close" onclick="closeResult()">
CLOSE RESULT
</button>

</div>

</div>


<script>

/* =========================
   TEST SETTINGS
========================= */

const TOTAL = 180;

let current = 0;

let answers = Array(TOTAL).fill(null);

let reviews = Array(TOTAL).fill(false);


/* =========================
   QUESTIONS

   ABHI DEMO QUESTIONS HAIN.

   Actual paper baad mein
   isi format mein daalenge.
========================= */

const questions = [];

for(let i=1;i<=TOTAL;i++){

let subject;

if(i<=45){
subject="PHYSICS";
}
else if(i<=90){
subject="CHEMISTRY";
}
else{
subject="BIOLOGY";
}

questions.push({

subject:subject,

text:
"Demo NEET Question "+i+
": Which of the following statements is correct?",

options:[
"Option A — Correct answer",
"Option B — Incorrect statement",
"Option C — Incorrect statement",
"Option D — Incorrect statement"
],

answer:0

});

}


/* =========================
   LOAD QUESTION
========================= */

function load(){

let q=questions[current];

document.getElementById("number").textContent=current+1;

document.getElementById("subject").textContent=q.subject;

document.getElementById("question").textContent=q.text;

let box=document.getElementById("options");

box.innerHTML="";

let letters=["A","B","C","D"];

q.options.forEach((text,index)=>{

let option=document.createElement("div");

option.className="option";

if(answers[current]===index){
option.classList.add("selected");
}

option.innerHTML=
'<div class="letter">'+letters[index]+'</div>'+
'<div class="option-text">'+text+'</div>';

option.onclick=function(){

answers[current]=index;

load();

};

box.appendChild(option);

});

updateStatus();

updatePalette();

}


/* =========================
   STATUS
========================= */

function updateStatus(){

let s=document.getElementById("status");

s.className="status";

if(reviews[current]){

s.textContent="Marked for Review";

s.classList.add("review");

}
else if(answers[current]!==null){

s.textContent="Answered";

s.classList.add("answered");

}
else{

s.textContent="Not Answered";

}

}


/* =========================
   NEXT
========================= */

function nextQuestion(){

if(current<TOTAL-1){

current++;

load();

}

}


/* =========================
   PREVIOUS
========================= */

function previousQuestion(){

if(current>0){

current--;

load();

}

}


/* =========================
   CLEAR
========================= */

function clearAnswer(){

answers[current]=null;

load();

}


/* =========================
   REVIEW
========================= */

function markReview(){

reviews[current]=!reviews[current];

load();

}


/* =========================
   PALETTE
========================= */

function createPalette(){

let palette=document.getElementById("palette");

palette.innerHTML="";

for(let i=0;i<TOTAL;i++){

let button=document.createElement("button");

button.className="pal";

button.textContent=i+1;

button.onclick=function(){

current=i;

load();

};

palette.appendChild(button);

}

}


function updatePalette(){

let buttons=document.querySelectorAll(".pal");

let count=0;

buttons.forEach((button,index)=>{

button.className="pal";

if(answers[index]!==null){

button.classList.add("answered");

count++;

}

if(reviews[index]){

button.classList.remove("answered");

button.classList.add("marked");

}

if(index===current){

button.classList.add("current");

}

});

document.getElementById("answered").textContent=count;

}


/* =========================
   TIMER
========================= */

let seconds=180*60;

function timer(){

let min=Math.floor(seconds/60);

let sec=seconds%60;

document.getElementById("timer").textContent=
String(min).padStart(2,"0")+":"+
String(sec).padStart(2,"0");

if(seconds<=0){

calculate();

return;

}

seconds--;

}

setInterval(timer,1000);


/* =========================
   SUBMIT
========================= */

function submitTest(){

if(confirm("Are you sure you want to submit the test?")){

calculate();

}

}


/* =========================
   RESULT
========================= */

function calculate(){

let correct=0;

let incorrect=0;

let unattempted=0;

questions.forEach((q,i)=>{

if(answers[i]===null){

unattempted++;

}
else if(answers[i]===q.answer){

correct++;

}
else{

incorrect++;

}

});

let marks=(correct*4)-(incorrect*1);

document.getElementById("marks").textContent=marks;

document.getElementById("correct").textContent=correct;

document.getElementById("incorrect").textContent=incorrect;

document.getElementById("unattempted").textContent=unattempted;

createReview();

document.getElementById("result").style.display="flex";

}


/* =========================
   ANSWER REVIEW
========================= */

function createReview(){

let box=document.getElementById("reviewList");

box.innerHTML="";

questions.forEach((q,i)=>{

let div=document.createElement("div");

div.className="review-item";

let result;

if(answers[i]===null){

result='<span class="unattempted">Unattempted</span>';

}
else if(answers[i]===q.answer){

result='<span class="correct">Correct</span>';

}
else{

result='<span class="incorrect">Incorrect</span>';

}

div.innerHTML=

"<b>Question "+(i+1)+"</b>"+
"<br><br>"+
q.text+
"<br><br>"+
"Your Answer: "+
(answers[i]===null ? "Not Attempted" : q.options[answers[i]])+
"<br>"+
"Correct Answer: "+
q.options[q.answer]+
"<br><br>"+
result;

box.appendChild(div);

});

}


function closeResult(){

document.getElementById("result").style.display="none";

}


/* =========================
   START
========================= */

createPalette();

load();

timer();

</script>

</body>
</html>
